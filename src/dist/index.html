  --c-p1:#c4560a; --c-t1:#1f5fc4; --c-q1:#0a7c76; --c-l2:#6b3fc4; --c-l3:#3b7d1d; --c-l4:#b3205a;
  --code-bg:#edf0f5; --tk-kw:#7a3ec2; --tk-str:#1a7a3a; --tk-cm:#66718a; --tk-num:#b45309;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131a; --surface:#171d27; --surface-2:#1d2431; --ink:#e9edf3; --ink-2:#9ba7ba; --rule:#2c3646;
    --ink-btn:#e9edf3; --on-ink:#0f131a; --focus:#7aa6ff; --danger:#ff8a80;
    --c-p1:#f0a15c; --c-t1:#7aa8f0; --c-q1:#5cc9c2; --c-l2:#b89af0; --c-l3:#92cf72; --c-l4:#f08ab0;
    --code-bg:#0d1118; --tk-kw:#c4a1ff; --tk-str:#8fd694; --tk-cm:#7d8aa0; --tk-num:#f0b265;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#171d27; --surface-2:#1d2431; --ink:#e9edf3; --ink-2:#9ba7ba; --rule:#2c3646;
  --ink-btn:#e9edf3; --on-ink:#0f131a; --focus:#7aa6ff; --danger:#ff8a80;
  --c-p1:#f0a15c; --c-t1:#7aa8f0; --c-q1:#5cc9c2; --c-l2:#b89af0; --c-l3:#92cf72; --c-l4:#f08ab0;

.chip:hover{background:color-mix(in srgb,var(--cc) 10%,transparent)}

.chip.chk input{position:absolute;opacity:0;width:1px;height:1px}

<script type="text/plain" id="content">
@@chapter c1 | 1 | La codifica delle informazioni | Come un computer rappresenta numeri, testi, immagini e suoni usando solo 0 e 1.

@@section s1-1 | P1 T1 Q1 | - | Dati e informazioni
Un **dato** è la rappresentazione grezza di un fatto: un numero, una parola, un segnale. Diventa **informazione** quando ha un contesto che lo rende utile. Il numero `38,5` da solo è un dato. "La temperatura di Marco è 38,5 °C" è un'informazione.

Il computer tratta solo grandezze **discrete**. Per questo ogni informazione, prima di entrare in un computer, viene trasformata in una sequenza di cifre binarie. Questa trasformazione si chiama **codifica**.

## Analogico e digitale
- Un segnale **analogico** varia in modo continuo: il mercurio di un termometro, le onde sonore, la lancetta di un orologio.
- Un segnale **digitale** assume soltanto valori distinti: il display di un termometro elettronico, un interruttore acceso o spento.

> [Vita quotidiana] Un disco in vinile conserva il suono in modo analogico, con un solco continuo. Un file MP3 lo conserva in modo digitale, come una lunga serie di numeri.

?? Un orologio con le lancette è analogico o digitale?
!! Analogico: la lancetta si muove in modo continuo e può indicare qualsiasi posizione.
?? Il numero 1984 è un dato o un'informazione?
!! È un dato. Diventa un'informazione se aggiungiamo il contesto, per esempio "anno di pubblicazione del libro".

@@section s1-2 | P1 T1 Q1 | - | Il bit e il byte
Il **bit** (binary digit) è l'unità minima di informazione e vale 0 oppure 1. Si realizza con qualsiasi sistema a due stati: tensione alta o bassa, magnete orientato in un verso o nell'altro, cella carica o scarica.

Un gruppo di 8 bit forma un **byte**. Con n bit si possono scrivere `2^n` combinazioni diverse.

| Bit | Combinazioni | Esempio d'uso |
|---|---|---|
| 1 | 2 | acceso / spento |
| 2 | 4 | i quattro punti cardinali |
| 8 | 256 | un carattere ASCII esteso |
| 16 | 65 536 | un campione audio da CD |
| 24 | 16 777 216 | un colore RGB |

## Multipli del byte
Un kilobyte (KB) in senso commerciale vale 1000 byte. Il kibibyte (KiB) vale 1024 byte, cioè `2^10`. Lo stesso vale per MB e MiB, GB e GiB. Il sistema operativo e i produttori di dischi non sempre usano la stessa convenzione, ed è per questo che un disco da 500 GB sembra più piccolo di quanto dichiarato.

?? Quante combinazioni si ottengono con 5 bit?
!! 2^5 = 32 combinazioni.
?? Quanti bit servono almeno per distinguere 100 oggetti diversi?
!! 7 bit: con 6 bit si hanno solo 64 combinazioni, con 7 bit se ne hanno 128.

@@section s1-3 | P1 T1 Q1 | converter | Sistemi di numerazione: binario, ottale, esadecimale
Nel sistema **decimale** usiamo 10 cifre e ogni posizione vale una potenza di 10. Il sistema **binario** usa 2 cifre (0 e 1) e ogni posizione vale una potenza di 2, da destra verso sinistra: 1, 2, 4, 8, 16, 32, 64, 128.

Il numero binario `1101` vale 1·8 + 1·4 + 0·2 + 1·1 = **13**.

## Da decimale a binario
Si divide il numero per 2 più volte e si scrivono i resti. Poi si leggono dall'ultimo al primo.

```output
13 : 2 = 6   resto 1
 6 : 2 = 3   resto 0
 3 : 2 = 1   resto 1
 1 : 2 = 0   resto 1
Letti dal basso verso l'alto: 1101
```

## Esadecimale
Scrivere molti bit è scomodo. Il sistema **esadecimale** usa 16 cifre: 0-9 e poi A, B, C, D, E, F. Una cifra esadecimale corrisponde esattamente a 4 bit, quindi la conversione è immediata.

| Cifra | A | B | C | D | E | F |
|---|---|---|---|---|---|---|
| Valore | 10 | 11 | 12 | 13 | 14 | 15 |

Esempio: `1010 1111` in binario diventa `AF` in esadecimale, cioè 175 in decimale. Nel sistema **ottale** si raggruppano invece 3 bit alla volta e si usano le cifre da 0 a 7.

Prova il convertitore qui sotto: accendi e spegni i bit e osserva come cambiano gli altri valori.

?? Quanto vale 1010 in decimale?
!! 8 + 2 = 10.
?? Scrivi 25 in binario.
!! 11001, perché 16 + 8 + 1 = 25.
?? Come si scrive FF in decimale?
!! 15·16 + 15 = 255, il valore massimo di un byte.

@@section s1-4 | Q1 | - | Numeri negativi: il complemento a due
Con 8 bit si possono scrivere 256 valori. Per rappresentare anche i numeri negativi si usa il **complemento a due**: il bit più a sinistra ha peso negativo, pari a -128.

Per ottenere l'opposto di un numero si invertono tutti i bit e poi si somma 1. Esempio con +5:

```output
00000101   (+5)
11111010   (bit invertiti)
11111011   (+1)  ->  -5
```

Controllo: -128 + 64 + 32 + 16 + 8 + 2 + 1 = -5.

Con 8 bit il campo di valori va da -128 a +127. Il bit più a sinistra indica il segno: 0 per i positivi, 1 per i negativi. Il vantaggio principale è che la somma funziona con lo stesso circuito sia per i positivi sia per i negativi.

?? Come si scrive -1 su 8 bit?
!! 11111111. Si parte da 00000001, si invertono i bit (11111110) e si somma 1.
?? Qual è il numero rappresentato da 10000000 in complemento a due su 8 bit?
!! -128, perché c'è solo il bit di peso -128 acceso.

@@section s1-5 | T1 Q1 | - | La somma binaria
Le regole sono quattro:

| Operazione | Risultato | Riporto |
|---|---|---|
| 0 + 0 | 0 | 0 |
| 0 + 1 | 1 | 0 |
| 1 + 1 | 0 | 1 |
| 1 + 1 + 1 | 1 | 1 |

Si procede da destra verso sinistra come nella somma in colonna.

```output
  0110   (6)
+ 0011   (3)
------
  1001   (9)
```

## Overflow
Se il risultato non entra nei bit disponibili si ha un **overflow**. Con 4 bit, `1111 + 0001` darebbe `10000`, che richiede 5 bit: il bit più a sinistra va perso e il risultato sarebbe errato (0 invece di 16).

?? Calcola 1011 + 0101 e dì se c'è overflow con 4 bit.
!! Il risultato è 10000 (11 + 5 = 16). Servono 5 bit, quindi con 4 bit c'è overflow.

@@section s1-6 | P1 T1 Q1 | textbin | Codifica dei caratteri: ASCII e Unicode
Per scrivere un testo ogni carattere riceve un numero, il suo **codice**. La tabella **ASCII** (1963) usa 7 bit e definisce 128 caratteri: lettere dell'alfabeto inglese, cifre, punteggiatura e caratteri di controllo.

| Carattere | Codice decimale | Binario |
|---|---|---|
| A | 65 | 01000001 |
| B | 66 | 01000010 |
| a | 97 | 01100001 |
| 0 | 48 | 00110000 |
| spazio | 32 | 00100000 |

Una minuscola ha un codice maggiore di 32 rispetto alla maiuscola corrispondente: `a` vale 97 e `A` vale 65.

## Unicode
ASCII non contiene la è, la ñ, i caratteri giapponesi o gli emoji. **Unicode** assegna un numero (punto di codice) a più di 150 000 caratteri di tutte le lingue. La codifica più usata, **UTF-8**, impiega da 1 a 4 byte per carattere: i caratteri ASCII restano di 1 byte, una "è" ne occupa 2.

Scrivi qualcosa nel campo qui sotto, per esempio una parola con una lettera accentata, e guarda quanti byte servono.

?? Qual è il codice binario ASCII della lettera C?
!! C ha codice 67, quindi 01000011.
?? Perché il testo "caffè" occupa 6 byte in UTF-8 anche se ha 5 caratteri?
!! La lettera è non fa parte di ASCII e in UTF-8 usa 2 byte. Le altre quattro lettere usano 1 byte ciascuna.

@@section s1-7 | P1 T1 Q1 | rgb | Codifica delle immagini
Un'immagine digitale è una griglia di **pixel**. Ogni pixel ha un colore, descritto da numeri.

- In un'immagine in **bianco e nero** basta 1 bit per pixel.
- In un'immagine a **colori RGB** ogni pixel ha tre componenti (rosso, verde, blu) con valori da 0 a 255, quindi 3 byte, cioè 24 bit.

La dimensione non compressa si calcola così:

`byte = larghezza × altezza × bit per pixel ÷ 8`

Esempio: una foto Full HD (1920 × 1080) a 24 bit occupa 1920 × 1080 × 24 ÷ 8 = 6 220 800 byte, circa 5,93 MiB.

Il colore `#FF8000` si legge: rosso 255, verde 128, blu 0, cioè un arancione. Muovi i cursori qui sotto per vedere come cambiano il colore e i suoi bit.

?? Quanti byte occupa un'immagine in bianco e nero di 100 × 100 pixel?
!! 100 × 100 ÷ 8 = 1250 byte.
?? Quanti byte occupa un'immagine a colori 800 × 600 a 24 bit?
!! 800 × 600 × 3 = 1 440 000 byte, circa 1,37 MiB.

@@section s1-8 | P1 T1 Q1 | - | Codifica dei suoni
Il suono è un'onda continua. Per digitalizzarlo si misura l'altezza dell'onda a intervalli regolari. Ogni misura si chiama **campione**.

- La **frequenza di campionamento** è il numero di campioni al secondo, in hertz (Hz).
- La **profondità** è il numero di bit di ogni campione.
- I **canali** sono 1 per il mono, 2 per lo stereo.

`byte al secondo = frequenza × (profondità ÷ 8) × canali`

Un CD audio usa 44 100 Hz, 16 bit e 2 canali: 44 100 × 2 × 2 = 176 400 byte al secondo. Un minuto di musica occupa 10 584 000 byte, circa 10,1 MiB.

?? Quanti byte occupano 10 secondi di audio mono a 8000 Hz e 8 bit (qualità telefonica)?
!! 8000 × 1 × 1 × 10 = 80 000 byte.
?? Se raddoppio la frequenza di campionamento, che cosa succede alla dimensione del file?
!! Raddoppia, perché ogni secondo contiene il doppio dei campioni.

@@section s1-9 | T1 Q1 | - | La compressione
La **compressione** riduce la dimensione di un file.

- Compressione **senza perdita** (lossless): il file originale si ricostruisce esattamente. Esempi: ZIP, PNG, FLAC.
- Compressione **con perdita** (lossy): si eliminano dettagli poco percepibili. Esempi: JPEG, MP3.

Un metodo semplice è la codifica per sequenze (RLE): le ripetizioni vengono sostituite dal numero di ripetizioni.

```output
AAAABBBCC  ->  4A3B2C
9 caratteri    6 caratteri
```

Il **rapporto di compressione** è la dimensione originale divisa per quella compressa. Una foto di 6 220 800 byte che diventa un JPEG di 600 000 byte ha un rapporto di circa 10 a 1.

?? Una foto va salvata con la massima fedeltà per un archivio storico. Conviene un formato lossy o lossless?
!! Lossless, perché permette di ricostruire l'originale senza perdere nulla.
?? Comprimi con RLE la sequenza XXXXXXYYZ.
!! 6X2Y1Z.

@@section s1-10 | P1 | - | Casi pratici: leggere le dimensioni dei file
Questa sezione si svolge in laboratorio con il computer. Per ogni caso si scrive il calcolo e poi si controlla il risultato nelle proprietà del file.

## Caso 1: una foto del telefono
Una foto da 12 megapixel misura 4000 × 3000 pixel. Non compressa a 24 bit occupa 4000 × 3000 × 3 = 36 000 000 byte, circa 34,3 MiB. Il file reale è molto più piccolo perché è compresso in JPEG.

## Caso 2: una chiavetta USB
Una chiavetta da 16 GB contiene 16 000 000 000 byte. Divisi per 36 000 000 byte danno circa 444 foto non compresse.

## Caso 3: un brano MP3
Un brano a 128 kbit/s produce 128 000 bit al secondo, cioè 16 000 byte al secondo. Un minuto occupa 960 000 byte, circa 0,92 MiB.

## Da fare in laboratorio
1. Crea un file di testo con la parola "informatica" e guarda quanti byte occupa.
2. Aggiungi lo stesso testo 100 volte e confronta la dimensione.
3. Confronta la dimensione di una foto prima e dopo averla ridotta con un programma di fotoritocco.

?? Quanti byte occupa la parola "ciao" salvata in un file di testo ASCII, senza altri caratteri?
!! 4 byte, uno per lettera.

@@chapter c2 | 2 | La macchina di Von Neumann | Le parti di un computer e il modo in cui eseguono un programma.

@@section s2-1 | P1 T1 Q1 | - | L'architettura di Von Neumann
Nel 1945 il matematico John von Neumann descrisse l'organizzazione che ancora oggi è alla base dei computer. L'idea più importante è che **programma e dati stanno nella stessa memoria**. Cambiare programma significa solo scrivere altre istruzioni in memoria, senza ricollegare fili.

| Componente | Che cosa fa |
|---|---|
| CPU | Esegue le istruzioni e fa i calcoli |
| Memoria centrale | Contiene programma e dati in uso |
| Bus | Collega le parti. Ci sono il bus dei dati, degli indirizzi e di controllo |
| Dispositivi di I/O | Tastiera, schermo, disco, rete: collegano il computer al mondo esterno |

> [Analogia] Una cucina funziona come una piccola macchina di Von Neumann. Il cuoco è la CPU. Il ricettario e gli ingredienti sono nella dispensa, cioè la memoria. Il cuoco prende una riga della ricetta alla volta, la esegue e passa alla successiva.

Poiché istruzioni e dati viaggiano sullo stesso bus, la CPU spesso deve aspettare la memoria. Questo limite si chiama **collo di bottiglia di Von Neumann**.

?? Dove si trova un programma mentre è in esecuzione?
!! Nella memoria centrale, insieme ai dati che usa.
?? Che cosa trasporta il bus degli indirizzi?
!! Il numero della cella di memoria a cui la CPU vuole accedere.

@@section s2-2 | T1 Q1 | - | La CPU: ALU, unità di controllo e registri
La CPU è composta da tre parti principali.

| Parte | Funzione |
|---|---|
| ALU (unità aritmetico-logica) | Esegue somme, sottrazioni, confronti e operazioni logiche (AND, OR, NOT) |
| CU (unità di controllo) | Legge le istruzioni e comanda le altre parti |
| Registri | Piccole memorie velocissime dentro la CPU |

## I registri principali
- **PC** (Program Counter): contiene l'indirizzo della prossima istruzione da eseguire.
- **IR** (Instruction Register): contiene l'istruzione che si sta eseguendo.
- **ACC** (accumulatore): contiene i risultati intermedi dei calcoli.
- **Flag**: bit che segnalano risultato zero, riporto, overflow.

I registri sono molto più veloci della RAM, ma ce ne sono pochi, perché costano molto e occupano spazio nel chip.

?? Quale registro dice alla CPU dove trovare la prossima istruzione?
!! Il PC, il Program Counter.
?? Quale parte della CPU calcola 7 + 5?
!! L'ALU.

@@section s2-3 | P1 T1 Q1 | cpu | Il ciclo fetch-decode-execute
Ogni istruzione passa per tre fasi, ripetute all'infinito.

1. **Fetch**: la CPU legge dalla memoria l'istruzione indicata dal PC, la copia in IR e aumenta il PC.
2. **Decode**: l'unità di controllo capisce che cosa significa l'istruzione.
3. **Execute**: l'istruzione viene eseguita, per esempio una somma nell'ALU.

Il mini computer qui sotto ha 10 celle di memoria e queste istruzioni:

| Istruzione | Effetto |
|---|---|
| LOAD n | Copia in ACC il numero contenuto nella cella n |
| ADD n | Somma ad ACC il numero della cella n |
| SUB n | Sottrae da ACC il numero della cella n |
| STORE n | Scrive ACC nella cella n |
| HALT | Ferma il programma |

Il programma di partenza somma i numeri delle celle 6 e 7 e mette il risultato nella cella 8. Premi **Passo** per vedere una fase alla volta, oppure **Esegui**.

?? Dopo LOAD 6 quanto vale ACC, se la cella 6 contiene 12?
!! ACC vale 12.
?? Cambia la cella 7 in 100 e riesegui. Che numero compare alla fine nella cella 8?
!! 112, cioè 12 + 100.
?? Come cambieresti il programma per calcolare 30 - 12?
!! Si scrive LOAD 7 e poi SUB 6: ACC parte da 30 e gli si sottrae 12.

@@section s2-4 | P1 T1 Q1 | - | Le memorie
| Memoria | Volatile? | Velocità | Uso tipico |
|---|---|---|---|
| Registri | Sì | Altissima | Dati in uso dalla CPU |
| Cache | Sì | Molto alta | Copia dei dati usati più spesso |
| RAM | Sì | Alta | Programmi e dati in esecuzione |
| ROM / firmware | No | Media | Programma di avvio del computer |
| SSD | No | Media | Archivio di file e programmi |
| Disco rigido (HDD) | No | Bassa | Archivio di grandi quantità di dati |

Una memoria **volatile** perde il contenuto quando manca la corrente.

## La gerarchia delle memorie
Più una memoria è veloce, più è piccola e costosa. Per questo i computer ne usano diversi livelli: registri, cache, RAM, SSD o disco. La CPU cerca prima nelle memorie veloci e scende ai livelli più lenti solo se serve.

?? Perché spegnendo il computer si perde il lavoro non salvato?
!! Il lavoro è in RAM, che è volatile. Salvandolo viene copiato su SSD o disco, che conservano i dati senza corrente.
?? Perché non si costruisce un computer con sola cache, che è velocissima?
!! Costa troppo e occupa troppo spazio per avere grandi quantità.

@@section s2-5 | P1 | - | I componenti di un computer reale
Lo schema di Von Neumann ha un corrispondente fisico in ogni computer. Questa sezione serve per riconoscerli.

| Componente reale | Dove si colloca nello schema |
|---|---|
| Processore (CPU) | CPU |
| Moduli RAM | Memoria centrale |
| SSD o disco rigido | Memoria di massa |
| Scheda madre | Bus e collegamenti tra tutte le parti |
| Scheda video | Dispositivo di uscita (calcolo grafico e schermo) |
| Alimentatore | Fornisce la corrente a tutte le parti |

## Attività guidata
Con il docente si apre un computer dismesso. Prima di toccare qualcosa:
1. Si spegne il computer e si scollega il cavo di alimentazione.
2. Si scarica l'elettricità statica toccando una parte metallica del case.
3. Si lavora senza forzare i connettori.

Poi si individuano la scheda madre, la CPU con il suo dissipatore, i moduli RAM, il disco e l'alimentatore, e si scrive per ciascuno l'etichetta presente sul componente.

?? Se un computer ha poca RAM, quale sintomo si nota?
!! Diventa lento quando si aprono molti programmi, perché il sistema deve spostare dati su disco.
?? Quale componente collega CPU, RAM e dischi tra loro?
!! La scheda madre, con i suoi bus.

@@section s2-6 | T1 Q1 | - | Prestazioni: frequenza, core e cache
La **frequenza di clock** (in GHz) dice quanti cicli al secondo compie la CPU. Il **periodo** di un ciclo è l'inverso della frequenza.

`periodo = 1 ÷ frequenza`

Una CPU a 2 GHz compie 2 000 000 000 cicli al secondo, quindi un ciclo dura 0,5 nanosecondi. Se un'istruzione richiede 4 cicli, dura 2 ns e la CPU ne esegue 500 milioni al secondo.

## Altri fattori
- I **core** sono CPU complete dentro lo stesso chip e permettono di eseguire più programmi insieme.
- La **cache** riduce l'attesa della memoria, tenendo vicino alla CPU i dati usati più spesso.
- La frequenza da sola non basta: due CPU con lo stesso clock possono avere prestazioni molto diverse.

?? Quanto dura un ciclo di clock in una CPU a 4 GHz?
!! 1 ÷ 4 000 000 000 s = 0,25 ns.
?? Una CPU a 1 GHz esegue istruzioni da 5 cicli ciascuna. Quante ne esegue al secondo?
!! 1 000 000 000 ÷ 5 = 200 milioni.

@@section s2-7 | Q1 | - | Linguaggio macchina e assembly
La CPU capisce soltanto sequenze di bit. Il **linguaggio macchina** è questa sequenza. L'**assembly** è una scrittura leggibile dello stesso programma, con nomi al posto dei numeri.

Nel nostro mini computer ogni istruzione è lunga 8 bit: 4 bit per il codice operativo (opcode) e 4 bit per l'indirizzo.

| Istruzione | Opcode |
|---|---|
| HALT | 0000 |
| LOAD | 0001 |
| ADD | 0010 |
| SUB | 0011 |
| STORE | 0100 |

Il programma della sezione precedente diventa:

| Indirizzo | Assembly | Binario | Esadecimale |
|---|---|---|---|
| 0 | LOAD 6 | 0001 0110 | 16 |
| 1 | ADD 7 | 0010 0111 | 27 |
| 2 | STORE 8 | 0100 1000 | 48 |
| 3 | HALT | 0000 0000 | 00 |

Con 4 bit per l'indirizzo si possono indicare 16 celle, da 0 a 15. Qui si vede il legame con la codifica: istruzioni e dati sono entrambi numeri binari e solo il contesto dice come interpretarli.

?? Come si codifica SUB 5 in binario?
!! Opcode 0011 e indirizzo 0101, quindi 0011 0101, cioè 35 in esadecimale.
?? Quante istruzioni diverse si potrebbero definire con un opcode di 4 bit?
!! 2^4 = 16 istruzioni.

@@chapter c3 | 3 | Algoritmi con Flowgorithm e basi di Python | Dall'idea di algoritmo ai primi programmi, con esempi tratti dalle altre materie.

@@section s3-1 | L2 | - | Che cos'è un algoritmo
Un **algoritmo** è una sequenza finita di passi, non ambigui, che trasforma dei dati di ingresso (**input**) in un risultato (**output**). Deve avere quattro proprietà:

- **finito**: termina dopo un numero limitato di passi;
- **non ambiguo**: ogni passo ha un solo significato;
- **eseguibile**: ogni passo può essere realmente svolto;
- **generale**: risolve una classe di problemi, non un solo caso.

> [Chimica] Il protocollo di una titolazione è un algoritmo: si misura il volume di soluzione, si aggiunge l'indicatore, si versa il titolante goccia a goccia finché cambia colore, si legge il volume usato.

> [Matematica] L'algoritmo di Euclide calcola il massimo comune divisore: si divide il numero maggiore per il minore, e si ripete con divisore e resto finché il resto vale 0. L'ultimo divisore è il MCD.

> [Intelligenza artificiale] In un programma tradizionale le regole le scrive una persona. Nell'apprendimento automatico il computer ricava le regole dagli esempi. In entrambi i casi alla base ci sono algoritmi.

?? Una ricetta che dice "cuoci fino a quando è pronto" è un buon algoritmo?
!! No, perché "pronto" è ambiguo. Un buon algoritmo indica una condizione precisa, per esempio "cuoci per 12 minuti".
?? Perché un procedimento che non termina mai non è un algoritmo?
!! Perché deve essere finito: deve arrivare a un risultato dopo un numero limitato di passi.

@@section s3-2 | L2 | - | Flowgorithm: simboli e struttura
**Flowgorithm** è un programma gratuito che permette di costruire un algoritmo come diagramma di flusso e di eseguirlo passo per passo. Può anche tradurre il diagramma in codice per vari linguaggi, tra cui Python.

| Blocco | Forma | Funzione |
|---|---|---|
| Main / End | Ovale | Inizio e fine del programma |
| Declare | Rettangolo | Crea una variabile con il suo tipo |
| Assign | Rettangolo | Assegna un valore a una variabile |
| Input | Parallelogramma | Legge un valore dalla tastiera |
| Output | Parallelogramma | Mostra un valore a schermo |
| If | Rombo | Sceglie tra due percorsi |
| While, Do, For | Anelli | Ripetono un blocco |

## Tipi di variabili
Flowgorithm usa quattro tipi: **Integer** (interi), **Real** (numeri decimali), **String** (testo) e **Boolean** (vero o falso).

## Come si costruisce un programma
1. Si dà un nome a ogni dato (variabile) e se ne sceglie il tipo.
2. Si leggono gli input.
3. Si calcola.
4. Si mostrano gli output.

?? Di che tipo è la variabile "massa" se vale 12,5 grammi?
!! Real, perché è un numero con la virgola.
?? Quale blocco serve per chiedere un numero all'utente?
!! Input.

@@section s3-3 | L2 | flow | Selezione: il blocco If
La **selezione** permette al programma di scegliere tra due percorsi in base a una condizione. La condizione è un'espressione che vale vero o falso, per esempio `pH < 7`.

> [Chimica] Un programma legge il pH di una soluzione e dice se è acida (pH minore di 7), neutra (pH uguale a 7) o basica (pH maggiore di 7). Servono due blocchi If uno dopo l'altro: il primo separa le acide dal resto, il secondo separa le neutre dalle basiche.

Il diagramma qui sotto è quello disegnato in Flowgorithm. Cambia il valore di pH e osserva quale percorso si illumina.

Lo stesso algoritmo scritto in Python:

```python
ph = float(input("pH della soluzione: "))
if ph < 7:
    print("acida")
elif ph == 7:
    print("neutra")
else:
    print("basica")
```

?? Che cosa stampa il programma se ph vale 7?
!! "neutra": la prima condizione (ph < 7) è falsa, la seconda (ph == 7) è vera.
?? Che cosa stampa se ph vale 13,2?
!! "basica", perché nessuna delle due condizioni è vera e si va nel ramo finale.

@@section s3-4 | L2 | - | Iterazione: i cicli While e For
Un'**iterazione** ripete un blocco di istruzioni. In Flowgorithm ci sono due casi.

- **While**: ripete finché una condizione è vera. Il controllo avviene all'inizio, quindi il blocco può non essere eseguito mai.
- **For**: ripete per un numero di volte noto, con una variabile che conta da un valore iniziale a uno finale.

## Esempio: somma dei primi 5 numeri
Variabili: `n` parte da 1, `somma` parte da 0. Finché n è minore o uguale a 5: si aggiunge n alla somma e si aumenta n di 1.

Per verificare un algoritmo si compila una **tabella di traccia**, che riporta il valore delle variabili a ogni giro:

| Giro | n prima | somma dopo |
|---|---|---|
| 1 | 1 | 1 |
| 2 | 2 | 3 |
| 3 | 3 | 6 |
| 4 | 4 | 10 |
| 5 | 5 | 15 |

> [Fisica] Nella caduta libera lo spazio percorso dopo t secondi è h = ½·g·t², con g = 9,8 m/s². Un ciclo For con t da 1 a 5 calcola e mostra l'altezza ogni secondo.

Attenzione: se in un While la condizione non diventa mai falsa, il programma non termina mai. Nell'esempio sopra succede se ci si dimentica di aumentare n.

?? Quanti giri compie un For con la variabile che va da 3 a 7?
!! 5 giri: 3, 4, 5, 6, 7.
?? Perché un ciclo While può non essere eseguito mai?

@@section s3-7 | L2 | - | Curvatura IA: un classificatore a regole

In questo programma la soglia 2,5 cm è stata scelta da una persona guardando i dati. Un algoritmo di **apprendimento automatico** fa la stessa cosa in modo automatico: prova molte soglie, misura quante volte sbaglia sugli esempi e tiene la migliore.

Il nostro programma ha un limite: separa bene due gruppi ma non distingue versicolor da virginica. Servirebbero altre misure, per esempio la larghezza del petalo, e altre regole.

@@section s4-1 | L3 | - | Il paradigma strutturato
La programmazione **strutturata** si basa su un risultato teorico (teorema di Böhm-Jacopini): qualunque algoritmo si può scrivere usando solo tre strutture.

- **Sequenza**: le istruzioni si eseguono una dopo l'altra.
- **Selezione**: `if`, `elif`, `else`.
- **Iterazione**: `while` e `for`.

Per tenere ordinato un programma lungo si scompone il problema in problemi più piccoli, e ognuno diventa una **funzione**. Questo metodo si chiama progettazione top-down.

> [Fisica] Per simulare il lancio di un proiettile si possono definire tre funzioni: una calcola la posizione, una la gittata, una stampa la tabella. Il programma principale le richiama nell'ordine giusto.

In questo anno si lavora senza classi e oggetti, che arrivano in quarta. I dati si organizzano con liste, tuple e dizionari.

## Più valori di ritorno
> [Matematica] Radici di un'equazione di secondo grado ax² + bx + c = 0.

```python
import math

def risolvi(a, b, c):
    delta = b * b - 4 * a * c
    if delta < 0:
        return None
    x1 = (-b + math.sqrt(delta)) / (2 * a)
    x2 = (-b - math.sqrt(delta)) / (2 * a)
    return x1, x2

print(risolvi(1, -3, 2))
print(risolvi(1, 0, 1))
```

```output
(2.0, 1.0)
None
```

@@section s4-6 | L3 | - | Ricerca e ordinamento
Due problemi classici sono cercare un valore in una lista e ordinare una lista.

## Ricerca binaria
Se la lista è già ordinata si guarda l'elemento di mezzo. Se è più grande del valore cercato si continua nella metà sinistra, altrimenti nella destra. A ogni passo si scarta metà dei dati.

```python
def ricerca_binaria(lista, x):
    inizio, fine = 0, len(lista) - 1
    while inizio <= fine:
        medio = (inizio + fine) // 2
        if lista[medio] == x:
            return medio
        elif lista[medio] < x:
            inizio = medio + 1
        else:
            fine = medio - 1
    return -1

print(ricerca_binaria([1, 3, 5, 7, 9, 11], 7))
```

```output
3
```

## Ordinamento a bolle
```python
def ordina(lista):
    n = len(lista)
    for i in range(n - 1):
        for j in range(n - 1 - i):
            if lista[j] > lista[j + 1]:
                lista[j], lista[j + 1] = lista[j + 1], lista[j]
    return lista

print(ordina([5, 2, 9, 1]))
```

```output
[1, 2, 5, 9]
```

> [Scienze naturali] Ordinare un elenco di animali per massa corporea, dal più leggero al più pesante, è un'applicazione diretta dell'ordinamento.

?? Quanti confronti servono al massimo per cercare con la ricerca binaria in una lista di 1000 elementi ordinati?
!! Circa 10, perché 2^10 = 1024: a ogni passo i dati si dimezzano.
?? Quando la ricerca binaria non si può usare?
!! Quando la lista non è ordinata.

@@section s4-8 | L3 | - | Ricorsione
Una funzione è **ricorsiva** se richiama sé stessa su un problema più piccolo. Servono due cose: un **caso base**, che si risolve direttamente, e un **passo ricorsivo**.

> [Matematica] Il fattoriale di n è n · (n-1) · … · 1. Si può definire così: 1! = 1 e n! = n · (n-1)!.

```python
def fattoriale(n):
    if n <= 1:
        return 1
    return n * fattoriale(n - 1)

print(fattoriale(5))
```

```output
120
```

> [Matematica e Fisica] Il metodo Monte Carlo stima π lanciando punti a caso in un quadrato di lato 1. La frazione di punti caduti dentro il quarto di cerchio di raggio 1 si avvicina a π/4.

```python
import random

dentro = 0
N = 100000
for _ in range(N):
    x = random.random()
    y = random.random()
    if x * x + y * y <= 1:
        dentro += 1
print("π ≈", 4 * dentro / N)

Il risultato cambia a ogni esecuzione ed è tanto più vicino a 3,14159 quanto più grande è N.

?? Che cosa succede se in fattoriale si dimentica il caso base?

?? Quanto vale fattoriale(4)?

@@section s4-9 | L3 | - | Progetto: il lancio di un proiettile
Il progetto riunisce funzioni, cicli, selezione e formattazione dell'output, senza usare oggetti.

> [Fisica] Un proiettile lanciato con velocità v0 e angolo α segue le leggi del moto: x = v0·cos(α)·t e y = v0·sin(α)·t - ½·g·t². La gittata teorica è v0²·sin(2α) ÷ g.

```python
import math

g = 9.8

def posizione(v0, angolo, t):
    a = math.radians(angolo)
    x = v0 * math.cos(a) * t
    y = v0 * math.sin(a) * t - 0.5 * g * t * t
    return x, y

def gittata(v0, angolo):
    a = math.radians(angolo)
    return v0 ** 2 * math.sin(2 * a) / g

t = 0.0
while True:
    x, y = posizione(20, 45, t)
    if y < 0:
        break
    print(round(t, 1), round(x, 1), round(y, 1))
    t += 0.5

print("Gittata teorica:", round(gittata(20, 45), 1), "m")
```

Con v0 = 20 m/s e α = 45° l'ultima riga stampata è `Gittata teorica: 40.8 m`.

?? A che serve il ciclo while True con break nel programma?
!! A ripetere il calcolo senza conoscere in anticipo quanti passi servono: il ciclo si ferma quando il proiettile tocca terra (y negativa).

@@chapter c5 | 5 | Programmazione a oggetti | Classi, oggetti, ereditarietà e polimorfismo applicati a modelli scientifici.

@@section s5-1 | L4 | - | Dal procedurale agli oggetti
Finora i dati (variabili, liste) e le funzioni che li usano sono stati separati. Nella programmazione a oggetti si uniscono: un **oggetto** contiene i propri dati (**attributi**) e le operazioni che li riguardano (**metodi**).

Una **classe** è lo stampo da cui si creano gli oggetti. Ogni oggetto creato da una classe è un'**istanza**.

> [Fisica] Una particella ha una massa e una velocità, e può calcolare la propria energia cinetica.

```python
class Particella:
    def __init__(self, massa, velocita):
        self.massa = massa
        self.velocita = velocita

    def energia_cinetica(self):
        return 0.5 * self.massa * self.velocita ** 2

p = Particella(2, 3)
print(p.energia_cinetica())
```

```output
9.0
```

I vantaggi sono l'ordine (tutto ciò che riguarda la particella è nello stesso posto), il riuso del codice e la possibilità di modellare sistemi con tanti elementi simili.

?? Che differenza c'è tra classe e oggetto?
!! La classe è il modello generale. L'oggetto è un esemplare concreto creato dalla classe, con i suoi valori.
?? Come si crea una seconda particella con massa 5 e velocità 1?
!! q = Particella(5, 1).

@@section s5-2 | L4 | - | Costruttore, attributi e metodi
Il metodo speciale `__init__` è il **costruttore**: viene eseguito quando si crea un oggetto e inizializza gli attributi. Il primo parametro, `self`, è l'oggetto stesso.

> [Scienze naturali] Un animale ha un nome, una specie e un numero di zampe.

```python
class Animale:
    def __init__(self, nome, specie, zampe):
        self.nome = nome
        self.specie = specie
        self.zampe = zampe

    def __str__(self):
        return f"{self.nome} ({self.specie}), {self.zampe} zampe"

gatto = Animale("Micio", "Felis catus", 4)
print(gatto)
```

```output
Micio (Felis catus), 4 zampe
```

Il metodo `__str__` dice come mostrare l'oggetto quando lo si stampa.

## Attributi di classe e di istanza
Gli attributi creati con `self` appartengono a un singolo oggetto. Un attributo scritto nel corpo della classe è condiviso da tutti gli oggetti.

> [Chimica] Una classe Elemento può avere come attributo condiviso la costante di Avogadro, uguale per tutti gli elementi.

?? Che cosa succede se si dimentica self nella definizione di un metodo?
!! Python segnala un errore, perché l'oggetto viene passato automaticamente come primo argomento e il metodo non ha un parametro che lo riceva.
?? Quando viene eseguito __init__?
!! Ogni volta che si crea un nuovo oggetto della classe.

@@section s5-3 | L4 | - | Incapsulamento
L'**incapsulamento** protegge i dati di un oggetto: gli attributi si modificano solo attraverso metodi che controllano che il valore sia accettabile. In Python, per convenzione, un nome che inizia con `_` indica un attributo interno.

> [Chimica] Il pH di una soluzione deve stare tra 0 e 14. La classe rifiuta valori diversi.

```python
class Soluzione:
    def __init__(self, ph):
        self.ph = ph

    @property
    def ph(self):
        return self._ph

    @ph.setter
    def ph(self, valore):
        if not 0 <= valore <= 14:
            raise ValueError("Il pH deve essere tra 0 e 14")
        self._ph = valore

    def tipo(self):
        if self._ph < 7:
            return "acida"
        elif self._ph == 7:
            return "neutra"
        return "basica"

s = Soluzione(3.5)
print(s.tipo())
s.ph = 20
```

```output
acida
ValueError: Il pH deve essere tra 0 e 14
```

Il codice che usa la classe scrive `s.ph = 20` come se fosse un normale attributo, ma il controllo viene eseguito ogni volta. La classe garantisce di essere sempre in uno stato valido.

?? Perché l'incapsulamento rende i programmi più affidabili?
!! Perché i controlli sono in un solo punto, la classe, e nessuna altra parte del programma può mettere l'oggetto in uno stato non valido.
?? Che cosa succede con Soluzione(-1)?
!! Il costruttore assegna self.ph, il setter controlla e solleva un ValueError.

@@section s5-4 | L4 | - | Ereditarietà
L'**ereditarietà** permette di creare una classe a partire da un'altra. La classe figlia riceve attributi e metodi della classe madre e può aggiungerne o modificarli.

> [Scienze naturali] La classificazione biologica è una gerarchia: ogni organismo ha un nome, un animale ha in più un modo di muoversi, un mammifero ha in più il fatto di allattare.

```python
class Organismo:
    def __init__(self, nome):
        self.nome = nome

    def descrivi(self):
        return self.nome + " è un organismo"

class Animale(Organismo):
    def descrivi(self):
        return self.nome + " è un animale"

class Mammifero(Animale):
    def descrivi(self):
        return super().descrivi() + " che allatta i piccoli"

print(Organismo("quercia").descrivi())
print(Mammifero("gatto").descrivi())
```

gatto è un animale che allatta i piccoli
```

`super()` richiama il metodo della classe madre. La relazione di ereditarietà si legge "è un": un mammifero è un animale, un animale è un organismo.

!! Lo eredita da Organismo attraverso Animale, e va bene così perché non servono altri attributi.
?? Quando conviene l'ereditarietà e quando no?
!! Conviene quando c'è una vera relazione "è un". Se la relazione è "ha un" (un'auto ha un motore), è meglio mettere un oggetto dentro un altro.

@@section s5-5 | L4 | - | Polimorfismo
Il **polimorfismo** permette di trattare allo stesso modo oggetti di classi diverse, purché abbiano un metodo con lo stesso nome. Ogni oggetto esegue la propria versione.

> [Matematica] Cerchi e rettangoli hanno entrambi un'area, ma la calcolano in modo diverso.

```python
import math

class Cerchio:
    def __init__(self, r):
        self.r = r

    def area(self):
        return math.pi * self.r ** 2

class Rettangolo:
    def __init__(self, b, h):
        self.b = b
        self.h = h

    def area(self):
        return self.b * self.h

figure = [Cerchio(1), Rettangolo(2, 3)]
for f in figure:
    print(round(f.area(), 2))
```

```output
3.14
6
```

Il ciclo non deve sapere di che figura si tratta: chiama `area()` e ogni oggetto risponde a modo suo. Aggiungere un Triangolo non richiede di cambiare il ciclo.

?? Che cosa serve per aggiungere un Triangolo all'elenco delle figure?
!! Una nuova classe Triangolo con un metodo area(). Il ciclo continua a funzionare senza modifiche.
?? Che cosa stampa round(Rettangolo(2, 3).area(), 2)?
!! 6.

@@section s5-6 | L4 | - | Progetto: un neurone artificiale
Un **neurone artificiale** è un modello matematico molto semplice. Riceve dei numeri in ingresso, li moltiplica per dei **pesi**, somma un **bias** e produce 1 se il risultato è positivo, altrimenti 0. Le reti neurali usate nell'intelligenza artificiale sono fatte di moltissimi neuroni di questo tipo, messi in fila.

> [Logica e Matematica] Con pesi 1 e 1 e bias -1,5 il neurone si comporta come la porta logica AND: dà 1 solo se entrambi gli ingressi valgono 1.

```python
class Neurone:
    def __init__(self, pesi, bias):
        self.pesi = pesi
        self.bias = bias

    def attiva(self, ingressi):
        somma = self.bias
        for p, x in zip(self.pesi, ingressi):
            somma += p * x
        return 1 if somma > 0 else 0

and_logico = Neurone([1, 1], -1.5)
print(and_logico.attiva([1, 1]), and_logico.attiva([1, 0]))
```

```output
1 0
```

## Richieste

2. Costruisci una classe Rete che contiene una lista di neuroni e li interroga tutti.
3. Cambia i pesi a mano e osserva come cambiano le risposte: è ciò che un algoritmo di apprendimento fa in automatico.

?? Che cosa dà and_logico.attiva([0, 0])?
!! 0, perché la somma è -1,5, non positiva.
?? Quali pesi e bias danno la porta OR?
!! Per esempio pesi 1 e 1 e bias -0,5: la somma è positiva se almeno un ingresso vale 1.

@@chapter c6 | 6 | Basi di dati | Database relazionali con SQL e database non relazionali con documenti JSON.

@@section s6-1 | L4 | - | Perché servono i database
Un file di testo va bene per pochi dati. Quando i dati crescono e li usano più persone, nascono problemi: informazioni **ripetute** in più punti, dati **incoerenti**, ricerche lente, accessi in conflitto.

Un **database** è un insieme organizzato di dati. Un **DBMS** (Database Management System) è il programma che lo gestisce: garantisce che i dati siano corretti, ne controlla l'accesso e risponde alle interrogazioni.

> [Fisica] Un registro di laboratorio con migliaia di misure, raccolte da più sensori e da più gruppi di studenti.

> [Scienze naturali] Un catalogo delle specie di un parco naturale, con habitat, massa e avvistamenti.

## Due grandi famiglie
- **Database relazionali**: i dati sono in tabelle collegate tra loro. Si interrogano con il linguaggio SQL.
- **Database non relazionali** (NoSQL): i dati sono in forme più libere, come documenti, coppie chiave-valore o grafi.

?? Che cosa fa un DBMS?
!! Gestisce un database: memorizza i dati, ne garantisce la correttezza e risponde alle richieste degli utenti.
?? Perché ripetere lo stesso dato in più file è un problema?
!! Perché se cambia va corretto ovunque. Se se ne dimentica uno, i dati diventano incoerenti.

@@section s6-2 | L4 | - | Il modello relazionale
Nel modello relazionale i dati sono in **tabelle**. Ogni riga è un **record**, ogni colonna è un **attributo** con un tipo.

> [Chimica] Tabella `elemento` della tavola periodica.

| numero_atomico | simbolo | nome | massa |
|---|---|---|---|
| 1 | H | Idrogeno | 1.008 |
| 6 | C | Carbonio | 12.011 |
| 8 | O | Ossigeno | 15.999 |
| 11 | Na | Sodio | 22.99 |
| 17 | Cl | Cloro | 35.45 |

## Chiavi
- **Chiave primaria**: attributo che identifica un record in modo unico, qui `numero_atomico`.
- **Chiave esterna**: attributo che contiene la chiave primaria di un'altra tabella e crea il collegamento.

## Vincoli di integrità
Il DBMS rifiuta le operazioni che violano le regole: due record con la stessa chiave primaria, una chiave esterna che punta a un record inesistente, un valore vuoto dove non è ammesso.

?? Perché il nome dell'elemento non è una buona chiave primaria?
!! Potrebbe cambiare o avere più forme (per esempio in lingue diverse). Il numero atomico è unico e stabile.
?? Che cosa impedisce una chiave esterna?
!! Impedisce di collegare un record a un altro che non esiste.

@@section s6-3 | L4 | - | Progettazione: modello E-R e normalizzazione
Prima di creare le tabelle si disegna il **modello Entità-Relazione**: le **entità** sono le cose che interessano, le **associazioni** i legami tra loro.

Le associazioni hanno una **cardinalità**:
- **uno a molti** (1:N): un habitat ospita molte specie. Si realizza con una chiave esterna nella tabella "molti".
- **molti a molti** (N:M): una specie vive in più habitat e un habitat ospita più specie. Si realizza con una **tabella ponte**.

> [Scienze naturali] Specie e habitat sono legate da un'associazione N:M.

```output
SPECIE  (id_specie PK, nome, nome_scientifico)
HABITAT (id_habitat PK, nome)
VIVE_IN (id_specie FK, id_habitat FK)
```

## Normalizzazione
Serve a eliminare le ripetizioni. Le prime tre forme normali dicono, in sintesi:
1. Ogni cella contiene un solo valore, non un elenco.
2. Ogni attributo dipende dall'intera chiave primaria.
3. Ogni attributo dipende solo dalla chiave primaria, non da altri attributi.

?? Perché serve una tabella ponte per l'associazione N:M?
!! Perché una singola colonna non può contenere più valori. La tabella ponte ha una riga per ogni coppia (specie, habitat).
?? Una cella contiene "foresta, tundra, montagna". Quale forma normale viola?
!! La prima: una cella deve contenere un solo valore.

@@section s6-4 | L4 | - | SQL: interrogare i dati
SQL (Structured Query Language) è il linguaggio dei database relazionali. L'interrogazione fondamentale è `SELECT`.

> [Chimica] Elementi con massa maggiore di 15, dal più pesante al più leggero.

```sql
SELECT simbolo, nome, massa
FROM elemento
WHERE massa > 15
ORDER BY massa DESC;
```

```output
simbolo | nome     | massa
Cl      | Cloro    | 35.45
Na      | Sodio    | 22.99
O       | Ossigeno | 15.999
```

## Le clausole principali
| Clausola | A che serve |
|---|---|
| `SELECT` | Sceglie le colonne da mostrare |
| `FROM` | Indica la tabella |
| `WHERE` | Filtra i record |
| `ORDER BY` | Ordina il risultato |
| `GROUP BY` | Raggruppa i record per calcolare totali o medie |
| `JOIN` | Unisce più tabelle tramite le chiavi |

## JOIN
> [Scienze naturali] Specie che vivono nella tundra.

```sql
SELECT specie.nome, habitat.nome
FROM specie
JOIN vive_in ON vive_in.id_specie = specie.id_specie
JOIN habitat ON habitat.id_habitat = vive_in.id_habitat
WHERE habitat.nome = 'tundra';
```

## Funzioni di gruppo
> [Fisica] Temperatura media misurata da ciascun sensore.

```sql
SELECT sensore, AVG(temperatura)
FROM misura
GROUP BY sensore;
```

?? Scrivi l'interrogazione che mostra solo i nomi degli elementi con numero atomico minore di 10.
!! SELECT nome FROM elemento WHERE numero_atomico < 10;
?? A che serve GROUP BY?
!! A raggruppare i record che hanno lo stesso valore in una colonna, per applicare funzioni come AVG, SUM, COUNT a ciascun gruppo.

@@section s6-5 | L4 | - | SQL da Python con sqlite3
Python include il modulo `sqlite3`, che gestisce un database relazionale in un singolo file, senza installare nulla. Con `":memory:"` il database vive solo in memoria.

> [Chimica] Creazione della tabella degli elementi e interrogazione.

```python
import sqlite3

conn = sqlite3.connect(":memory:")
cur = conn.cursor()
cur.execute("CREATE TABLE elemento (simbolo TEXT PRIMARY KEY, nome TEXT, massa REAL)")
cur.executemany(
    "INSERT INTO elemento VALUES (?, ?, ?)",
    [("H", "Idrogeno", 1.008), ("C", "Carbonio", 12.011), ("O", "Ossigeno", 15.999)],
)
conn.commit()
for riga in cur.execute("SELECT nome, massa FROM elemento WHERE massa > 10"):
    print(riga)
```

```output
('Carbonio', 12.011)
('Ossigeno', 15.999)
```

## I segnaposto `?`
I valori non vanno mai incollati dentro il testo della query. Si usano i segnaposto `?` e si passano i valori a parte. Così si evita la **SQL injection**, un attacco in cui l'utente scrive codice SQL al posto di un normale valore.

## Scrivere e salvare
`conn.commit()` rende definitive le modifiche. Con un nome di file al posto di `":memory:"` i dati restano anche dopo la chiusura del programma.

?? Perché serve conn.commit() dopo gli INSERT?
!! Perché senza commit le modifiche non vengono scritte in modo definitivo nel database.
?? Perché non si scrive "... WHERE nome = '" + nome + "'" nella query?
!! Un utente potrebbe inserire codice SQL come nome e farlo eseguire (SQL injection). I segnaposto ? lo impediscono.

@@section s6-6 | L4 | - | Database non relazionali (NoSQL)
Non tutti i dati stanno comodamente in tabelle. I database **NoSQL** (Not only SQL) usano modelli diversi.

| Tipo | Come organizza i dati | Esempio di sistema |
|---|---|---|
| Documentale | Documenti JSON con campi liberi | MongoDB |
| Chiave-valore | Coppie chiave e valore, come un grande dizionario | Redis |
| A grafo | Nodi e archi che li collegano | Neo4j |
| A colonne | Tabelle a righe molto larghe, distribuite su molti server | Cassandra |

## Relazionali e documentali a confronto
| Aspetto | Relazionale | Documentale |
|---|---|---|
| Struttura | Tabelle con schema fisso | Documenti con campi che possono variare |
| Collegamenti | Chiavi esterne e JOIN | Documenti annidati o riferimenti |
| Linguaggio | SQL | Interrogazioni proprie del sistema |
| Garanzie | Transazioni ACID | Dipende dal sistema, spesso coerenza meno rigida |

**ACID** sta per Atomicità, Coerenza, Isolamento, Durabilità: sono le proprietà che rendono una transazione affidabile, per esempio un bonifico bancario.

> [Storia] La rete dei rapporti tra personaggi e luoghi di un periodo storico si rappresenta bene con un grafo: ogni persona è un nodo e ogni legame è un arco.

?? Quale tipo di NoSQL userebbe un sito per conservare le sessioni degli utenti, con ricerca veloce per codice?
!! Chiave-valore (per esempio Redis): la chiave è il codice di sessione e il valore sono i dati.
?? Perché per un conto bancario si preferisce un database con transazioni ACID?
!! Perché un trasferimento deve avvenire per intero o non avvenire, e nessun dato deve restare a metà.

**JSON** è un formato di testo per scrivere dati strutturati. Somiglia ai dizionari e alle liste di Python. I database documentali conservano documenti di questo tipo.

@@section s6-8 | L4 | - | Scegliere il database giusto
Non esiste un database migliore in assoluto. La scelta dipende da come sono fatti i dati e da come si usano.

| Situazione | Scelta ragionevole | Perché |
|---|---|---|
| Registro voti di una scuola | Relazionale | Dati regolari, legami precisi tra studenti, classi, materie |
| Catalogo di prodotti con caratteristiche diverse | Documentale | Ogni prodotto ha campi diversi |
| Misure di sensori ogni secondo | Database per serie temporali o relazionale | Moltissimi record tutti dello stesso tipo |
| Rete di amicizie o di citazioni | A grafo | I collegamenti sono la parte importante |
| Dati temporanei di una sessione web | Chiave-valore | Accesso molto veloce per chiave |

      out.push('<aside class="callout">'+(label?'<span class="co-l">'+esc(label)+'</span>':'')+q.map(x=>'<p>'+inline(x)+'</p>').join('')+'</aside>');
      continue;
    }
    if(/^\|/.test(l)){
      const rows=[];while(i<L.length&&/^\|/.test(L[i]))rows.push(L[i++].trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim()));
      let head=null;
      if(rows.length>1&&rows[1].every(c=>/^:?-+:?$/.test(c))){head=rows[0];rows.splice(0,2);}
      out.push('<div class="tbl"><table>'+(head?'<thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead>':'')+'<tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
      continue;
    }
    if(/^- /.test(l)){
      const it=[];while(i<L.length&&/^- /.test(L[i]))it.push(L[i++].slice(2));
      out.push('<ul>'+it.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>');continue;
    }
    if(/^\d+\. /.test(l)){
      const it=[];while(i<L.length&&/^\d+\. /.test(L[i]))it.push(L[i++].replace(/^\d+\.\s/,''));
      out.push('<ol>'+it.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>');continue;
    }
    if(/^\?\? /.test(l)){
      const q=l.slice(3);i++;const ans=[];
      if(i<L.length&&/^!! /.test(L[i])){
        ans.push(L[i].slice(3));i++;
        while(i<L.length&&L[i].trim()&&!/^(\?\?|!!) /.test(L[i]))ans.push(L[i++]);
      }
      out.push('<details class="ex"><summary>'+inline(q)+'</summary><div class="ans">'+(ans.length?ans.map(a=>'<p>'+inline(a)+'</p>').join(''):'<p><em>Risposta non indicata.</em></p>')+'</div></details>');
      continue;
    }
    const p=[];
    while(i<L.length&&L[i].trim()&&!special.test(L[i]))p.push(L[i++]);
    if(!p.length)p.push(L[i++]);
    out.push('<p>'+inline(p.join(' '))+'</p>');
  }
  return out.join('');
}

function norm(s){

function all(){
  const map={};
  baseList.forEach(b=>{map[b.id]=Object.assign({},b,{_base:true});});
  Object.keys(overrides).forEach(id=>{
    const o=overrides[id]||{};
    if(map[id])map[id]=Object.assign(map[id],o,{_over:true});

  return Object.keys(map).map(k=>norm(map[k])).sort((a,b)=>chIndex(a.chapter)-chIndex(b.chapter)||a.order-b.order||a.id.localeCompare(b.id));
}

async function put(id,data){
  const prev=overrides[id];overrides[id]=data;
  try{if(mode==='db')await dbh.doc('sections/'+id).set(data);else lsSet(LS_OV,overrides);}
  catch(e){if(prev===undefined)delete overrides[id];else overrides[id]=prev;throw e;}
}
async function del(id){
  const prev=overrides[id];delete overrides[id];

  catch(e){if(prev!==undefined)overrides[id]=prev;throw e;}

function cpuWidget(root){
  const id='cpu'+(++UID);
  const PROG=['LOAD 6','ADD 7','STORE 8','HALT','','','12','30','0',''],N=PROG.length;
  root.innerHTML='<div class="wg-h">Mini computer a 10 celle</div>'+
    '<p class="wg-note">Le celle contengono sia istruzioni sia dati, come nell\'idea di Von Neumann. Puoi cambiare i valori e riavviare.</p>'+
    '<div class="regs"><div class="reg"><b>PC</b><span data-r="pc"></span></div><div class="reg"><b>IR</b><span data-r="ir"></span></div><div class="reg"><b>ACC</b><span data-r="acc"></span></div></div>'+
    '<div class="phases" aria-hidden="true"><span>Fetch</span><span>Decode</span><span>Execute</span></div>'+
    '<div class="mem">'+PROG.map((p,i)=>'<label class="cell"><span class="addr">Cella '+i+'</span><input id="'+id+'-m'+i+'" value="'+esc(p)+'" spellcheck="false" autocomplete="off"></label>').join('')+'</div>'+
    '<p class="cpu-log" role="status" aria-live="polite"></p>'+
    '<div class="wg-btns"><button type="button" class="btn primary" data-a="step">Passo</button><button type="button" class="btn" data-a="run">Esegui</button><button type="button" class="btn" data-a="reset">Riavvia</button><button type="button" class="btn" data-a="restore">Ripristina esempio</button></div>';
  const ins=$$('.mem input',root),cells=$$('.cell',root),ph=$$('.phases span',root),log=$('.cpu-log',root);
  const R=k=>$('[data-r='+k+']',root),stepB=$('[data-a=step]',root),runB=$('[data-a=run]',root);
  let pc=0,ir='',acc=0,phase=0,halted=false,op=null,arg=null,touch=-1,timer=null;
  const say=(t,e)=>{log.textContent=t;log.classList.toggle('err',!!e);};
  function stopT(){if(timer){clearInterval(timer);timer=null;}runB.textContent='Esegui';}
  function paint(){
    R('pc').textContent=pc;R('ir').textContent=ir||'—';R('acc').textContent=acc;
    ph.forEach((p,i)=>p.classList.toggle('on',!halted&&i===phase));
    cells.forEach((c,i)=>{c.classList.toggle('pc',!halted&&phase===0&&i===pc);c.classList.toggle('touch',i===touch);});
    stepB.disabled=halted;
  }
  function fail(m){halted=true;stopT();say(m,true);paint();}
  function step(){
    if(halted)return;
    if(!root.isConnected){stopT();return;}
    if(phase===0){
      if(pc>=N){fail('Il PC punta fuori dalla memoria: la CPU si ferma.');return;}
      ir=ins[pc].value.trim().toUpperCase();touch=pc;
      say('FETCH: la CPU legge la cella '+pc+' ("'+(ir||'vuota')+'"), la copia in IR e porta PC a '+(pc+1)+'.');
      pc++;phase=1;
    }else if(phase===1){
      const m=/^(LOAD|ADD|SUB|STORE)\s+(\d+)$/.exec(ir);
      if(m){
        op=m[1];arg=parseInt(m[2],10);
        if(arg>=N){fail('DECODE: la cella '+arg+' non esiste. Le celle vanno da 0 a '+(N-1)+'.');return;}
        say('DECODE: l\'unità di controllo riconosce '+op+' sulla cella '+arg+'.');
      }else if(ir==='HALT'){op='HALT';arg=null;say('DECODE: istruzione HALT, il programma sta per fermarsi.');}
      else{fail('DECODE: "'+(ir||'cella vuota')+'" non è un\'istruzione valida. La CPU si ferma.');return;}
      phase=2;
    }else{
      if(op==='HALT'){halted=true;stopT();say('EXECUTE: HALT. Programma terminato con ACC = '+acc+'.');}
      else if(op==='STORE'){ins[arg].value=String(acc);touch=arg;say('EXECUTE: STORE scrive '+acc+' nella cella '+arg+'.');phase=0;}
      else{
        const t=ins[arg].value.trim();
        if(!/^-?\d+$/.test(t)){fail('EXECUTE: la cella '+arg+' contiene "'+(t||'niente')+'", non un numero.');return;}
        const n=parseInt(t,10);touch=arg;
        if(op==='LOAD'){acc=n;say('EXECUTE: LOAD copia '+n+' dalla cella '+arg+' in ACC.');}
        else if(op==='ADD'){acc+=n;say('EXECUTE: ADD somma '+n+' ad ACC, che ora vale '+acc+'.');}
        else{acc-=n;say('EXECUTE: SUB sottrae '+n+' da ACC, che ora vale '+acc+'.');}
        phase=0;
      }
    }
    paint();
  }
  function reset(){stopT();pc=0;ir='';acc=0;phase=0;halted=false;op=null;arg=null;touch=-1;say('Pronto. Premi Passo per eseguire una fase alla volta.');paint();}
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='step'){stopT();step();}
    else if(a==='run'){if(timer){stopT();}else if(!halted){runB.textContent='Pausa';timer=setInterval(step,380);}}
    else if(a==='reset')reset();
    else if(a==='restore'){ins.forEach((x,i)=>{x.value=PROG[i];});reset();}
  });
  reset();
}

}
const WIDGETS={
  converter:{label:'Convertitore binario, decimale, esadecimale',fn:converterWidget},
  textbin:{label:'Da testo a byte (ASCII e UTF-8)',fn:textbinWidget},
  rgb:{label:'Mixer di colori RGB',fn:rgbWidget},
  cpu:{label:'Simulatore della macchina di Von Neumann',fn:cpuWidget},
  flow:{label:'Diagramma di flusso con percorso (pH)',fn:flowWidget}
};

/* ---------- disegno della pagina ---------- */
function buildChips(){
  $('#chips').innerHTML=CLASSES.map(c=>'<button type="button" class="chip" style="--cc:var('+c.v+')" data-cls="'+c.id+'" aria-pressed="false" title="'+esc(c.name)+'">'+sym(c,16)+'<span>'+esc(c.short)+'</span></button>').join('');
}
function syncChips(){
  $$('#chips .chip').forEach(b=>b.setAttribute('aria-pressed',filter.has(b.dataset.cls)?'true':'false'));
  $('#clearF').hidden=filter.size===0;
}
function syncUi(){
  const be=$('#btnEdit');
  be.hidden=!canWrite;be.setAttribute('aria-pressed',editOn?'true':'false');be.textContent=editOn?'Fine modifica':'Modifica';
  $('#btnSrc').hidden=mode!=='local';
  $('#sync').textContent=mode==='db'?(canWrite?'Modifiche condivise con i colleghi':'Sola lettura'):'Modifiche salvate solo in questo browser';
  const n=$('#editNote');n.hidden=!(editOn&&canWrite);
  n.textContent=mode==='db'?'Modalità modifica attiva. Ogni salvataggio è subito visibile a tutti i colleghi che hanno accesso a questa pagina.':'Modalità modifica attiva. Le modifiche restano solo in questo browser. Per condividerle con i colleghi apri la pagina con il tuo account.';
}
function toolsHtml(s,i,n){
  if(!(editOn&&canWrite))return '';
  if(confirmState&&confirmState.id===s.id){
    const del=confirmState.kind==='del';
    return '<div class="tools-s"><span class="conf">'+(del?'Eliminare questa sezione?':'Tornare al testo originale?')+'</span><button class="tb danger" type="button" data-act="'+(del?'delyes':'restyes')+'">Sì</button><button class="tb" type="button" data-act="no">Annulla</button></div>';
  }
  return '<div class="tools-s"><button class="tb" type="button" data-act="edit">Modifica</button><button class="tb" type="button" data-act="up" aria-label="Sposta su"'+(i===0?' disabled':'')+'>↑</button><button class="tb" type="button" data-act="down" aria-label="Sposta giù"'+(i===n-1?' disabled':'')+'>↓</button>'+(s._over&&s._base?'<button class="tb" type="button" data-act="rest">Ripristina originale</button>':'')+'<button class="tb danger" type="button" data-act="del">Elimina</button></div>';
}
const SYNTAX=['## Sottotitolo','Testo con **grassetto** e `codice`.','- elenco puntato','1. elenco numerato','> [Fisica] Esempio tratto da un\'altra materia','| Colonna A | Colonna B |','|---|---|','| dato | dato |','?? Domanda con risposta nascosta','!! Risposta alla domanda','','Codice colorato: una riga con ```python (oppure sql, json),','il codice, poi una riga con ```','Risultato o schema senza colori: ```output ... ```'].join('\n');
function editorHtml(s){
  const p='ed-'+s.id;
  const chk=CLASSES.map(c=>'<label class="chip chk" style="--cc:var('+c.v+')"><input type="checkbox" name="cls" value="'+c.id+'" id="'+p+'-c-'+c.id+'"'+(s.classes.indexOf(c.id)>=0?' checked':'')+'>'+sym(c,16)+'<span>'+esc(c.short)+'</span></label>').join('');
  const opts='<option value="">Nessuno</option>'+Object.keys(WIDGETS).map(k=>'<option value="'+k+'"'+(s.widget===k?' selected':'')+'>'+esc(WIDGETS[k].label)+'</option>').join('');
  return '<form class="editor" data-id="'+esc(s.id)+'" novalidate>'+
    '<div class="fld"><label for="'+p+'-t">Titolo della sezione</label><input id="'+p+'-t" name="title" type="text" value="'+esc(s.title)+'" maxlength="140"></div>'+
    '<fieldset class="fld"><legend>Classi a cui è destinata</legend><div class="chips">'+chk+'</div></fieldset>'+
    '<div class="fld"><label for="'+p+'-w">Strumento interattivo in fondo alla sezione</label><select id="'+p+'-w" name="widget">'+opts+'</select></div>'+matsEditor(s,p)+
    '<div class="ed-grid"><div class="fld"><label for="'+p+'-b">Contenuto</label><textarea id="'+p+'-b" name="body" spellcheck="true">'+esc(s.body)+'</textarea></div><div class="fld"><span class="lbl">Anteprima</span><div class="prose preview">'+renderBody(s.body)+'</div></div></div>'+
    '<details class="syntax"><summary>Come si scrive il contenuto</summary><pre>'+esc(SYNTAX)+'</pre></details>'+
    '<p class="ed-err" role="alert" hidden></p>'+
    '<div class="ed-act"><button class="btn primary" type="submit">Salva</button><button class="btn" type="button" data-act="cancel">Annulla</button></div></form>';
}
function sectionNode(s,i,n){
  const isEd=editing.has(s.id),cached=nodes[s.id];
  if(isEd&&cached&&cached.editing)return cached.el;
  const tools=editOn&&canWrite;
  const sig=JSON.stringify([s.title,s.body,s.classes,s.widget,s.materials,isEd,tools,confirmState&&confirmState.id===s.id?confirmState.kind:'',!!s._over,!!s._custom,i===0,i===n-1]);
  if(cached&&cached.sig===sig)return cached.el;
  const el=document.createElement('article');el.className='sec';el.id='sec-'+s.id;
  const band='<div class="band" aria-hidden="true">'+s.classes.map(c=>'<span style="background:var('+CL[c].v+')"></span>').join('')+'</div>';
  if(isEd&&tools){
    el.innerHTML=band+'<div class="sec-in"><div class="sec-h"><div class="sec-t"><div class="tags">'+s.classes.map(c=>tag(CL[c])).join('')+'</div><h3>Modifica sezione</h3></div></div>'+editorHtml(s)+'</div>';
  }else{
    el.innerHTML=band+'<div class="sec-in"><div class="sec-h"><div class="sec-t"><div class="tags">'+s.classes.map(c=>tag(CL[c])).join('')+'</div><h3>'+esc(s.title)+'</h3></div>'+toolsHtml(s,i,n)+'</div><div class="prose">'+renderBody(s.body)+'</div>'+(s.widget&&WIDGETS[s.widget]?'<section class="wg" aria-label="'+esc(WIDGETS[s.widget].label)+'"></section>':'')+matsHtml(s)+'</div>';
    const slot=$('.wg',el);
    if(slot){try{WIDGETS[s.widget].fn(slot);}catch(e){slot.textContent='Lo strumento interattivo non si è caricato.';}}
  }
  nodes[s.id]={sig:sig,el:el,editing:isEd&&tools};
  return el;
}
function renderToc(vs){
  let h='';
  chapters.forEach(ch=>{
    const l=vs.filter(s=>s.chapter===ch.id);if(!l.length)return;
    h+='<div class="toc-ch"><a class="toc-cht" href="#chap-'+ch.id+'" data-go="chap-'+ch.id+'"><b>'+esc(ch.num)+'</b>'+esc(ch.title)+'</a><ul>'+l.map(s=>'<li><a href="#sec-'+s.id+'" data-go="sec-'+s.id+'"><span class="mini">'+s.classes.map(c=>sym(CL[c],10)).join('')+'</span><span>'+esc(s.title)+'</span></a></li>').join('')+'</ul></div>';
  });
  $('#toc').innerHTML=h||'<p class="empty">Nessuna sezione per le classi scelte.</p>';
}
function render(){
  const secs=all(),vs=secs.filter(visible);
  syncChips();renderToc(vs);
  $('#count').textContent=vs.length+(vs.length===1?' sezione':' sezioni');
  const main=$('#main'),frag=document.createDocumentFragment(),used={};
  chapters.forEach(ch=>{
    const list=vs.filter(s=>s.chapter===ch.id);
    if(!list.length&&!editOn)return;
    const sec=document.createElement('section');sec.className='chap';sec.id='chap-'+ch.id;
    const cs=CLASSES.filter(c=>secs.some(s=>s.chapter===ch.id&&!s.deleted&&s.classes.indexOf(c.id)>=0));
    sec.innerHTML='<header class="chap-h"><span class="num" aria-hidden="true">'+esc(ch.num)+'</span><div><h2>'+esc(ch.title)+'</h2><p>'+esc(ch.desc)+'</p><div class="tags">'+cs.map(tag).join('')+'</div></div></header><div class="secs"></div>';
    const holder=$('.secs',sec);
    list.forEach((s,i)=>{used[s.id]=1;holder.appendChild(sectionNode(s,i,list.length));});
    if(!list.length)holder.innerHTML='<p class="empty">Nessuna sezione di questo capitolo per le classi scelte.</p>';
    if(editOn&&canWrite){const b=document.createElement('button');b.type='button';b.className='btn add';b.dataset.act='add';b.dataset.chapter=ch.id;b.textContent='+ Aggiungi una sezione a questo capitolo';sec.appendChild(b);}
    frag.appendChild(sec);
  });
  if(!frag.childNodes.length){const p=document.createElement('p');p.className='empty';p.textContent='Nessuna sezione corrisponde alle classi scelte.';frag.appendChild(p);}
  const hidden=secs.filter(s=>s.deleted);
  if(editOn&&canWrite&&hidden.length){
    const d=document.createElement('details');d.className='hid';
    d.innerHTML='<summary>Sezioni eliminate ('+hidden.length+')</summary><ul>'+hidden.map(s=>'<li data-id="'+esc(s.id)+'"><span>'+esc(s.title)+'</span><button class="tb" type="button" data-act="undel" data-id="'+esc(s.id)+'">Ripristina</button></li>').join('')+'</ul>';
    frag.appendChild(d);
  }
  main.replaceChildren(frag);
  Object.keys(nodes).forEach(k=>{if(!used[k])delete nodes[k];});
}

/* ---------- azioni ---------- */
async function move(id,dir){
  const vs=all().filter(visible),me=vs.find(s=>s.id===id);if(!me)return;
  const same=vs.filter(s=>s.chapter===me.chapter),i=same.findIndex(s=>s.id===id),nb=same[i+dir];if(!nb)return;
  if(me.order===nb.order){await put(me.id,Object.assign(fields(me),{order:nb.order+(dir<0?-1:1)}));}
  else{const a=me.order,b=nb.order;await put(me.id,Object.assign(fields(me),{order:b}));await put(nb.id,Object.assign(fields(nb),{order:a}));}
  render();
}
async function addSection(chId){
  const secs=all().filter(s=>s.chapter===chId);
  const order=secs.reduce((m,s)=>Math.max(m,s.order===9999?0:s.order),0)+10;
  const id='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const classes=filter.size?Array.from(filter):[CLASSES[0].id];
  await put(id,{chapter:chId,order:order,title:'Nuova sezione',body:'## Sottotitolo\nScrivi qui il contenuto.',classes:classes,widget:'',deleted:false,custom:true});
  newIds.add(id);editing.add(id);render();
  const f=$('#sec-'+id+' input[name=title]');if(f){f.focus();f.select();}
  const el=document.getElementById('sec-'+id);if(el)el.scrollIntoView({block:'start'});
}
async function saveEditor(form){
  const id=form.dataset.id,s=all().find(x=>x.id===id);if(!s)return;
  const err=$('.ed-err',form),title=form.elements.title.value.trim();
  const classes=$$('input[name=cls]:checked',form).map(x=>x.value);
  if(!title){err.textContent='Scrivi un titolo.';err.hidden=false;return;}
  if(!classes.length){err.textContent='Scegli almeno una classe.';err.hidden=false;return;}
  const mats=[];let badUrl=false;
  $$('.matrow',form).forEach(r=>{
    const u=$('[name=murl]',r).value.trim();if(!u)return;
    const cu=cleanUrl(u);if(!cu){badUrl=true;return;}
    mats.push({kind:$('[name=mkind]',r).value,title:$('[name=mtitle]',r).value.trim(),url:cu});
  });
  if(badUrl){err.textContent='Un indirizzo non è valido: deve iniziare con https:// oppure con allegati/.';err.hidden=false;return;}
  const data=Object.assign(fields(s),{title:title,classes:classes,body:form.elements.body.value.replace(/\s+$/,''),widget:form.elements.widget.value,materials:mats,deleted:false});
  try{await put(id,data);newIds.delete(id);editing.delete(id);render();toast('Sezione salvata.');}catch(e){writeError(e);}
}
async function act(a,id,btn){
  try{
    if(a==='edit'){editing.add(id);confirmState=null;render();const f=$('#sec-'+id+' input[name=title]');if(f)f.focus();}
    else if(a==='cancel'){editing.delete(id);if(newIds.has(id)){newIds.delete(id);await del(id);}render();}
    else if(a==='up')await move(id,-1);
    else if(a==='down')await move(id,1);
    else if(a==='del'){confirmState={id:id,kind:'del'};render();}
    else if(a==='rest'){confirmState={id:id,kind:'rest'};render();}
    else if(a==='no'){confirmState=null;render();}
    else if(a==='delyes'){
      confirmState=null;const s=all().find(x=>x.id===id);
      if(s){if(s._custom)await del(id);else await put(id,Object.assign(fields(s),{deleted:true}));}
      render();toast('Sezione eliminata. In fondo alla pagina puoi ripristinarla.');
    }
    else if(a==='restyes'){confirmState=null;await del(id);render();toast('Testo originale ripristinato.');}
    else if(a==='undel'){const rid=btn.dataset.id,s=all().find(x=>x.id===rid);if(s){await put(rid,Object.assign(fields(s),{deleted:false}));render();}}
    else if(a==='add')await addSection(btn.dataset.chapter);
  }catch(e){writeError(e);}
}

function exportMd(){
  const vs=all().filter(visible);
  let out='# Informatica in Classe\n\n';
  if(filter.size)out+='Classi: '+CLASSES.filter(c=>filter.has(c.id)).map(c=>c.name).join('; ')+'\n\n';
  chapters.forEach(ch=>{
    const l=vs.filter(s=>s.chapter===ch.id);if(!l.length)return;
    out+='## '+ch.num+'. '+ch.title+'\n\n';
    l.forEach(s=>{
      const body=s.body.replace(/^## /gm,'#### ').replace(/^\?\? /gm,'**Domanda:** ').replace(/^!! /gm,'**Risposta:** ');
      out+='### '+s.title+'\n\n_Classi: '+s.classes.map(c=>CL[c].name).join('; ')+'_\n\n'+body+'\n\n'+(s.materials.length?'**Materiali della lezione**\n'+s.materials.map(m=>'- '+(m.title||MKINDS[m.kind].label)+': '+m.url).join('\n')+'\n\n':'');
    });
  });
  saveFile('informatica-in-classe.md',out);
}
function exportSrc(){
  const secs=all().filter(s=>!s.deleted&&s.classes.length);
  let out='';
  chapters.forEach(ch=>{
    out+='@@chapter '+ch.id+' | '+ch.num+' | '+ch.title+' | '+ch.desc+'\n\n';
    secs.filter(s=>s.chapter===ch.id).forEach(s=>{
      out+='@@section '+s.id+' | '+s.classes.join(' ')+' | '+(s.widget||'-')+' | '+s.title.replace(/\|/g,'/')+'\n'+s.materials.map(m=>'@@material '+m.kind+' | '+m.title.replace(/\|/g,'/')+' | '+m.url+'\n').join('')+s.body+'\n\n';
    });
  });
  saveFile('content.txt',out.trim()+'\n');
}
function saveFile(name,text){
  if(dl){
    dl.save({filename:name,data:text}).then(()=>toast('File salvato.')).catch(e=>{if(!e||e.code!=='declined')toast('Non è stato possibile salvare il file.');});
    return;
  }
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));
    a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('File scaricato.');
  }catch(e){toast('Non è stato possibile salvare il file.');}
}

/* ---------- eventi ---------- */
function bind(){
  $('#chips').addEventListener('click',e=>{
    const b=e.target.closest('.chip');if(!b)return;const id=b.dataset.cls;
    if(filter.has(id))filter.delete(id);else filter.add(id);
    lsSet(LS_FILTER,Array.from(filter));render();
  });
  $('#clearF').addEventListener('click',()=>{filter.clear();lsSet(LS_FILTER,[]);render();});
  $('#btnEdit').addEventListener('click',async()=>{
    editOn=!editOn;
    if(!editOn){
      const drop=Array.from(newIds);editing.clear();newIds.clear();confirmState=null;
      for(const id of drop){try{await del(id);}catch(e){}}
    }
    syncUi();render();
  });
  $('#btnExport').addEventListener('click',exportMd);
  $('#btnSrc').addEventListener('click',exportSrc);
  const main=$('#main');
  main.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    if(b.dataset.act==='addmat'){
      const box=$('.mats',b.closest('form'));
      box.insertAdjacentHTML('beforeend',matRow(b.dataset.p,{kind:'slides',title:'',url:''}));
      const f=$('input[name=mtitle]',box.lastElementChild);if(f)f.focus();
      return;
    }
    if(b.dataset.act==='delmat'){b.closest('.matrow').remove();return;}
    const art=b.closest('article');act(b.dataset.act,art?art.id.slice(4):b.dataset.id,b);
  });
  main.addEventListener('submit',e=>{const f=e.target.closest('form.editor');if(!f)return;e.preventDefault();saveEditor(f);});
  main.addEventListener('input',e=>{
    const f=e.target.closest('form.editor');
    if(f&&e.target.name==='body')$('.preview',f).innerHTML=renderBody(e.target.value);
  });
  const mq=window.matchMedia('(min-width:900px)'),box=$('#tocBox');
  const sync=()=>{box.open=mq.matches;};
  sync();if(mq.addEventListener)mq.addEventListener('change',sync);
  $('#toc').addEventListener('click',e=>{
    const a=e.target.closest('[data-go]');if(!a)return;
    e.preventDefault();
    const t=document.getElementById(a.dataset.go);
    if(t)t.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
    if(!mq.matches)box.open=false;
  });
}

/* ---------- avvio ---------- */
async function initStore(){
  const c=window.claude;
  try{dbh=c&&c.use?await c.use('db'):null;}catch(e){dbh=null;}
  try{const u=c&&c.use?await c.use('user'):null;if(u){const w=await u.can('data.write');if(w===false)canWrite=false;}}catch(e){}
  try{dl=c&&c.use?await c.use('downloads'):null;}catch(e){dl=null;}
  if(dbh){
    mode='db';
    dbh.collection('sections').onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{const x=d.data();if(x)o[d.id]=Object.assign({},x);});
      overrides=o;render();
    },err=>{if(err&&err.code==='revoked'){canWrite=false;editOn=false;syncUi();render();}else toast('Il collegamento con il salvataggio condiviso si è interrotto.');});
  }else{mode='local';overrides=lsGet(LS_OV,{})||{};}
  syncUi();render();
}
buildChips();bind();syncChips();render();
initStore();
})();
</script>
