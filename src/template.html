<title>Informatica in Classe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: indice laterale fisso + colonna di lettura. Ogni sezione è una "pagina" con fascia colorata
   segmentata per classe. Palette neutra freddissima per lasciare i colori alle sei classi. */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#edf0f5; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#141c2a; --ink-2:#4b576a; --rule:#d3dae4;
  --ink-btn:#141c2a; --on-ink:#ffffff; --focus:#2b62d9; --danger:#b3261e;
  --c-p1:#c4560a; --c-t1:#1f5fc4; --c-q1:#0a7c76; --c-l2:#6b3fc4; --c-l3:#3b7d1d; --c-l4:#b3205a;
  --k-orange:#c4560a; --k-blue:#1f5fc4; --k-teal:#0a7c76; --k-violet:#6b3fc4; --k-green:#3b7d1d; --k-magenta:#b3205a; --k-red:#c62828; --k-gold:#8f6b00; --k-sky:#0b79b0; --k-slate:#4b5d78; --k-brown:#7a4b2a; --k-lime:#5f7f00;
  --code-bg:#edf0f5; --tk-kw:#7a3ec2; --tk-str:#1a7a3a; --tk-cm:#66718a; --tk-num:#b45309;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131a; --surface:#171d27; --surface-2:#1d2431; --ink:#e9edf3; --ink-2:#9ba7ba; --rule:#2c3646;
    --ink-btn:#e9edf3; --on-ink:#0f131a; --focus:#7aa6ff; --danger:#ff8a80;
    --c-p1:#f0a15c; --c-t1:#7aa8f0; --c-q1:#5cc9c2; --c-l2:#b89af0; --c-l3:#92cf72; --c-l4:#f08ab0;
    --k-orange:#f0a15c; --k-blue:#7aa8f0; --k-teal:#5cc9c2; --k-violet:#b89af0; --k-green:#92cf72; --k-magenta:#f08ab0; --k-red:#ff8a80; --k-gold:#e8c25a; --k-sky:#6cc4f0; --k-slate:#a9b8d0; --k-brown:#d1a07a; --k-lime:#c4e04a;
    --code-bg:#0d1118; --tk-kw:#c4a1ff; --tk-str:#8fd694; --tk-cm:#7d8aa0; --tk-num:#f0b265;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#171d27; --surface-2:#1d2431; --ink:#e9edf3; --ink-2:#9ba7ba; --rule:#2c3646;
  --ink-btn:#e9edf3; --on-ink:#0f131a; --focus:#7aa6ff; --danger:#ff8a80;
  --c-p1:#f0a15c; --c-t1:#7aa8f0; --c-q1:#5cc9c2; --c-l2:#b89af0; --c-l3:#92cf72; --c-l4:#f08ab0;
  --k-orange:#f0a15c; --k-blue:#7aa8f0; --k-teal:#5cc9c2; --k-violet:#b89af0; --k-green:#92cf72; --k-magenta:#f08ab0; --k-red:#ff8a80; --k-gold:#e8c25a; --k-sky:#6cc4f0; --k-slate:#a9b8d0; --k-brown:#d1a07a; --k-lime:#c4e04a;
  --code-bg:#0d1118; --tk-kw:#c4a1ff; --tk-str:#8fd694; --tk-cm:#7d8aa0; --tk-num:#f0b265;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--font-body);padding-inline:16px}
#app{max-width:1200px;margin:0 auto;padding-block:22px 72px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.sym{flex:none;display:block}

/* testata */
.mast{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;padding-bottom:18px}
.mast-t{min-width:0;flex:1 1 560px}
.kicker{margin:0 0 4px;font:600 12px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:0;font:700 clamp(32px,6vw,52px)/1.02 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.lead{margin:10px 0 0;max-width:70ch;color:var(--ink-2);font-size:17px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sync{font:600 13px var(--font-body);color:var(--ink-2)}
.btn{font:600 14px var(--font-body);padding:8px 15px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.btn.primary,.btn[aria-pressed="true"]{background:var(--ink-btn);color:var(--on-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:4px 2px;font:600 14px var(--font-body);color:var(--ink);text-decoration:underline;cursor:pointer}

/* percorso, titoli di pagina, schede */
.mast.compact{padding-bottom:6px}
.mast.compact h1{font-size:clamp(24px,4vw,32px)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:10px 0 4px;font:600 14.5px var(--font-body);color:var(--ink-2)}
.crumbs a{color:var(--ink);text-decoration:underline}
.crumbs [aria-current]{color:var(--ink)}
.cr-sym{display:inline-flex}
.layout.solo{grid-template-columns:minmax(0,1fr)}
.home-lead{margin:18px 0 0;max-width:62ch;color:var(--ink-2);font-size:18px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* mappa mentale */
.mm{position:relative;margin:6px auto 0;max-width:1000px;aspect-ratio:16/9}
.mm-class{max-width:880px;aspect-ratio:16/8}
.mm-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mm-lines line{stroke:var(--cc);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.6}
.mm-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;width:clamp(120px,19%,190px);aspect-ratio:1;border-radius:50%;background:var(--ink-btn);color:var(--on-ink);font:700 clamp(15px,2.2vw,22px)/1.1 var(--font-display);padding:10px}
.mm-c span{font-weight:500;font-size:.8em}
.mm-class .mm-c{background:var(--surface);color:var(--ink);border:3px solid var(--ink)}
.mm-n{position:absolute;transform:translate(-50%,-50%);display:flex;gap:11px;align-items:center;width:clamp(150px,21%,220px);padding:11px 14px;background:var(--surface);color:var(--ink);text-decoration:none;border:2.5px solid var(--cc);border-radius:16px;box-shadow:0 1px 0 var(--rule)}
.mm-n:hover{background:color-mix(in srgb,var(--cc) 12%,var(--surface))}
.mm-n:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.mm-t{min-width:0}
.mm-t b{display:block;font:700 16px/1.2 var(--font-display);overflow-wrap:anywhere}
.mm-t small{display:block;margin-top:2px;font:600 13px var(--font-body);color:var(--ink-2)}
.mm-ic{flex:none;color:var(--cc);display:flex}
.mm-class .mm-n{width:clamp(170px,26%,250px)}
@media (max-width:719px){
  .mm,.mm-class{aspect-ratio:auto;display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-left:26px;border-left:3px solid var(--rule);margin-left:8px}
  .mm-lines{display:none}
  .mm-c,.mm-n,.mm-class .mm-n{position:static;transform:none;width:auto}
  .mm-c{flex-direction:row;gap:8px;aspect-ratio:auto;border-radius:16px;justify-content:flex-start;padding:12px 16px;margin-left:-26px;margin-bottom:4px}
  .mm-n{position:relative;left:auto!important;top:auto!important}
  .mm-n::before{content:"";position:absolute;left:-26px;top:50%;width:26px;border-top:3px solid var(--cc);opacity:.6}
}

/* schede della classe */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 20px}
.tab{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1.5px solid var(--ink-2);border-radius:999px;color:var(--ink);text-decoration:none;font:600 15px var(--font-body);background:transparent}
.tab em{font-style:normal;font-size:13px;color:var(--ink-2)}
.tab:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.tab[aria-current=page]{background:var(--ink-btn);color:var(--on-ink);border-color:var(--ink-btn)}
.tab[aria-current=page] em{color:inherit;opacity:.8}
.pg-h h2{margin:0;font:700 clamp(26px,4.4vw,38px)/1.1 var(--font-display);letter-spacing:-.015em}
.pg-h p{margin:6px 0 16px;color:var(--ink-2)}
.cards{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;height:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--rule);border-top:6px solid var(--cc);border-radius:4px;color:var(--ink);text-decoration:none}
.card:hover{border-color:var(--ink-2);border-top-color:var(--cc)}
.card b{font:700 18px/1.25 var(--font-display);overflow-wrap:anywhere}
.card-tags{display:flex;gap:3px}
.card-ex{font-size:15px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--ink-2);font-weight:600}
.add0{margin:0 0 6px}
.emptybox{padding:18px 20px;border:1.5px dashed var(--ink-2);background:var(--surface);margin-top:14px}
.emptybox p{margin:0 0 8px}
.tplprev summary{cursor:pointer;font-weight:600}
.tplprev .prose{margin-top:12px;padding:12px 16px;background:var(--surface-2);border:1px solid var(--rule)}
.backl{margin:0 0 12px;font-weight:600}
.backl a{color:var(--ink)}
.sec-h2{margin:0;font:700 clamp(24px,4vw,32px)/1.12 var(--font-display);letter-spacing:-.01em;text-wrap:balance}

/* gestione classi e collegamenti */
.cm{margin-top:36px;padding:18px 20px;border:1.5px dashed var(--ink-2);background:var(--surface)}
.cm h2{margin:0 0 6px;font:700 22px var(--font-display)}
.cm h3{margin:0 0 4px;font:700 18px var(--font-display)}
.cm-list{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px}
.cm-list li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule)}
.cm-list li.off{opacity:.6}
.cm-n{display:flex;gap:10px;align-items:center;min-width:0}
.cm-n small{color:var(--ink-2)}
.cm-b{display:flex;gap:6px;flex-wrap:wrap}
.cm-form{display:grid;gap:14px;margin-top:10px;padding-top:14px;border-top:1px solid var(--rule)}
.sws,.shps{display:flex;flex-wrap:wrap;gap:8px}
.sw,.shp{position:relative;display:inline-flex}
.sw input,.shp input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{display:block;width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--ink-2)}
.sw input:checked+span{box-shadow:0 0 0 3px var(--ink)}
.sw input:focus-visible+span,.shp input:focus-visible+svg{outline:3px solid var(--focus);outline-offset:3px}
.shp svg{padding:6px;width:42px;height:42px;border:1.5px solid var(--ink-2);border-radius:6px;color:var(--ink-2);fill:currentColor}
.shp input:checked+svg{color:var(--on-ink);background:var(--ink-btn);border-color:var(--ink-btn)}
.linkp{margin:0 0 24px;padding:12px 16px;border:1.5px dashed var(--ink-2);background:var(--surface)}
.linkp summary{cursor:pointer;font-weight:700}
.linkp h4{margin:16px 0 4px;font:700 13px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.lk-list{list-style:none;margin:0;padding:0}
.lk{display:flex;gap:10px;align-items:center;padding:4px 0;cursor:pointer}
.lk input{width:18px;height:18px;flex:none}
.lk .mini{margin-left:auto}

/* barra classi: legenda e filtro insieme */
.fbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-block:1px solid var(--rule);padding-block:10px;margin-inline:-16px;padding-inline:16px}
.fbar-in{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.fl{font:600 12px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.chip{position:relative;display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border:1.5px solid var(--cc);border-radius:6px;background:transparent;color:var(--ink);font:600 14px var(--font-body);cursor:pointer}
.chip:hover{background:color-mix(in srgb,var(--cc) 10%,transparent)}
.chip[aria-pressed="true"],.chip.chk:has(input:checked){background:color-mix(in srgb,var(--cc) 20%,var(--surface))}
.chip.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chip.chk:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.count{margin-inline-start:auto;font:600 13px var(--font-body);color:var(--ink-2)}
.editnote{margin:14px 0 0;padding:10px 14px;border:1.5px dashed var(--ink-2);background:var(--surface);font-size:15px}

/* griglia principale */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:22px}
@media (min-width:900px){.layout{grid-template-columns:250px minmax(0,1fr);gap:44px}}
.tocbox{min-width:0}
.tocbox>summary{font:700 15px var(--font-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:8px 0}
@media (min-width:900px){
  .tocbox>summary{display:none}
  .tocbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-right:6px}
}
.toc-ch{margin-bottom:16px}
.toc-cht{display:block;font:700 15px/1.3 var(--font-display);color:var(--ink);text-decoration:none;margin-bottom:4px}
.toc-cht b{color:var(--ink-2);margin-right:4px}
.toc-ch ul{list-style:none;margin:0;padding:0}
.toc-ch li a{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:14.5px;line-height:1.35;color:var(--ink-2);text-decoration:none}
.toc-ch li a:hover,.toc-cht:hover{color:var(--ink);text-decoration:underline}
.mini{display:inline-flex;gap:2px;flex:none;padding-top:3px;max-width:50px;flex-wrap:wrap}

/* capitoli */
.chap{margin-bottom:56px}
.chap-h{display:flex;gap:18px;align-items:flex-start;margin-bottom:20px}
.num{font:800 clamp(52px,9vw,84px)/.85 var(--font-display);color:color-mix(in srgb,var(--ink) 22%,var(--bg));letter-spacing:-.04em}
.chap-h>div{min-width:0}
.chap-h h2{margin:0;font:700 clamp(26px,4.4vw,38px)/1.08 var(--font-display);letter-spacing:-.015em;text-wrap:balance}
.chap-h p{margin:6px 0 10px;color:var(--ink-2);max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 6px;border:1px solid color-mix(in srgb,var(--cc) 60%,var(--rule));border-radius:4px;background:color-mix(in srgb,var(--cc) 11%,var(--surface));font:600 12.5px var(--font-body);color:var(--ink)}
.secs{display:flex;flex-direction:column;gap:22px}
.empty{color:var(--ink-2)}
.add{align-self:flex-start;margin-top:18px}

/* sezioni */
.sec{background:var(--surface);border:1px solid var(--rule);border-radius:4px;overflow:hidden;scroll-margin-top:96px;min-width:0}
.band{display:flex;height:7px}
.band span{flex:1}
.sec-in{padding:20px 26px 26px}
@media (max-width:600px){.sec-in{padding:16px 16px 20px}}
.sec-h{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.sec-t{min-width:0;flex:1 1 320px}
.sec-t .tags{margin-bottom:8px}
.sec h3{margin:0;font:700 clamp(21px,3.4vw,27px)/1.15 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.tools-s{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tb{font:600 13px var(--font-body);padding:5px 10px;border:1px solid var(--ink-2);background:transparent;color:var(--ink);border-radius:5px;cursor:pointer}
.tb:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 8%,transparent)}
.tb:disabled{opacity:.35;cursor:not-allowed}
.tb.danger{border-color:var(--danger);color:var(--danger)}
.conf{font:600 14px var(--font-body)}

/* testo */
.prose{min-width:0;overflow-wrap:break-word}
.prose p{margin:0 0 12px;max-width:70ch}
.prose h4{margin:22px 0 8px;font:700 13px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.prose ul,.prose ol{margin:0 0 14px;padding-left:24px;max-width:70ch}
.prose li{margin-bottom:4px}
.prose code{font:500 .86em var(--font-mono);background:var(--code-bg);padding:1px 6px;border-radius:3px}
.prose pre{margin:14px 0;padding:14px 16px;background:var(--code-bg);border-radius:4px;overflow-x:auto;font:400 13.5px/1.55 var(--font-mono)}
.prose pre code{background:none;padding:0;font:inherit}
.prose pre.out{background:transparent;border:1px dashed var(--ink-2)}
.tk-kw{color:var(--tk-kw);font-weight:600}.tk-st{color:var(--tk-str)}.tk-cm{color:var(--tk-cm);font-style:italic}.tk-nu{color:var(--tk-num)}
.tbl{overflow-x:auto;margin:14px 0}
.tbl table{border-collapse:collapse;min-width:100%;font-size:15px}
.tbl th,.tbl td{border:1px solid var(--rule);padding:6px 11px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);font-weight:700}
.callout{margin:14px 0;padding:12px 16px;background:var(--surface-2);border:1px solid var(--rule);max-width:70ch}
.callout p{margin:0 0 6px}
.callout p:last-child{margin:0}
.co-l{display:block;margin-bottom:4px;font:700 12px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.ex{margin:10px 0;border:1px solid var(--rule);max-width:70ch}
.ex summary{cursor:pointer;padding:9px 14px;font-weight:600;background:var(--surface-2)}
.ex[open] summary{border-bottom:1px solid var(--rule)}
.ex .ans{padding:10px 14px}
.ex .ans p{margin:0 0 6px}

/* editor */
.editor{display:grid;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;padding:0;margin:0}
.fld>label,.fld>legend,.lbl{font:700 12px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:0}
.fld input[type=text],.fld select,.fld textarea{width:100%;padding:9px 11px;background:var(--surface);border:1.5px solid var(--ink-2);border-radius:5px}
.fld textarea{min-height:340px;font:400 14px/1.5 var(--font-mono);resize:vertical}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1000px){.ed-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.preview{border:1px solid var(--rule);padding:12px 16px;max-height:420px;overflow:auto;background:var(--surface)}
.syntax summary{cursor:pointer;font-weight:600}
.syntax pre{margin:10px 0 0;padding:12px 14px;background:var(--code-bg);overflow-x:auto;font:400 13px/1.5 var(--font-mono)}
.ed-err{margin:0;color:var(--danger);font-weight:600}
.ed-act{display:flex;gap:10px;flex-wrap:wrap}
.hid{margin-top:28px;padding:12px 16px;border:1.5px dashed var(--ink-2);background:var(--surface)}
.hid summary{cursor:pointer;font-weight:700}
.hid ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.hid li{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* strumenti interattivi */
.wg{margin-top:22px;padding:16px 18px 18px;border:1.5px dashed var(--ink-2);background:var(--surface-2);min-width:0}
.wg-h{margin-bottom:10px;font:700 14px var(--font-display);letter-spacing:.1em;text-transform:uppercase}
.wg-note{margin:0 0 10px;font-size:15px;color:var(--ink-2)}
.wg-row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:8px}
.wg-row label{font-weight:600}
.wg input[type=number],.wg input[type=text]{padding:7px 10px;border:1.5px solid var(--ink-2);border-radius:5px;background:var(--surface);min-width:0;max-width:100%}
.wg input[type=number]{width:110px}
.wg input[type=text]{width:min(100%,320px);font-family:var(--font-mono)}
.bits{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;max-width:460px;margin:12px 0}

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- classi: colore + simbolo (modificabili dal docente) ---------- */
const PAL={orange:'Arancione',blue:'Blu',teal:'Verde acqua',violet:'Viola',green:'Verde',magenta:'Magenta',red:'Rosso',gold:'Oro',sky:'Azzurro',slate:'Grigio ardesia',brown:'Marrone',lime:'Lime'};
const DEFAULT_CLASSES=[
  {id:'P1',short:'1ª Prof.',name:'Primo anno · Istituto professionale',color:'orange',shape:'circle'},
  {id:'T1',short:'1ª ITIS',name:'Primo anno · ITIS',color:'blue',shape:'square'},
  {id:'Q1',short:'1ª ITIS Q',name:'Primo anno · ITIS quadriennale',color:'teal',shape:'diamond'},
  {id:'L2',short:'2ª Liceo SA · IA',name:'Secondo anno · Liceo scienze applicate, curvatura IA',color:'violet',shape:'triangle'},
  {id:'L3',short:'3ª Liceo SA',name:'Terzo anno · Liceo scienze applicate',color:'green',shape:'hexagon'},
  {id:'L4',short:'4ª Liceo SA',name:'Quarto anno · Liceo scienze applicate',color:'magenta',shape:'star'}
];
let baseClasses=[],classOv={};
const CLASSES=[],CL={};
function polyPts(n,r,rot,ratio){const p=[];const m=ratio?n*2:n;for(let i=0;i<m;i++){const a=(rot+i*360/m)*Math.PI/180,rr=ratio&&i%2?r*ratio:r;p.push((8+rr*Math.cos(a)).toFixed(2)+','+(8+rr*Math.sin(a)).toFixed(2));}return p.join(' ');}
const SHAPES={
  circle:'<circle cx="8" cy="8" r="6.6"/>',
  square:'<rect x="1.6" y="1.6" width="12.8" height="12.8"/>',
  diamond:'<polygon points="8,0.8 15.2,8 8,15.2 0.8,8"/>',
  triangle:'<polygon points="8,1.4 15.2,14.2 0.8,14.2"/>',
  hexagon:'<polygon points="8,1 14.2,4.5 14.2,11.5 8,15 1.8,11.5 1.8,4.5"/>',
  star:'<polygon points="'+polyPts(5,7.6,-90,0.447)+'"/>',
  pentagon:'<polygon points="'+polyPts(5,7.4,-90)+'"/>',
  cross:'<polygon points="5.6,1 10.4,1 10.4,5.6 15,5.6 15,10.4 10.4,10.4 10.4,15 5.6,15 5.6,10.4 1,10.4 1,5.6 5.6,5.6"/>',
  octagon:'<polygon points="'+polyPts(8,7.4,-67.5)+'"/>',
  down:'<polygon points="8,14.6 15.2,1.8 0.8,1.8"/>'
};
const SHAPE_NAMES={circle:'Cerchio',square:'Quadrato',diamond:'Rombo',triangle:'Triangolo',hexagon:'Esagono',star:'Stella',pentagon:'Pentagono',cross:'Croce',octagon:'Ottagono',down:'Triangolo capovolto'};
const symRaw=(shape,n,fill)=>'<svg class="sym" width="'+n+'" height="'+n+'" viewBox="0 0 16 16" aria-hidden="true" style="fill:'+fill+'">'+(SHAPES[shape]||SHAPES.circle)+'</svg>';
const sym=(c,n)=>symRaw(c.shape,n,'var('+c.v+')');
const tag=c=>'<span class="tag" style="--cc:var('+c.v+')" title="'+esc(c.name)+'">'+sym(c,13)+'<span>'+esc(c.short)+'</span></span>';
const activeClasses=()=>CLASSES.filter(c=>!c.deleted);
function rebuildClasses(){
  const map={};
  baseClasses.forEach((c,i)=>{map[c.id]=Object.assign({order:(i+1)*10},c,{_base:true});});
  Object.keys(classOv).forEach(id=>{
    const o=classOv[id]||{};
    if(map[id])map[id]=Object.assign(map[id],o,{_over:true});
    else if(o.short)map[id]=Object.assign({order:9999,name:o.short,color:'slate',shape:'circle'},o,{_custom:true});
  });
  CLASSES.length=0;
  Object.keys(CL).forEach(k=>{delete CL[k];});
  Object.keys(map).map(k=>{
    const c=Object.assign({},map[k],{id:k});
    c.color=PAL[c.color]?c.color:'slate';c.shape=SHAPES[c.shape]?c.shape:'circle';
    c.v='--k-'+c.color;c.deleted=!!c.deleted;c.short=String(c.short||k);c.name=String(c.name||c.short);
    c.order=typeof c.order==='number'?c.order:9999;
    return c;
  }).sort((a,b)=>a.order-b.order||a.id.localeCompare(b.id)).forEach(c=>{CLASSES.push(c);CL[c.id]=c;});
}

/* ---------- contenuti di partenza ---------- */
function parseContent(txt){
  const chapters=[],list=[],classes=[],cnt={};let cur=null;
  txt.replace(/\r/g,'').split('\n').forEach(line=>{
    if(line.startsWith('@@class ')){
      const p=line.slice(8).split('|').map(s=>s.trim());
      if(p[0])classes.push({id:p[0],short:p[1]||p[0],name:p[2]||p[1]||p[0],color:p[3]||'slate',shape:p[4]||'circle',deleted:p[5]==='hidden'});
      cur=null;
    }else if(line.startsWith('@@chapter ')){
      const p=line.slice(10).split('|').map(s=>s.trim());
      chapters.push({id:p[0],num:p[1],title:p[2],desc:p[3]||''});cur=null;
    }else if(line.startsWith('@@section ')){
      const p=line.slice(10).split('|').map(s=>s.trim());
      const ch=chapters[chapters.length-1];cnt[ch.id]=(cnt[ch.id]||0)+10;
      cur={id:p[0],chapter:ch.id,classes:p[1].split(/\s+/).filter(Boolean),widget:p[2]==='-'?'':p[2],title:p.slice(3).join(' | '),order:cnt[ch.id],materials:[],lines:[]};
      list.push(cur);
    }else if(cur&&line.startsWith('@@material ')){
      const q=line.slice(11).split('|').map(s=>s.trim());
      cur.materials.push({kind:q[0],title:q[1]||'',url:q.slice(2).join('|')});
    }else if(cur){cur.lines.push(line);}
  });
  list.forEach(s=>{s.body=s.lines.join('\n').trim();delete s.lines;});
  return {chapters,list,classes};
}
const parsed=parseContent($('#content').textContent);
const chapters=parsed.chapters,baseList=parsed.list;
baseClasses=parsed.classes.length?parsed.classes:DEFAULT_CLASSES.map(c=>Object.assign({},c));
/* le pagine di Progetti, Materiale e Peer2Peer vivono in capitoli "virtuali" (il loro id inizia con _) */
const KINDS={
  _project:{slug:'progetti',title:'Progetti',desc:'I progetti svolti dalla classe.',one:'progetto',newLabel:'+ Nuovo progetto'},
  _material:{slug:'materiale',title:'Materiale',desc:'Il materiale extra fornito dal docente.',one:'materiale',newLabel:'+ Nuovo materiale'},
  _peer:{slug:'peer',title:'Peer2Peer',desc:'Il materiale preparato dai ragazzi per i compagni.',one:'lavoro',newLabel:'+ Nuovo lavoro dei ragazzi'}
};
Object.keys(KINDS).forEach(id=>{if(!chapters.some(c=>c.id===id))chapters.push({id:id,num:'-',title:KINDS[id].title,desc:KINDS[id].desc});});
chapters.forEach(c=>{c.virtual=c.id.charAt(0)==='_';});
rebuildClasses();
const chIndex=id=>chapters.findIndex(c=>c.id===id);
const kindOf=s=>s.chapter.charAt(0)==='_'?s.chapter:'topic';

/* ---------- testo: mini linguaggio per le sezioni ---------- */
function inline(s){
  return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
const KW={
  python:'and|as|assert|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|None|nonlocal|not|or|pass|raise|return|try|True|False|while|with|yield|self',
  sql:'SELECT|FROM|WHERE|ORDER|BY|GROUP|HAVING|JOIN|INNER|LEFT|ON|AS|AND|OR|NOT|IN|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|PRIMARY|KEY|FOREIGN|REFERENCES|DESC|ASC|COUNT|AVG|SUM|MIN|MAX|LIMIT|DISTINCT|NULL|LIKE|TEXT|REAL|INTEGER',
  json:'true|false|null'
};
function highlight(code,lang){
  const kw=KW[lang];if(!kw)return esc(code);
  const cm=lang==='sql'?'--.*':lang==='python'?'#.*':'(?!)';
  const re=new RegExp('('+cm+')|("(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\')|\\b('+kw+')\\b|\\b(\\d+(?:\\.\\d+)?)\\b',lang==='sql'?'gi':'g');
  let out='',last=0,m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    const k=m[1]!==undefined?'cm':m[2]!==undefined?'st':m[3]!==undefined?'kw':'nu';
    out+='<span class="tk-'+k+'">'+esc(m[0])+'</span>';
    last=re.lastIndex;if(m[0]==='')re.lastIndex++;
  }
  return out+esc(code.slice(last));
}
function renderBody(src){
  const L=String(src||'').replace(/\r/g,'').split('\n');let i=0;const out=[];
  const special=/^(```|## |>|\||- |\d+\. |\?\? )/;
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){
      const lang=l.slice(3).trim().toLowerCase();const code=[];i++;
      while(i<L.length&&!/^```/.test(L[i]))code.push(L[i++]);
      i++;
      const c=code.join('\n');
      out.push('<pre class="'+(lang==='output'?'out':'src')+'"><code>'+(lang==='output'?esc(c):highlight(c,lang))+'</code></pre>');
      continue;
    }
    if(!l.trim()){i++;continue;}
    if(/^## /.test(l)){out.push('<h4>'+inline(l.slice(3))+'</h4>');i++;continue;}
    if(/^>/.test(l)){
      const q=[];while(i<L.length&&/^>/.test(L[i]))q.push(L[i++].replace(/^>\s?/,''));
      let label='';const m=q[0].match(/^\[([^\]]+)\]\s*/);
      if(m){label=m[1];q[0]=q[0].slice(m[0].length);}
      out.push('<aside class="callout">'+(label?'<span class="co-l">'+esc(label)+'</span>':'')+q.map(x=>'<p>'+inline(x)+'</p>').join('')+'</aside>');
      continue;
    }
    if(/^\|/.test(l)){
      const rows=[];while(i<L.length&&/^\|/.test(L[i]))rows.push(L[i++].trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim()));
      let head=null;
      if(rows.length>1&&rows[1].every(c=>/^:?-+:?$/.test(c))){head=rows[0];rows.splice(0,2);}
      out.push('<div class="tbl"><table>'+(head?'<thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead>':'')+'<tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
      continue;
    }
    if(/^- /.test(l)){
      const it=[];while(i<L.length&&/^- /.test(L[i]))it.push(L[i++].slice(2));
      out.push('<ul>'+it.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>');continue;
    }
    if(/^\d+\. /.test(l)){
      const it=[];while(i<L.length&&/^\d+\. /.test(L[i]))it.push(L[i++].replace(/^\d+\.\s/,''));
      out.push('<ol>'+it.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>');continue;
    }
    if(/^\?\? /.test(l)){
      const q=l.slice(3);i++;const ans=[];
      if(i<L.length&&/^!! /.test(L[i])){
        ans.push(L[i].slice(3));i++;
        while(i<L.length&&L[i].trim()&&!/^(\?\?|!!) /.test(L[i]))ans.push(L[i++]);
      }
      out.push('<details class="ex"><summary>'+inline(q)+'</summary><div class="ans">'+(ans.length?renderBody(ans.join('\n')):'<p><em>Risposta non indicata.</em></p>')+'</div></details>');
      continue;
    }
    const p=[];
    while(i<L.length&&L[i].trim()&&!special.test(L[i]))p.push(L[i++]);
    if(!p.length)p.push(L[i++]);
    out.push('<p>'+inline(p.join(' '))+'</p>');
  }
  return out.join('');
}

function cleanUrl(u){
  u=String(u||'').trim();
  if(/^https?:\/\/\S+$/i.test(u))return u;
  if(/^allegati\/[^\s]+$/.test(u)&&u.indexOf('..')<0)return u;
  return '';
}
function hostOf(u){
  if(/^https?:/i.test(u)){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}}
  return u;
}
function matsHtml(s){
  if(!s.materials.length)return '';
  return '<div class="mats-v"><h4>Materiali della lezione</h4><ul>'+s.materials.map(m=>'<li><a class="mat" href="'+esc(m.url)+'" target="_blank" rel="noopener noreferrer">'+mIcon(m.kind)+'<span><b>'+esc(m.title||MKINDS[m.kind].label)+'</b><small>'+esc(MKINDS[m.kind].label+' · '+hostOf(m.url))+'</small></span></a></li>').join('')+'</ul></div>';
}

function norm(s){
  s.classes=(Array.isArray(s.classes)?s.classes:[]).filter(c=>CL[c]);
  s.order=typeof s.order==='number'?s.order:9999;
  s.deleted=!!s.deleted;s.widget=s.widget||'';
  s.materials=(Array.isArray(s.materials)?s.materials:[]).map(m=>({kind:MKINDS[m&&m.kind]?m.kind:'link',title:String(m&&m.title||''),url:cleanUrl(m&&m.url)})).filter(m=>m.url);
  s.title=s.title||'(senza titolo)';s.body=s.body||'';
  return s;
}
function all(){
  const map={};
  baseList.forEach(b=>{map[b.id]=Object.assign({},b,{_base:true});});
  Object.keys(overrides).forEach(id=>{
    const o=overrides[id]||{};
    if(map[id])map[id]=Object.assign(map[id],o,{_over:true});
    else if(chIndex(o.chapter)>=0)map[id]=Object.assign({id:id,widget:'',classes:[],order:9999,title:'',body:''},o,{_custom:true});
  });
  return Object.keys(map).map(k=>norm(map[k])).sort((a,b)=>chIndex(a.chapter)-chIndex(b.chapter)||a.order-b.order||a.id.localeCompare(b.id));
}
const fields=s=>({chapter:s.chapter,order:s.order,title:s.title,body:s.body,classes:s.classes.slice(),widget:s.widget||'',materials:s.materials.map(m=>({kind:m.kind,title:m.title,url:m.url})),deleted:!!s.deleted,custom:!!s._custom});

async function put(id,data){
  const prev=overrides[id];overrides[id]=data;
  try{if(mode==='db')await dbh.doc('sections/'+id).set(data);else lsSet(LS_OV,overrides);}
  catch(e){if(prev===undefined)delete overrides[id];else overrides[id]=prev;throw e;}
}
async function del(id){
  const prev=overrides[id];delete overrides[id];
  try{if(mode==='db')await dbh.doc('sections/'+id).delete();else lsSet(LS_OV,overrides);}
  catch(e){if(prev!==undefined)overrides[id]=prev;throw e;}
}
async function putClass(id,data){
  const prev=classOv[id];classOv[id]=data;rebuildClasses();
  try{if(mode==='db')await dbh.doc('sections/cls-'+id).set(Object.assign({_class:true},data));else lsSet(LS_CL,classOv);}
  catch(e){if(prev===undefined)delete classOv[id];else classOv[id]=prev;rebuildClasses();throw e;}
}
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;},4500);}
function writeError(e){
  const code=e&&e.code;
  if(code==='invalid_argument'||code==='revoked'){canWrite=false;editOn=false;editing.clear();toast('Non hai il permesso di modificare questo libro.');}
  else if(code==='quota_exceeded')toast('Lo spazio per le modifiche è esaurito.');
  else toast('Salvataggio non riuscito. Riprova tra poco.');
  syncUi();render();
}

    '<div class="wg-h wg-h2">Tabella delle divisioni successive</div>'+
    '<div class="wg-row"><label for="'+id+'-dv">Valore decimale</label><input id="'+id+'-dv" type="number" min="0" max="1000000" step="1" value="156"><label for="'+id+'-db">Base</label><select id="'+id+'-db"><option value="2">2 (binario)</option><option value="8">8 (ottale)</option><option value="16">16 (esadecimale)</option></select></div>'+

  function upd(fromInput){

  const dvIn=$('#'+id+'-dv',root),dbSel=$('#'+id+'-db',root),dvBody=$('.dvb',root),dvSum=$('.dvs',root);
  function divTable(){
    const val=parseInt(dvIn.value,10),base=parseInt(dbSel.value,10);
    if(!isFinite(val)||val<0||val>1000000){dvBody.innerHTML='';dvSum.textContent='Inserisci un numero intero tra 0 e 1 000 000.';return;}
    const D='0123456789ABCDEF';let rows='',x=val,digits='';
    if(val===0){rows='<tr><td>0</td><td>'+base+'</td><td>0</td><td>0</td></tr>';digits='0';}
    while(x>0){const q=Math.floor(x/base),r=x%base;rows+='<tr><td>'+x+'</td><td>'+base+'</td><td>'+q+'</td><td>'+r+(r>9?' ('+D[r]+')':'')+'</td></tr>';digits=D[r]+digits;x=q;}

function cpuWidget(root){
  const id='cpu'+(++UID);
  const PROG=['LOAD 6','ADD 7','STORE 8','HALT','','','12','30','0',''],N=PROG.length;
  root.innerHTML='<div class="wg-h">Mini computer a 10 celle</div>'+
    '<p class="wg-note">Le celle contengono sia istruzioni sia dati, come nell\'idea di Von Neumann. Puoi cambiare i valori e riavviare.</p>'+
    '<div class="regs"><div class="reg"><b>PC</b><span data-r="pc"></span></div><div class="reg"><b>IR</b><span data-r="ir"></span></div><div class="reg"><b>ACC</b><span data-r="acc"></span></div></div>'+
    '<div class="phases" aria-hidden="true"><span>Fetch</span><span>Decode</span><span>Execute</span></div>'+
    '<div class="mem">'+PROG.map((p,i)=>'<label class="cell"><span class="addr">Cella '+i+'</span><input id="'+id+'-m'+i+'" value="'+esc(p)+'" spellcheck="false" autocomplete="off"></label>').join('')+'</div>'+
    '<p class="cpu-log" role="status" aria-live="polite"></p>'+
    '<div class="wg-btns"><button type="button" class="btn primary" data-a="step">Passo</button><button type="button" class="btn" data-a="run">Esegui</button><button type="button" class="btn" data-a="reset">Riavvia</button><button type="button" class="btn" data-a="restore">Ripristina esempio</button></div>';
  const ins=$$('.mem input',root),cells=$$('.cell',root),ph=$$('.phases span',root),log=$('.cpu-log',root);
  const R=k=>$('[data-r='+k+']',root),stepB=$('[data-a=step]',root),runB=$('[data-a=run]',root);
  let pc=0,ir='',acc=0,phase=0,halted=false,op=null,arg=null,touch=-1,timer=null;
  const say=(t,e)=>{log.textContent=t;log.classList.toggle('err',!!e);};
  function stopT(){if(timer){clearInterval(timer);timer=null;}runB.textContent='Esegui';}
  function paint(){
    R('pc').textContent=pc;R('ir').textContent=ir||'—';R('acc').textContent=acc;
    ph.forEach((p,i)=>p.classList.toggle('on',!halted&&i===phase));
    cells.forEach((c,i)=>{c.classList.toggle('pc',!halted&&phase===0&&i===pc);c.classList.toggle('touch',i===touch);});
    stepB.disabled=halted;
  }
  function fail(m){halted=true;stopT();say(m,true);paint();}
  function step(){
    if(halted)return;
    if(!root.isConnected){stopT();return;}
    if(phase===0){
      if(pc>=N){fail('Il PC punta fuori dalla memoria: la CPU si ferma.');return;}
      ir=ins[pc].value.trim().toUpperCase();touch=pc;
      say('FETCH: la CPU legge la cella '+pc+' ("'+(ir||'vuota')+'"), la copia in IR e porta PC a '+(pc+1)+'.');
      pc++;phase=1;
    }else if(phase===1){
      const m=/^(LOAD|ADD|SUB|STORE)\s+(\d+)$/.exec(ir);
      if(m){
        op=m[1];arg=parseInt(m[2],10);
        if(arg>=N){fail('DECODE: la cella '+arg+' non esiste. Le celle vanno da 0 a '+(N-1)+'.');return;}
        say('DECODE: l\'unità di controllo riconosce '+op+' sulla cella '+arg+'.');
      }else if(ir==='HALT'){op='HALT';arg=null;say('DECODE: istruzione HALT, il programma sta per fermarsi.');}
      else{fail('DECODE: "'+(ir||'cella vuota')+'" non è un\'istruzione valida. La CPU si ferma.');return;}
      phase=2;
    }else{
      if(op==='HALT'){halted=true;stopT();say('EXECUTE: HALT. Programma terminato con ACC = '+acc+'.');}
      else if(op==='STORE'){ins[arg].value=String(acc);touch=arg;say('EXECUTE: STORE scrive '+acc+' nella cella '+arg+'.');phase=0;}
      else{
        const t=ins[arg].value.trim();
        if(!/^-?\d+$/.test(t)){fail('EXECUTE: la cella '+arg+' contiene "'+(t||'niente')+'", non un numero.');return;}
        const n=parseInt(t,10);touch=arg;
        if(op==='LOAD'){acc=n;say('EXECUTE: LOAD copia '+n+' dalla cella '+arg+' in ACC.');}
        else if(op==='ADD'){acc+=n;say('EXECUTE: ADD somma '+n+' ad ACC, che ora vale '+acc+'.');}
        else{acc-=n;say('EXECUTE: SUB sottrae '+n+' da ACC, che ora vale '+acc+'.');}
        phase=0;
      }
    }
    paint();
  }
  function reset(){stopT();pc=0;ir='';acc=0;phase=0;halted=false;op=null;arg=null;touch=-1;say('Pronto. Premi Passo per eseguire una fase alla volta.');paint();}
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='step'){stopT();step();}
    else if(a==='run'){if(timer){stopT();}else if(!halted){runB.textContent='Pausa';timer=setInterval(step,380);}}
    else if(a==='reset')reset();
    else if(a==='restore'){ins.forEach((x,i)=>{x.value=PROG[i];});reset();}
  });
  reset();
}

    term(230,28,100,36,'Inizio','A N B')+para(230,85,150,36,'Input pH','A N B')+dia(230,170,150,70,'pH &lt; 7 ?','A N B')+dia(230,270,150,70,'pH = 7 ?','N B')+

function gatesWidget(root){
  const id='gt'+(++UID);
  const G={AND:(a,b)=>a&b,OR:(a,b)=>a|b,NOT:a=>a?0:1,XOR:(a,b)=>a^b,NAND:(a,b)=>(a&b)?0:1,NOR:(a,b)=>(a|b)?0:1};
  let gate='AND',A=0,B=0;

function pyHint(r){

  if(r.excType==='ModuleNotFoundError'){const m=/'([\w.]+)'/.exec(t);const n=m?m[1]:'';
    if(/^(numpy|scipy|matplotlib|pandas|sklearn|seaborn)/.test(n))return 'La libreria «'+n+'» non è inclusa in questo editor. Qui trovi math, random, statistics, time, json e copy; per '+n+' usa Python sul computer o Google Colab.';
    return 'In questo editor sono disponibili solo i moduli math, random, statistics, time, json e copy.';}
  if(r.kind==='syntax'&&/non è supportat/.test(t))return 'Quella parte di Python non è disponibile in questo editor (vedi «Cosa non funziona» sotto).';
  if(r.kind==='syntax')return 'Errore di scrittura: controlla i due punti, le parentesi, le virgolette e i rientri della riga indicata.';
  if(r.kind==='steps'||r.kind==='time')return 'Probabile ciclo infinito: controlla la condizione del while e che la variabile cambi a ogni giro.';
  if(r.excType==='NameError')return 'Hai usato un nome che non esiste: controlla di averlo creato prima e di averlo scritto uguale (maiuscole comprese).';
  if(r.excType==='IndentationError')return 'Controlla i rientri: ogni blocco deve avere gli stessi spazi.';
  return '';
}

    setBusy(true);st.textContent='In esecuzione (modalità semplice, il pulsante Ferma non è disponibile)…';
    setTimeout(()=>{
      let buf='';
      const r=window.PyInterp.run(c,{inputs:inputs,echoInput:true,maxMs:6000,write:s=>{buf+=s;}});
      out.textContent+=buf;finish(r);
    },30);
  }
  function run(){
    if(current)return;
    clearAll();
    const inputs=inp.value.length?inp.value.split('\n'):[];
    current={code:code.value,inputs:inputs,started:false};
    const w=mkWorker();
    if(!w){const c=current;current=null;runMain(c.code,c.inputs);return;}
    setBusy(true);
    const my=current;
    let timer=setTimeout(()=>{if(current===my&&!my.started){/* il worker non risponde: passa alla modalità semplice */workerBad=true;try{w.terminate();}catch(e){}worker=null;current=null;runMain(my.code,my.inputs);}},2500);
    w.onmessage=ev=>{
      const d=ev.data;
      if(d.t==='ready'||d.t==='out'||d.t==='done'){my.started=true;clearTimeout(timer);}
      if(current!==my)return;
      if(d.t==='out')out.textContent+=d.s;
      else if(d.t==='done'){finish(d.r);}
    };
    w.postMessage({code:my.code,inputs:my.inputs,maxMs:20000});
  }
  bRun.addEventListener('click',run);
  bStop.addEventListener('click',()=>{
    if(!current||!worker)return;
    try{worker.terminate();}catch(e){}worker=null;current=null;setBusy(false);
    errb.hidden=true;st.textContent='Programma fermato.';out.textContent+='\n[fermato]';
  });
}

function makeClassId(short){

async function saveClassForm(form){
  const err=$('.ed-err',form),short=form.elements.short.value.trim(),name=form.elements.name.value.trim()||short;
  const colorEl=form.querySelector('[name=color]:checked'),shapeEl=form.querySelector('[name=shape]:checked');
  if(!short){err.textContent='Scrivi il nome breve della classe.';err.hidden=false;return;}
  if(!colorEl||!shapeEl){err.textContent='Scegli un colore e un simbolo.';err.hidden=false;return;}
  const id=classEdit==='new'?makeClassId(short):classEdit;
  if(CLASSES.some(c=>c.id!==id&&!c.deleted&&c.color===colorEl.value&&c.shape===shapeEl.value)){err.textContent='Un\'altra classe ha già questo colore con questo simbolo: cambia uno dei due.';err.hidden=false;return;}
  const prev=CL[id];
  const data={short:short,name:name,color:colorEl.value,shape:shapeEl.value,order:prev?prev.order:CLASSES.reduce((m,c)=>Math.max(m,c.order===9999?0:c.order),0)+10,deleted:prev?!!prev.deleted:false};
  try{await putClass(id,data);classEdit=null;render();toast('Classe salvata.');}catch(e){writeError(e);}
}
async function classAct(a,id){
  try{
    if(a==='new'){classEdit='new';render();const f=$('#cf-s');if(f)f.focus();}
    else if(a==='edit'){classEdit=id;render();const f=$('#cf-s');if(f)f.focus();}
    else if(a==='cancel'){classEdit=null;render();}
    else if(a==='hide'||a==='show'){const c=CL[id];await putClass(id,{short:c.short,name:c.name,color:c.color,shape:c.shape,order:c.order,deleted:a==='hide'});render();}
    else if(a==='up'||a==='down'){
      const i=CLASSES.findIndex(c=>c.id===id),j=i+(a==='up'?-1:1);if(j<0||j>=CLASSES.length)return;
      const A=CLASSES[i],B=CLASSES[j];let oa=A.order,ob=B.order;if(oa===ob){ob=oa+(a==='up'?-1:1);}
      const dat=c=>({short:c.short,name:c.name,color:c.color,shape:c.shape,deleted:c.deleted});
      await putClass(A.id,Object.assign(dat(A),{order:ob}));await putClass(B.id,Object.assign(dat(B),{order:oa}));render();
    }
  }catch(e){writeError(e);}
}

function excerpt(body){
  const L=String(body||'').split('\n');let i=0;
  for(;i<L.length;i++){const l=L[i].trim();if(!l||/^(```|## |\||>|- |\d+\. |\?\? |!! )/.test(l))continue;
    return l.replace(/\*\*|`/g,'').slice(0,150);}
  return '';
}

/* ---------- azioni ---------- */
async function move(id,dir){
  const vs=all().filter(s=>forClass(s,route.c)&&kindOf(s)==='topic'),me=vs.find(s=>s.id===id);if(!me)return;
  const same=vs.filter(s=>s.chapter===me.chapter),i=same.findIndex(s=>s.id===id),nb=same[i+dir];if(!nb)return;
  if(me.order===nb.order){await put(me.id,Object.assign(fields(me),{order:nb.order+(dir<0?-1:1)}));}
  else{const a=me.order,b=nb.order;await put(me.id,Object.assign(fields(me),{order:b}));await put(nb.id,Object.assign(fields(nb),{order:a}));}
  render();
}
const newId=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const nextOrder=chId=>all().filter(s=>s.chapter===chId).reduce((m,s)=>Math.max(m,s.order===9999?0:s.order),0)+10;
async function addSection(chId){
  const id=newId();
  await put(id,{chapter:chId,order:nextOrder(chId),title:'Nuova sezione',body:'## Sottotitolo\nScrivi qui il contenuto.',classes:[route.c],widget:'',deleted:false,custom:true});
  newIds.add(id);editing.add(id);render();
  const f=$('#sec-'+id+' input[name=title]');if(f){f.focus();f.select();}
  const el=document.getElementById('sec-'+id);if(el)el.scrollIntoView({block:'start'});
}
async function addItem(kind){
  const id=newId(),c=CL[route.c],T=TEMPLATES[kind];
  await put(id,{chapter:kind,order:nextOrder(kind),title:T.title,body:tplBody(kind,c),classes:[c.id],widget:'',materials:[],deleted:false,custom:true});
  newIds.add(id);editing.add(id);
  navTo(cPath(c.id,KINDS[kind].slug,id));
  const f=$('#sec-'+id+' input[name=title]');if(f){f.focus();f.select();}
}
async function toggleLink(id,on){
  const s=all().find(x=>x.id===id);if(!s)return;
  const cl=s.classes.filter(c=>c!==route.c);if(on)cl.push(route.c);
  await put(id,Object.assign(fields(s),{classes:cl}));
  render();const el=document.querySelector('[data-link="'+id+'"]');if(el)el.focus();
}
async function linkAll(from){
  const secs=all().filter(s=>kindOf(s)==='topic'&&!s.deleted&&s.classes.indexOf(from)>=0&&s.classes.indexOf(route.c)<0);
  for(const s of secs)await put(s.id,Object.assign(fields(s),{classes:s.classes.concat([route.c])}));
  render();toast(secs.length?('Collegati '+plural(secs.length,'argomento','argomenti')+'.'):'Erano già tutti collegati.');
}
async function saveEditor(form){
  const id=form.dataset.id,s=all().find(x=>x.id===id);if(!s)return;
  const err=$('.ed-err',form),title=form.elements.title.value.trim();
  const classes=$$('input[name=cls]:checked',form).map(x=>x.value);
  if(!title){err.textContent='Scrivi un titolo.';err.hidden=false;return;}
  if(!classes.length){err.textContent='Scegli almeno una classe.';err.hidden=false;return;}
  const mats=[];let badUrl=false;
  $$('.matrow',form).forEach(r=>{
    const u=$('[name=murl]',r).value.trim();if(!u)return;
    const cu=cleanUrl(u);if(!cu){badUrl=true;return;}
    mats.push({kind:$('[name=mkind]',r).value,title:$('[name=mtitle]',r).value.trim(),url:cu});
  });
  if(badUrl){err.textContent='Un indirizzo non è valido: deve iniziare con https:// oppure con allegati/.';err.hidden=false;return;}
  const data=Object.assign(fields(s),{title:title,classes:classes,body:form.elements.body.value.replace(/\s+$/,''),widget:form.elements.widget.value,materials:mats,deleted:false});
  try{await put(id,data);newIds.delete(id);editing.delete(id);
    if(route.v==='class'&&route.item===id&&classes.indexOf(route.c)<0){navTo(cPath(route.c,route.tab));toast('Pagina salvata. Non è più collegata a questa classe.');}
    else{render();toast('Pagina salvata.');}
  }catch(e){writeError(e);}
}
function backToList(){if(route.v==='class'&&route.item)navTo(cPath(route.c,route.tab));else render();}
async function act(a,id,btn){
  try{
    if(a==='edit'){editing.add(id);confirmState=null;render();const f=$('#sec-'+id+' input[name=title]');if(f)f.focus();}
    else if(a==='cancel'){editing.delete(id);if(newIds.has(id)){newIds.delete(id);await del(id);backToList();}else render();}
    else if(a==='up')await move(id,-1);
    else if(a==='down')await move(id,1);
    else if(a==='del'){confirmState={id:id,kind:'del'};render();}
    else if(a==='rest'){confirmState={id:id,kind:'rest'};render();}
    else if(a==='no'){confirmState=null;render();}
    else if(a==='delyes'){
      confirmState=null;const s=all().find(x=>x.id===id);
      const gone=!!(s&&s._custom);
      if(s){if(gone)await del(id);else await put(id,Object.assign(fields(s),{deleted:true}));}
      backToList();toast(gone?'Pagina eliminata.':'Pagina eliminata. In fondo all\'elenco puoi ripristinarla.');
    }
    else if(a==='restyes'){confirmState=null;await del(id);render();toast('Testo originale ripristinato.');}
    else if(a==='undel'){const rid=btn.dataset.id,s=all().find(x=>x.id===rid);if(s){await put(rid,Object.assign(fields(s),{deleted:false}));render();}}
    else if(a==='add')await addSection(btn.dataset.chapter);
    else if(a==='additem')await addItem(btn.dataset.kind);
    else if(a==='linkall'){const f=$('#lk-from');if(f)await linkAll(f.value);}
  }catch(e){writeError(e);}
}

function exportMd(){
  const cid=route.v==='class'?route.c:null;
  const vs=all().filter(s=>!s.deleted&&s.classes.length&&(!cid||s.classes.indexOf(cid)>=0));
  let out='# Informatica in Classe\n\n';
  if(cid)out+='Classe: '+CL[cid].name+'\n\n';
  chapters.forEach(ch=>{
    const l=vs.filter(s=>s.chapter===ch.id);if(!l.length)return;
    out+='## '+(ch.virtual?ch.title:ch.num+'. '+ch.title)+'\n\n';
    l.forEach(s=>{
      const body=s.body.replace(/^## /gm,'#### ').replace(/^\?\? /gm,'**Domanda:** ').replace(/^!! /gm,'**Risposta:** ');
      out+='### '+s.title+'\n\n_Classi: '+s.classes.map(c=>CL[c].name).join('; ')+'_\n\n'+body+'\n\n'+(s.materials.length?'**Materiali della lezione**\n'+s.materials.map(m=>'- '+(m.title||MKINDS[m.kind].label)+': '+m.url).join('\n')+'\n\n':'');
    });
  });
  saveFile(cid?'informatica-'+cid.toLowerCase()+'.md':'informatica-in-classe.md',out);
}
function exportSrc(){
  const secs=all().filter(s=>!s.deleted&&s.classes.length);
  let out=CLASSES.map(c=>'@@class '+c.id+' | '+c.short.replace(/\|/g,'/')+' | '+c.name.replace(/\|/g,'/')+' | '+c.color+' | '+c.shape+(c.deleted?' | hidden':'')).join('\n')+'\n\n';
  chapters.forEach(ch=>{
    const l=secs.filter(s=>s.chapter===ch.id);
    if(ch.virtual&&!l.length)return;
    out+='@@chapter '+ch.id+' | '+ch.num+' | '+ch.title+' | '+ch.desc+'\n\n';
    l.forEach(s=>{
      out+='@@section '+s.id+' | '+s.classes.join(' ')+' | '+(s.widget||'-')+' | '+s.title.replace(/\|/g,'/')+'\n'+s.materials.map(m=>'@@material '+m.kind+' | '+m.title.replace(/\|/g,'/')+' | '+m.url+'\n').join('')+s.body+'\n\n';
    });
  });
  saveFile('content.txt',out.trim()+'\n');
}
function saveFile(name,text){
  if(dl){
    dl.save({filename:name,data:text}).then(()=>toast('File salvato.')).catch(e=>{if(!e||e.code!=='declined')toast('Non è stato possibile salvare il file.');});
    return;
  }
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));
    a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('File scaricato.');
  }catch(e){toast('Non è stato possibile salvare il file.');}
}

    if(a&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&e.button===0){e.preventDefault();navTo(a.dataset.nav);}
  });

    const r=parsePath(hashPath());

  });
  $('#btnEdit').addEventListener('click',async()=>{
    editOn=!editOn;
    if(!editOn){
      const drop=Array.from(newIds);editing.clear();newIds.clear();confirmState=null;classEdit=null;
      for(const id of drop){try{await del(id);}catch(e){}}

      const f=$('input[name=mtitle]',box.lastElementChild);if(f)f.focus();
      return;
    }
    if(b.dataset.act==='delmat'){b.closest('.matrow').remove();return;}
    const art=b.closest('article');act(b.dataset.act,art?art.id.slice(4):b.dataset.id,b);
  });
  main.addEventListener('submit',e=>{
    const cf=e.target.closest('form.cm-form');if(cf){e.preventDefault();saveClassForm(cf);return;}
    const f=e.target.closest('form.editor');if(!f)return;e.preventDefault();saveEditor(f);
  });
  main.addEventListener('change',e=>{
    const l=e.target.closest('[data-link]');if(l)toggleLink(l.dataset.link,l.checked).catch(writeError);
  });
  main.addEventListener('input',e=>{
    const f=e.target.closest('form.editor');
    if(f&&e.target.name==='body')$('.preview',f).innerHTML=renderBody(e.target.value);
  });
  const mq=window.matchMedia('(min-width:900px)'),box=$('#tocBox');
  const sync=()=>{box.open=mq.matches;};
  sync();if(mq.addEventListener)mq.addEventListener('change',sync);
  $('#toc').addEventListener('click',e=>{
    const a=e.target.closest('[data-go]');if(!a)return;
    e.preventDefault();
    const t=document.getElementById(a.dataset.go);
    if(t)t.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
    if(!mq.matches)box.open=false;
  });
}

/* ---------- avvio ---------- */
async function initStore(){
  const c=window.claude;
  try{dbh=c&&c.use?await c.use('db'):null;}catch(e){dbh=null;}
  try{const u=c&&c.use?await c.use('user'):null;if(u){const w=await u.can('data.write');if(w===false)canWrite=false;}}catch(e){}
  try{dl=c&&c.use?await c.use('downloads'):null;}catch(e){dl=null;}
  if(dbh){
    mode='db';
    dbh.collection('sections').onSnapshot(snap=>{
      const o={},co={};
      snap.docs.forEach(d=>{const x=d.data();if(!x)return;if(d.id.indexOf('cls-')===0){const y=Object.assign({},x);delete y._class;co[d.id.slice(4)]=y;}else o[d.id]=Object.assign({},x);});
      overrides=o;classOv=co;rebuildClasses();
      if(route.v==='home'){const r=parsePath(hashPath());if(r.v==='class')route=r;}
      else if(!CL[route.c]||CL[route.c].deleted)route={v:'home'};
      render();
    },err=>{if(err&&err.code==='revoked'){canWrite=false;editOn=false;syncUi();render();}else toast('Il collegamento con il salvataggio condiviso si è interrotto.');});
  }else{
    mode='local';overrides=lsGet(LS_OV,{})||{};classOv=lsGet(LS_CL,{})||{};rebuildClasses();
