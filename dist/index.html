pendenza b = 0.03781 cm/g
r = 0.9992  R^2 = 0.9985
```

## Fare previsioni
Una volta trovata la retta, si può usare per stimare y per un nuovo valore di x. È il modo più semplice con cui un computer **impara dai dati** e poi fa previsioni: gli esempi servono a trovare a e b, poi la retta si usa su dati mai visti. È lo stesso principio dell'apprendimento automatico.

```python
def prevedi(x):
    return a + b * x

print("previsione per 275 g:", round(prevedi(275), 2), "cm")
print("previsione per 900 g:", round(prevedi(900), 2), "cm")
print("massa per una lunghezza di 20 cm:", round((20 - a) / b, 1), "g")

residui = [yi - prevedi(xi) for xi, yi in zip(massa, lunghezza)]
errore = (sum(e ** 2 for e in residui) / (len(massa) - 2)) ** 0.5
print("errore tipico dei residui:", round(errore, 3), "cm")
```

```output
previsione per 275 g: 20.87 cm
previsione per 900 g: 44.5 cm
massa per una lunghezza di 20 cm: 252.1 g
errore tipico dei residui: 0.196 cm
```

## Come usare bene una previsione
- **Interpolazione**: la previsione per 275 g cade tra i valori misurati (50-400 g) ed è affidabile.
- **Estrapolazione**: quella per 900 g sta fuori dall'intervallo misurato. Una molla reale oltre un certo carico si deforma e la legge lineare non vale più. Il calcolo dà un numero, ma il numero può essere sbagliato.
- Un R² alto non prova che x causi y: la correlazione non è causalità.
- Guarda sempre i residui: se hanno un andamento (per esempio a curva) la retta non è il modello giusto.

Con scipy (da eseguire sul computer o su Google Colab):

from scipy import stats
res = stats.linregress(massa, lunghezza)
print(round(float(res.intercept), 3), round(float(res.slope), 5), round(float(res.rvalue), 4), float(res.pvalue) < 0.001)
```

```

?? Che cosa indica una pendenza b = 0,04 cm/g?
!! Che ogni grammo in più allunga la molla di 0,04 cm, cioè 4 cm ogni 100 g.
?? R² = 0,99 significa che x causa y?
!! No. Significa che la retta spiega il 99% della variabilità dei dati. La causa va stabilita con l'esperimento, non con il calcolo.
?? Perché la previsione per 900 g è poco affidabile?
!! Perché 900 g è fuori dall'intervallo delle masse misurate (50-400 g): la relazione potrebbe non essere più lineare.

@@section st-7 | L2 L3 | - | Quale test scegliere
Prima di scegliere il test si risponde a tre domande: che cosa voglio confrontare? Quanti gruppi ci sono? I dati sono normali?

| Situazione | Test | In Python con scipy |
|---|---|---|
| Dati normali? | Shapiro-Wilk, Jarque-Bera | `stats.shapiro(x)` |
| Una media contro un valore noto | t-test per un campione | `stats.ttest_1samp(x, mu0)` |
| Due gruppi indipendenti | t-test di Welch | `stats.ttest_ind(a, b, equal_var=False)` |
| Due misure sugli stessi soggetti | t-test appaiato | `stats.ttest_rel(prima, dopo)` |
| Tre o più gruppi | ANOVA a un fattore | `stats.f_oneway(a, b, c)` |
| Due gruppi, dati non normali | Mann-Whitney | `stats.mannwhitneyu(a, b)` |
| Relazione tra due variabili | Regressione lineare | `stats.linregress(x, y)` |

## Come si scrive il risultato
Una frase completa riporta i numeri e la decisione. Per esempio: "Il periodo medio è 2,020 s con errore standard 0,008 s (n = 10)". Per un test: "Il test t di Welch non mostra una differenza significativa tra i concimi (t = −1,84, gl = 15,4, p = 0,085)".

## Schema di lavoro
1. Descrivi i dati: media, deviazione standard, istogramma.
2. Controlla la normalità.
3. Scegli il test e fissa α prima di guardare il risultato.
4. Calcola il p-value e decidi.
5. Scrivi la conclusione in parole, indicando anche la dimensione dell'effetto (la differenza tra le medie).

> [Intelligenza artificiale] Gli stessi passi servono prima di addestrare un modello: dati ben descritti, controllati e divisi in esempi per imparare e in esempi per verificare.

## Per esercitarsi
Raccogliete in classe un dato misurabile (altezza, tempo sui 50 metri, pulsazioni a riposo e dopo uno sforzo) e rispondete con Python: i dati sono normali? Le medie dei maschi e delle femmine sono diverse? C'è relazione tra due grandezze?

?? Pulsazioni di 12 studenti a riposo e dopo 20 flessioni. Quale test si usa per vedere se l'esercizio le aumenta?
!! Il t-test appaiato (`ttest_rel`), perché le due misure sono prese sugli stessi studenti.
?? Il risultato di un test è p = 0,049 con α = 0,05. Come si interpreta?
!! Formalmente si rifiuta H0, ma il risultato è al limite: conviene riportare il valore esatto, la dimensione dell'effetto e, se possibile, ripetere con più dati.

@@chapter c5 | 6 | Programmazione a oggetti | Classi, oggetti, ereditarietà e polimorfismo applicati a modelli scientifici.

@@section s5-1 | L4 | - | Dal procedurale agli oggetti
Finora i dati (variabili, liste) e le funzioni che li usano sono stati separati. Nella programmazione a oggetti si uniscono: un **oggetto** contiene i propri dati (**attributi**) e le operazioni che li riguardano (**metodi**).

Una **classe** è lo stampo da cui si creano gli oggetti. Ogni oggetto creato da una classe è un'**istanza**.

> [Fisica] Una particella ha una massa e una velocità, e può calcolare la propria energia cinetica.

```python
class Particella:
    def __init__(self, massa, velocita):
        self.massa = massa
        self.velocita = velocita

    def energia_cinetica(self):
        return 0.5 * self.massa * self.velocita ** 2

p = Particella(2, 3)
print(p.energia_cinetica())
```

```output
9.0
```

I vantaggi sono l'ordine (tutto ciò che riguarda la particella è nello stesso posto), il riuso del codice e la possibilità di modellare sistemi con tanti elementi simili.

?? Che differenza c'è tra classe e oggetto?
!! La classe è il modello generale. L'oggetto è un esemplare concreto creato dalla classe, con i suoi valori.
?? Come si crea una seconda particella con massa 5 e velocità 1?
!! q = Particella(5, 1).

@@section s5-2 | L4 | - | Costruttore, attributi e metodi
Il metodo speciale `__init__` è il **costruttore**: viene eseguito quando si crea un oggetto e inizializza gli attributi. Il primo parametro, `self`, è l'oggetto stesso.

> [Scienze naturali] Un animale ha un nome, una specie e un numero di zampe.

```python
class Animale:
    def __init__(self, nome, specie, zampe):
        self.nome = nome
        self.specie = specie
        self.zampe = zampe

    def __str__(self):
        return f"{self.nome} ({self.specie}), {self.zampe} zampe"

gatto = Animale("Micio", "Felis catus", 4)
print(gatto)
```

```output
Micio (Felis catus), 4 zampe
```

Il metodo `__str__` dice come mostrare l'oggetto quando lo si stampa.

## Attributi di classe e di istanza
Gli attributi creati con `self` appartengono a un singolo oggetto. Un attributo scritto nel corpo della classe è condiviso da tutti gli oggetti.

> [Chimica] Una classe Elemento può avere come attributo condiviso la costante di Avogadro, uguale per tutti gli elementi.

?? Che cosa succede se si dimentica self nella definizione di un metodo?
!! Python segnala un errore, perché l'oggetto viene passato automaticamente come primo argomento e il metodo non ha un parametro che lo riceva.
?? Quando viene eseguito __init__?
!! Ogni volta che si crea un nuovo oggetto della classe.

@@section s5-3 | L4 | - | Incapsulamento
L'**incapsulamento** protegge i dati di un oggetto: gli attributi si modificano solo attraverso metodi che controllano che il valore sia accettabile. In Python, per convenzione, un nome che inizia con `_` indica un attributo interno.

> [Chimica] Il pH di una soluzione deve stare tra 0 e 14. La classe rifiuta valori diversi.

```python
class Soluzione:
    def __init__(self, ph):
        self.ph = ph

    @property
    def ph(self):
        return self._ph

    @ph.setter
    def ph(self, valore):
        if not 0 <= valore <= 14:
            raise ValueError("Il pH deve essere tra 0 e 14")
        self._ph = valore

    def tipo(self):
        if self._ph < 7:
            return "acida"
        elif self._ph == 7:
            return "neutra"
        return "basica"

s = Soluzione(3.5)
print(s.tipo())
s.ph = 20
```

```output
acida
ValueError: Il pH deve essere tra 0 e 14
```

Il codice che usa la classe scrive `s.ph = 20` come se fosse un normale attributo, ma il controllo viene eseguito ogni volta. La classe garantisce di essere sempre in uno stato valido.

?? Perché l'incapsulamento rende i programmi più affidabili?
!! Perché i controlli sono in un solo punto, la classe, e nessuna altra parte del programma può mettere l'oggetto in uno stato non valido.
?? Che cosa succede con Soluzione(-1)?
!! Il costruttore assegna self.ph, il setter controlla e solleva un ValueError.

@@section s5-4 | L4 | - | Ereditarietà
L'**ereditarietà** permette di creare una classe a partire da un'altra. La classe figlia riceve attributi e metodi della classe madre e può aggiungerne o modificarli.

> [Scienze naturali] La classificazione biologica è una gerarchia: ogni organismo ha un nome, un animale ha in più un modo di muoversi, un mammifero ha in più il fatto di allattare.

```python
class Organismo:
    def __init__(self, nome):
        self.nome = nome

    def descrivi(self):
        return self.nome + " è un organismo"

class Animale(Organismo):
    def descrivi(self):
        return self.nome + " è un animale"

class Mammifero(Animale):
    def descrivi(self):
        return super().descrivi() + " che allatta i piccoli"

print(Organismo("quercia").descrivi())
print(Mammifero("gatto").descrivi())
```

```output
quercia è un organismo
gatto è un animale che allatta i piccoli
```

`super()` richiama il metodo della classe madre. La relazione di ereditarietà si legge "è un": un mammifero è un animale, un animale è un organismo.

?? Perché Mammifero non ha bisogno di un suo __init__?
!! Lo eredita da Organismo attraverso Animale, e va bene così perché non servono altri attributi.
?? Quando conviene l'ereditarietà e quando no?
!! Conviene quando c'è una vera relazione "è un". Se la relazione è "ha un" (un'auto ha un motore), è meglio mettere un oggetto dentro un altro.

@@section s5-5 | L4 | - | Polimorfismo
Il **polimorfismo** permette di trattare allo stesso modo oggetti di classi diverse, purché abbiano un metodo con lo stesso nome. Ogni oggetto esegue la propria versione.

> [Matematica] Cerchi e rettangoli hanno entrambi un'area, ma la calcolano in modo diverso.

```python
import math

class Cerchio:
    def __init__(self, r):
        self.r = r

    def area(self):
        return math.pi * self.r ** 2

class Rettangolo:
    def __init__(self, b, h):
        self.b = b
        self.h = h

    def area(self):
        return self.b * self.h

figure = [Cerchio(1), Rettangolo(2, 3)]
for f in figure:
    print(round(f.area(), 2))
```

```output
3.14
6
```

Il ciclo non deve sapere di che figura si tratta: chiama `area()` e ogni oggetto risponde a modo suo. Aggiungere un Triangolo non richiede di cambiare il ciclo.

?? Che cosa serve per aggiungere un Triangolo all'elenco delle figure?
!! Una nuova classe Triangolo con un metodo area(). Il ciclo continua a funzionare senza modifiche.
?? Che cosa stampa round(Rettangolo(2, 3).area(), 2)?
!! 6.

@@section s5-6 | L4 | - | Progetto: un neurone artificiale
Un **neurone artificiale** è un modello matematico molto semplice. Riceve dei numeri in ingresso, li moltiplica per dei **pesi**, somma un **bias** e produce 1 se il risultato è positivo, altrimenti 0. Le reti neurali usate nell'intelligenza artificiale sono fatte di moltissimi neuroni di questo tipo, messi in fila.

> [Logica e Matematica] Con pesi 1 e 1 e bias -1,5 il neurone si comporta come la porta logica AND: dà 1 solo se entrambi gli ingressi valgono 1.

```python
class Neurone:
    def __init__(self, pesi, bias):
        self.pesi = pesi
        self.bias = bias

    def attiva(self, ingressi):
        somma = self.bias
        for p, x in zip(self.pesi, ingressi):
            somma += p * x
        return 1 if somma > 0 else 0

and_logico = Neurone([1, 1], -1.5)
print(and_logico.attiva([1, 1]), and_logico.attiva([1, 0]))
```

```output
1 0
```

## Richieste
1. Trova pesi e bias che realizzano la porta OR.
2. Costruisci una classe Rete che contiene una lista di neuroni e li interroga tutti.
3. Cambia i pesi a mano e osserva come cambiano le risposte: è ciò che un algoritmo di apprendimento fa in automatico.

?? Che cosa dà and_logico.attiva([0, 0])?
!! 0, perché la somma è -1,5, non positiva.
?? Quali pesi e bias danno la porta OR?
!! Per esempio pesi 1 e 1 e bias -0,5: la somma è positiva se almeno un ingresso vale 1.

@@section s5-7 | L4 | - | Diagrammi UML delle classi
Prima di scrivere il codice si progetta con un **diagramma delle classi UML**. Ogni classe è un rettangolo con tre parti: nome, attributi, metodi.

```output
+---------------------+
| Particella          |
+---------------------+
| massa: float        |
| velocita: float     |
+---------------------+
| energia_cinetica()  |
+---------------------+
```

## Relazioni tra classi
| Relazione | Significato | Esempio |
|---|---|---|
| Ereditarietà | "è un" | Mammifero è un Animale |
| Associazione | "usa" o "conosce" | Un Laboratorio conosce molte Misure |
| Composizione | "è composto da" | Un Neurone è composto da pesi |

Nell'ereditarietà la freccia a punta vuota va dalla classe figlia alla madre.

?? Disegna la classe Elemento con numero atomico, simbolo e massa.
!! Nome: Elemento. Attributi: numero_atomico: int, simbolo: str, massa: float. Metodi possibili: descrizione().
?? Un'Auto e un Motore: ereditarietà o composizione?
!! Composizione: un'auto ha un motore, non è un motore.

@@chapter c6 | 7 | Basi di dati | Database relazionali con SQL e database non relazionali con documenti JSON.

@@section s6-1 | L4 | - | Perché servono i database
Un file di testo va bene per pochi dati. Quando i dati crescono e li usano più persone, nascono problemi: informazioni **ripetute** in più punti, dati **incoerenti**, ricerche lente, accessi in conflitto.

Un **database** è un insieme organizzato di dati. Un **DBMS** (Database Management System) è il programma che lo gestisce: garantisce che i dati siano corretti, ne controlla l'accesso e risponde alle interrogazioni.

> [Fisica] Un registro di laboratorio con migliaia di misure, raccolte da più sensori e da più gruppi di studenti.

> [Scienze naturali] Un catalogo delle specie di un parco naturale, con habitat, massa e avvistamenti.

## Due grandi famiglie
- **Database relazionali**: i dati sono in tabelle collegate tra loro. Si interrogano con il linguaggio SQL.
- **Database non relazionali** (NoSQL): i dati sono in forme più libere, come documenti, coppie chiave-valore o grafi.

?? Che cosa fa un DBMS?
!! Gestisce un database: memorizza i dati, ne garantisce la correttezza e risponde alle richieste degli utenti.
?? Perché ripetere lo stesso dato in più file è un problema?
!! Perché se cambia va corretto ovunque. Se se ne dimentica uno, i dati diventano incoerenti.

@@section s6-2 | L4 | - | Il modello relazionale
Nel modello relazionale i dati sono in **tabelle**. Ogni riga è un **record**, ogni colonna è un **attributo** con un tipo.

> [Chimica] Tabella `elemento` della tavola periodica.

| numero_atomico | simbolo | nome | massa |
|---|---|---|---|
| 1 | H | Idrogeno | 1.008 |
| 6 | C | Carbonio | 12.011 |
| 8 | O | Ossigeno | 15.999 |
| 11 | Na | Sodio | 22.99 |
| 17 | Cl | Cloro | 35.45 |

## Chiavi
- **Chiave primaria**: attributo che identifica un record in modo unico, qui `numero_atomico`.
- **Chiave esterna**: attributo che contiene la chiave primaria di un'altra tabella e crea il collegamento.

## Vincoli di integrità
Il DBMS rifiuta le operazioni che violano le regole: due record con la stessa chiave primaria, una chiave esterna che punta a un record inesistente, un valore vuoto dove non è ammesso.

?? Perché il nome dell'elemento non è una buona chiave primaria?
!! Potrebbe cambiare o avere più forme (per esempio in lingue diverse). Il numero atomico è unico e stabile.
?? Che cosa impedisce una chiave esterna?
!! Impedisce di collegare un record a un altro che non esiste.

@@section s6-3 | L4 | - | Progettazione: modello E-R e normalizzazione
Prima di creare le tabelle si disegna il **modello Entità-Relazione**: le **entità** sono le cose che interessano, le **associazioni** i legami tra loro.

Le associazioni hanno una **cardinalità**:
- **uno a molti** (1:N): un habitat ospita molte specie. Si realizza con una chiave esterna nella tabella "molti".
- **molti a molti** (N:M): una specie vive in più habitat e un habitat ospita più specie. Si realizza con una **tabella ponte**.

> [Scienze naturali] Specie e habitat sono legate da un'associazione N:M.

```output
SPECIE  (id_specie PK, nome, nome_scientifico)
HABITAT (id_habitat PK, nome)
VIVE_IN (id_specie FK, id_habitat FK)
```

## Normalizzazione
Serve a eliminare le ripetizioni. Le prime tre forme normali dicono, in sintesi:
1. Ogni cella contiene un solo valore, non un elenco.
2. Ogni attributo dipende dall'intera chiave primaria.
3. Ogni attributo dipende solo dalla chiave primaria, non da altri attributi.

?? Perché serve una tabella ponte per l'associazione N:M?
!! Perché una singola colonna non può contenere più valori. La tabella ponte ha una riga per ogni coppia (specie, habitat).
?? Una cella contiene "foresta, tundra, montagna". Quale forma normale viola?
!! La prima: una cella deve contenere un solo valore.

@@section s6-4 | L4 | - | SQL: interrogare i dati
SQL (Structured Query Language) è il linguaggio dei database relazionali. L'interrogazione fondamentale è `SELECT`.

> [Chimica] Elementi con massa maggiore di 15, dal più pesante al più leggero.

```sql
SELECT simbolo, nome, massa
FROM elemento
WHERE massa > 15
ORDER BY massa DESC;
```

```output
simbolo | nome     | massa
Cl      | Cloro    | 35.45
Na      | Sodio    | 22.99
O       | Ossigeno | 15.999
```

## Le clausole principali
| Clausola | A che serve |
|---|---|
| `SELECT` | Sceglie le colonne da mostrare |
| `FROM` | Indica la tabella |
| `WHERE` | Filtra i record |
| `ORDER BY` | Ordina il risultato |
| `GROUP BY` | Raggruppa i record per calcolare totali o medie |
| `JOIN` | Unisce più tabelle tramite le chiavi |

## JOIN
> [Scienze naturali] Specie che vivono nella tundra.

```sql
SELECT specie.nome, habitat.nome
FROM specie
JOIN vive_in ON vive_in.id_specie = specie.id_specie
JOIN habitat ON habitat.id_habitat = vive_in.id_habitat
WHERE habitat.nome = 'tundra';
```

## Funzioni di gruppo
> [Fisica] Temperatura media misurata da ciascun sensore.

```sql
SELECT sensore, AVG(temperatura)
FROM misura
GROUP BY sensore;
```

?? Scrivi l'interrogazione che mostra solo i nomi degli elementi con numero atomico minore di 10.
!! SELECT nome FROM elemento WHERE numero_atomico < 10;
?? A che serve GROUP BY?
!! A raggruppare i record che hanno lo stesso valore in una colonna, per applicare funzioni come AVG, SUM, COUNT a ciascun gruppo.

@@section s6-5 | L4 | - | SQL da Python con sqlite3
Python include il modulo `sqlite3`, che gestisce un database relazionale in un singolo file, senza installare nulla. Con `":memory:"` il database vive solo in memoria.

> [Chimica] Creazione della tabella degli elementi e interrogazione.

```python
import sqlite3

conn = sqlite3.connect(":memory:")
cur = conn.cursor()
cur.execute("CREATE TABLE elemento (simbolo TEXT PRIMARY KEY, nome TEXT, massa REAL)")
cur.executemany(
    "INSERT INTO elemento VALUES (?, ?, ?)",
    [("H", "Idrogeno", 1.008), ("C", "Carbonio", 12.011), ("O", "Ossigeno", 15.999)],
)
conn.commit()
for riga in cur.execute("SELECT nome, massa FROM elemento WHERE massa > 10"):
    print(riga)
```

```output
('Carbonio', 12.011)
('Ossigeno', 15.999)
```

## I segnaposto `?`
I valori non vanno mai incollati dentro il testo della query. Si usano i segnaposto `?` e si passano i valori a parte. Così si evita la **SQL injection**, un attacco in cui l'utente scrive codice SQL al posto di un normale valore.

## Scrivere e salvare
`conn.commit()` rende definitive le modifiche. Con un nome di file al posto di `":memory:"` i dati restano anche dopo la chiusura del programma.

?? Perché serve conn.commit() dopo gli INSERT?
!! Perché senza commit le modifiche non vengono scritte in modo definitivo nel database.
?? Perché non si scrive "... WHERE nome = '" + nome + "'" nella query?
!! Un utente potrebbe inserire codice SQL come nome e farlo eseguire (SQL injection). I segnaposto ? lo impediscono.

@@section s6-6 | L4 | - | Database non relazionali (NoSQL)
Non tutti i dati stanno comodamente in tabelle. I database **NoSQL** (Not only SQL) usano modelli diversi.

| Tipo | Come organizza i dati | Esempio di sistema |
|---|---|---|
| Documentale | Documenti JSON con campi liberi | MongoDB |
| Chiave-valore | Coppie chiave e valore, come un grande dizionario | Redis |
| A grafo | Nodi e archi che li collegano | Neo4j |
| A colonne | Tabelle a righe molto larghe, distribuite su molti server | Cassandra |

## Relazionali e documentali a confronto
| Aspetto | Relazionale | Documentale |
|---|---|---|
| Struttura | Tabelle con schema fisso | Documenti con campi che possono variare |
| Collegamenti | Chiavi esterne e JOIN | Documenti annidati o riferimenti |
| Linguaggio | SQL | Interrogazioni proprie del sistema |
| Garanzie | Transazioni ACID | Dipende dal sistema, spesso coerenza meno rigida |

**ACID** sta per Atomicità, Coerenza, Isolamento, Durabilità: sono le proprietà che rendono una transazione affidabile, per esempio un bonifico bancario.

> [Storia] La rete dei rapporti tra personaggi e luoghi di un periodo storico si rappresenta bene con un grafo: ogni persona è un nodo e ogni legame è un arco.

?? Quale tipo di NoSQL userebbe un sito per conservare le sessioni degli utenti, con ricerca veloce per codice?
!! Chiave-valore (per esempio Redis): la chiave è il codice di sessione e il valore sono i dati.
?? Perché per un conto bancario si preferisce un database con transazioni ACID?
!! Perché un trasferimento deve avvenire per intero o non avvenire, e nessun dato deve restare a metà.

@@section s6-7 | L4 | - | Documenti JSON in Python
**JSON** è un formato di testo per scrivere dati strutturati. Somiglia ai dizionari e alle liste di Python. I database documentali conservano documenti di questo tipo.

> [Scienze naturali] Un documento che descrive una specie, con un elenco di habitat e un intervallo di massa.

```python
import json

specie = {
    "nome": "Lupo",
    "nome_scientifico": "Canis lupus",
    "habitat": ["foresta", "tundra", "montagna"],
    "massa_kg": {"min": 20, "max": 80},
}
testo = json.dumps(specie, indent=2, ensure_ascii=False)
print(testo)
```

```output
{
  "nome": "Lupo",
  "nome_scientifico": "Canis lupus",
  "habitat": [
    "foresta",
    "tundra",
    "montagna"
  ],
  "massa_kg": {
    "min": 20,
    "max": 80
  }
}
```

Il documento contiene una lista e un oggetto annidato nello stesso record. In un database relazionale servirebbero tre tabelle e due JOIN per ottenere la stessa informazione.

## Leggere e scrivere file JSON
```python
with open("specie.json", "w", encoding="utf-8") as f:
    json.dump(specie, f, indent=2, ensure_ascii=False)

with open("specie.json", encoding="utf-8") as f:
    dati = json.load(f)
print(dati["habitat"])
```

In MongoDB, con la libreria `pymongo`, la ricerca delle specie che vivono nella tundra si scrive `collezione.find({"habitat": "tundra"})`.

?? Quale tipo Python corrisponde a un oggetto JSON tra parentesi graffe?
!! Il dizionario (dict).
?? A che serve ensure_ascii=False?
!! A scrivere le lettere accentate come sono, invece che come codici di escape.

@@section s6-8 | L4 | - | Scegliere il database giusto
Non esiste un database migliore in assoluto. La scelta dipende da come sono fatti i dati e da come si usano.

| Situazione | Scelta ragionevole | Perché |
|---|---|---|
| Registro voti di una scuola | Relazionale | Dati regolari, legami precisi tra studenti, classi, materie |
| Catalogo di prodotti con caratteristiche diverse | Documentale | Ogni prodotto ha campi diversi |
| Misure di sensori ogni secondo | Database per serie temporali o relazionale | Moltissimi record tutti dello stesso tipo |
| Rete di amicizie o di citazioni | A grafo | I collegamenti sono la parte importante |
| Dati temporanei di una sessione web | Chiave-valore | Accesso molto veloce per chiave |

## Progetto di fine anno
Scegliere un tema legato a un'altra disciplina (laboratorio di fisica, catalogo delle specie, tavola periodica, biblioteca scolastica) e:
1. Disegnare il modello E-R.
2. Creare le tabelle con sqlite3 e inserire almeno 15 record.
3. Scrivere cinque interrogazioni SQL, di cui una con JOIN e una con GROUP BY.
4. Rappresentare lo stesso dato come documento JSON e commentare i vantaggi e gli svantaggi.

?? Un'applicazione di un negozio online salva ogni ordine con prodotti diversi e dati variabili. Quale modello conviene?
!! Spesso quello documentale, perché un ordine è un documento autonomo con campi che possono variare. Per la contabilità, invece, servono transazioni e quindi spesso un database relazionale.
?? Perché si scrive il modello E-R prima di creare le tabelle?
!! Perché permette di capire quali entità e quali legami servono e di evitare ripetizioni, prima di fissare la struttura nel database.

/* ===================== LESSICO ===================== */
const KEYWORDS = new Set(['False','None','True','and','as','assert','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield']);
const OPS = ['**=','//=','>>=','<<=','...','->','==','!=','<=','>=','+=','-=','*=','/=','%=','&=','|=','^=','**','//','<<','>>','+','-','*','/','%','@','&','|','^','~','<','>','(',')','[',']','{','}',',',':','.',';','='];
const STR_PREFIX = new Set(['', 'r', 'f', 'b', 'u', 'rf', 'fr', 'br', 'rb']);

function unescapePy(s) {
  return s.replace(/\\(\n|[\\'"abfnrtv]|x[0-9a-fA-F]{2}|u[0-9a-fA-F]{4}|U[0-9a-fA-F]{8}|[0-7]{1,3})/g, (m, c) => {
    switch (c[0]) {
      case '\n': return '';
      case '\\': return '\\';
      case "'": return "'";
      case '"': return '"';
      case 'a': return '\x07';
      case 'b': return '\b';
      case 'f': return '\f';
      case 'n': return '\n';
      case 'r': return '\r';
      case 't': return '\t';
      case 'v': return '\v';
      case 'x': case 'u': return String.fromCharCode(parseInt(c.slice(1), 16));
      case 'U': return String.fromCodePoint(parseInt(c.slice(1), 16));
      default: return String.fromCharCode(parseInt(c, 8));
    }
  });
}

function tokenize(src, baseLine) {
  src = src.replace(/\r\n?/g, '\n');
  if (!src.endsWith('\n')) src += '\n';
  const toks = [];
  const n = src.length;
  let i = 0, line = baseLine || 1, depth = 0, atStart = true;
  const indents = [0];
  const push = (t, v) => { const k = { t, v, line }; toks.push(k); return k; };
  const numRe = /0[xX][0-9a-fA-F_]+|0[oO][0-7_]+|0[bB][01_]+|(?:\d[\d_]*\.?[\d_]*|\.\d[\d_]*)(?:[eE][+-]?\d+)?/y;
  const nameRe = /[\p{L}_][\p{L}\p{N}_]*/uy;
  const strRe = /([A-Za-z]{0,2})('''|"""|'|")/y;
  while (i < n) {
    if (atStart && depth === 0) {
      let col = 0, j = i;
      while (j < n && (src[j] === ' ' || src[j] === '\t')) { col += src[j] === '\t' ? 8 - (col % 8) : 1; j++; }
      if (j >= n) break;
      if (src[j] === '\n') { i = j + 1; line++; continue; }
      if (src[j] === '#') { while (j < n && src[j] !== '\n') j++; i = j + 1; line++; continue; }
      if (col > indents[indents.length - 1]) { indents.push(col); push('INDENT'); }
      else {
        while (col < indents[indents.length - 1]) { indents.pop(); push('DEDENT'); }
        if (col !== indents[indents.length - 1]) throw new PySyntaxError('IndentationError', 'unindent does not match any outer indentation level', line);
      }
      i = j; atStart = false;
    }
    const c = src[i];
    if (c === '\n') {
      i++;
      if (depth > 0) { line++; continue; }
      push('NEWLINE'); line++; atStart = true; continue;
    }
    if (c === ' ' || c === '\t' || c === '\f') { i++; continue; }
    if (c === '\\' && src[i + 1] === '\n') { i += 2; line++; continue; }
    if (c === '#') { while (i < n && src[i] !== '\n') i++; continue; }
    // stringhe
    strRe.lastIndex = i;
    let m = strRe.exec(src);
    if (m && STR_PREFIX.has(m[1].toLowerCase())) {
      const prefix = m[1].toLowerCase(), quote = m[2], triple = quote.length === 3;
      const raw = prefix.indexOf('r') >= 0, isF = prefix.indexOf('f') >= 0;
      let j = i + m[0].length, body = '';
      const startLine = line;
      for (;;) {
        if (j >= n) throw new PySyntaxError('SyntaxError', 'unterminated string literal (detected at line ' + line + ')', startLine);
        const ch = src[j];
        if (!triple && ch === '\n') throw new PySyntaxError('SyntaxError', 'unterminated string literal (detected at line ' + line + ')', startLine);
        if (src.startsWith(quote, j)) { j += quote.length; break; }
        if (ch === '\\') { body += ch + (src[j + 1] || ''); if (src[j + 1] === '\n') line++; j += 2; continue; }
        if (ch === '\n') line++;
        body += ch; j++;
      }
      if (isF) push('FSTR', body).raw = raw;
      else push('STR', raw ? body : unescapePy(body));
      i = j; continue;
    }
    // numeri
    if ((c >= '0' && c <= '9') || (c === '.' && src[i + 1] >= '0' && src[i + 1] <= '9')) {
      numRe.lastIndex = i;
      m = numRe.exec(src);
      const text = m[0].replace(/_/g, '');
      const isHex = /^0[xXoObB]/.test(text);
      if (!isHex && /[.eE]/.test(text)) push('NUM', Number(text));
      else {
        if (!isHex && text.length > 1 && text[0] === '0' && /[1-9]/.test(text)) throw new PySyntaxError('SyntaxError', 'leading zeros in decimal integer literals are not permitted; use an 0o prefix for octal integers', line);
        push('NUM', BigInt(text));
      }
      i += m[0].length;
      if (i < n && /[\p{L}_]/u.test(src[i])) throw new PySyntaxError('SyntaxError', 'invalid decimal literal', line);
      continue;
    }
    // nomi
    nameRe.lastIndex = i;
    m = nameRe.exec(src);
    if (m) { push('NAME', m[0]); i += m[0].length; continue; }
    // operatori
    let op = null;
    for (const o of OPS) if (src.startsWith(o, i)) { op = o; break; }
    if (!op) throw new PySyntaxError('SyntaxError', "invalid character '" + c + "'", line);
    if (op === '(' || op === '[' || op === '{') depth++;
    else if (op === ')' || op === ']' || op === '}') { depth--; if (depth < 0) throw new PySyntaxError('SyntaxError', "unmatched '" + op + "'", line); }
    push('OP', op); i += op.length;
  }
  if (depth > 0) throw new PySyntaxError('SyntaxError', "'(' was never closed", line);
  const last = toks[toks.length - 1];
  if (last && last.t !== 'NEWLINE' && last.t !== 'DEDENT' && last.t !== 'INDENT') push('NEWLINE');
  while (indents.length > 1) { indents.pop(); push('DEDENT'); }
  push('EOF');
  return toks;
}

/* ===================== PARSER ===================== */
const AUG_OPS = ['+=','-=','*=','/=','//=','%=','**=','&=','|=','^=','<<=','>>='];

class Parser {
  constructor(toks) { this.t = toks; this.i = 0; }
  get tok() { return this.t[this.i]; }
  peek(k) { return this.t[Math.min(this.i + (k || 0), this.t.length - 1)]; }
  next() { return this.t[this.i++]; }
  isOp(v) { const k = this.tok; return k.t === 'OP' && k.v === v; }
  isKw(v) { const k = this.tok; return k.t === 'NAME' && k.v === v; }
  acceptOp(v) { if (this.isOp(v)) { this.i++; return true; } return false; }
  acceptKw(v) { if (this.isKw(v)) { this.i++; return true; } return false; }
  err(msg) { throw new PySyntaxError('SyntaxError', msg || 'invalid syntax', this.tok.line); }
  expectOp(v, msg) { if (!this.acceptOp(v)) this.err(msg || "expected '" + v + "'"); }
  expectKw(v) { if (!this.acceptKw(v)) this.err("expected '" + v + "'"); }
  name() {
    const k = this.tok;
    if (k.t !== 'NAME' || KEYWORDS.has(k.v)) this.err();
    this.i++; return k.v;
  }

  parseFile() {
    const body = [];
    while (this.tok.t !== 'EOF') {
      if (this.tok.t === 'NEWLINE') { this.i++; continue; }
      body.push(...this.statement());
    }
    return body;
  }

  statement() {
    const k = this.tok;
    if (k.t === 'INDENT') throw new PySyntaxError('IndentationError', 'unexpected indent', k.line);
    if (k.t === 'DEDENT') this.err();
    if (k.t === 'NAME') {
      switch (k.v) {
        case 'if': return [this.ifStmt()];
        case 'while': return [this.whileStmt()];
        case 'for': return [this.forStmt()];
        case 'def': return [this.funcDef([])];
        case 'class': return [this.classDef([])];
        case 'try': return [this.tryStmt()];
        case 'with': this.err("l'istruzione 'with' non è supportata in questo editor");
        case 'async': this.err('async non è supportato in questo editor');
      }
    }
    if (k.t === 'OP' && k.v === '@') return [this.decorated()];
    return this.simpleLine();
  }

  simpleLine() {
    const out = [this.simple()];
    while (this.acceptOp(';')) {
      if (this.tok.t === 'NEWLINE' || this.tok.t === 'EOF') break;
      out.push(this.simple());
    }
    if (this.tok.t === 'NEWLINE') this.i++;
    else if (this.tok.t !== 'EOF') this.err();
    return out;
  }

  block(what, line) {
    if (this.tok.t === 'NEWLINE') {
      this.i++;
      if (this.tok.t !== 'INDENT') throw new PySyntaxError('IndentationError', 'expected an indented block after ' + what + ' on line ' + line, this.tok.line);
      this.i++;
      const body = [];
      while (this.tok.t !== 'DEDENT' && this.tok.t !== 'EOF') {
        if (this.tok.t === 'NEWLINE') { this.i++; continue; }
        body.push(...this.statement());
      }
      if (this.tok.t === 'DEDENT') this.i++;
      return body;
    }
    if (this.tok.t === 'EOF') throw new PySyntaxError('IndentationError', 'expected an indented block after ' + what + ' on line ' + line, this.tok.line);
    return this.simpleLine();
  }

  noAssignHere() {
    if (this.isOp('=')) this.err("invalid syntax. Maybe you meant '==' or ':=' instead of '='?");
  }

  ifStmt() {
    const line = this.next().line;
    const test = this.test();
    this.noAssignHere();
    this.expectOp(':');
    const body = this.block("'if' statement", line);
    let orelse = [];
    if (this.isKw('elif')) { this.tok.v = 'if'; orelse = [this.ifStmt()]; }
    else if (this.isKw('else')) { const l = this.next().line; this.expectOp(':'); orelse = this.block("'else' statement", l); }
    return { k: 'If', test, body, orelse, line };
  }
  whileStmt() {
    const line = this.next().line;
    const test = this.test();
    this.noAssignHere();
    this.expectOp(':');
    const body = this.block("'while' statement", line);
    let orelse = [];
    if (this.isKw('else')) { const l = this.next().line; this.expectOp(':'); orelse = this.block("'else' statement", l); }
    return { k: 'While', test, body, orelse, line };
  }
  forStmt() {
    const line = this.next().line;
    const target = this.targetList();
    this.checkTarget(target);
    this.expectKw('in');
    const iter = this.testList();
    this.expectOp(':');
    const body = this.block("'for' statement", line);
    let orelse = [];
    if (this.isKw('else')) { const l = this.next().line; this.expectOp(':'); orelse = this.block("'else' statement", l); }
    return { k: 'For', target, iter, body, orelse, line };
  }
  tryStmt() {
    const line = this.next().line;
    this.expectOp(':');
    const body = this.block("'try' statement", line);
    const handlers = [];
    let orelse = [], finalbody = [];
    while (this.isKw('except')) {
      const l = this.next().line;
      let type = null, name = null;
      if (!this.isOp(':')) { type = this.test(); if (this.acceptKw('as')) name = this.name(); }
      this.expectOp(':');
      handlers.push({ type, name, body: this.block("'except' statement", l), line: l });
    }
    if (handlers.length && this.isKw('else')) { const l = this.next().line; this.expectOp(':'); orelse = this.block("'else' statement", l); }
    if (this.isKw('finally')) { const l = this.next().line; this.expectOp(':'); finalbody = this.block("'finally' statement", l); }
    if (!handlers.length && !finalbody.length) throw new PySyntaxError('SyntaxError', "expected 'except' or 'finally' block", this.tok.line);
    return { k: 'Try', body, handlers, orelse, finalbody, line };
  }
  decorated() {
    const decorators = [];
    while (this.isOp('@')) {
      this.i++;
      decorators.push(this.test());
      if (this.tok.t !== 'NEWLINE') this.err();
      this.i++;
    }
    if (this.isKw('def')) return this.funcDef(decorators);
    if (this.isKw('class')) return this.classDef(decorators);
    this.err();
  }
  params(end) {
    const ps = [];
    let seenStar = false;
    while (!this.isOp(end)) {
      if (this.acceptOp('**')) ps.push({ name: this.name(), kind: 'kwarg', default: null });
      else if (this.acceptOp('*')) {
        if (this.isOp(',')) seenStar = true;
        else { ps.push({ name: this.name(), kind: 'vararg', default: null }); seenStar = true; }
      } else {
        const nm = this.name();
        let def = null;
        if (end === ')' && this.acceptOp(':')) this.test();
        if (this.acceptOp('=')) def = this.test();
        ps.push({ name: nm, default: def, kind: seenStar ? 'kwonly' : 'pos' });
      }
      if (!this.acceptOp(',')) break;
    }
    return ps;
  }
  funcDef(decorators) {
    const line = this.next().line;
    const name = this.name();
    this.expectOp('(');
    const params = this.params(')');
    this.expectOp(')');
    if (this.acceptOp('->')) this.test();
    this.expectOp(':');
    const body = this.block('function definition', line);
    return { k: 'FuncDef', name, params, body, decorators, line };
  }
  classDef(decorators) {
    const line = this.next().line;
    const name = this.name();
    const bases = [];
    if (this.acceptOp('(')) {
      while (!this.isOp(')')) { bases.push(this.test()); if (!this.acceptOp(',')) break; }
      this.expectOp(')');
    }
    this.expectOp(':');
    const body = this.block('class definition', line);
    return { k: 'ClassDef', name, bases, body, decorators, line };
  }

  endOfSimple() { const k = this.tok; return k.t === 'NEWLINE' || k.t === 'EOF' || (k.t === 'OP' && k.v === ';'); }

  simple() {
    const k = this.tok, line = k.line;
    if (k.t === 'NAME') {
      switch (k.v) {
        case 'pass': this.i++; return { k: 'Pass', line };
        case 'break': this.i++; return { k: 'Break', line };
        case 'continue': this.i++; return { k: 'Continue', line };
        case 'return': { this.i++; let e = null; if (!this.endOfSimple()) e = this.testList(); return { k: 'Return', e, line }; }
        case 'global': case 'nonlocal': {
          this.i++;
          const names = [this.name()];
          while (this.acceptOp(',')) names.push(this.name());
          return { k: k.v === 'global' ? 'Global' : 'Nonlocal', names, line };
        }
        case 'import': return this.importStmt();
        case 'from': return this.fromStmt();
        case 'raise': {
          this.i++;
          let e = null;
          if (!this.endOfSimple()) { e = this.test(); if (this.acceptKw('from')) this.test(); }
          return { k: 'Raise', e, line };
        }
        case 'assert': {
          this.i++;
          const test = this.test();
          let msg = null;
          if (this.acceptOp(',')) msg = this.test();
          return { k: 'Assert', test, msg, line };
        }
        case 'del': {
          this.i++;
          const targets = [this.bitOr()];
          while (this.acceptOp(',')) targets.push(this.bitOr());
          return { k: 'Del', targets, line };
        }
        case 'yield': this.err("'yield' (generatori) non è supportato in questo editor");
        case 'else': case 'elif': case 'except': case 'finally': this.err();
      }
    }
    return this.exprStmt();
  }

  dottedName() {
    let nm = this.name();
    while (this.acceptOp('.')) nm += '.' + this.name();
    return nm;
  }
  importStmt() {
    const line = this.next().line;
    const names = [];
    do {
      const name = this.dottedName();
      let asname = null;
      if (this.acceptKw('as')) asname = this.name();
      names.push({ name, asname });
    } while (this.acceptOp(','));
    return { k: 'Import', names, line };
  }
  fromStmt() {
    const line = this.next().line;
    const mod = this.dottedName();
    this.expectKw('import');
    if (this.acceptOp('*')) return { k: 'ImportFrom', mod, names: '*', line };
    const paren = this.acceptOp('(');
    const names = [];
    do {
      if (paren && this.isOp(')')) break;
      const name = this.name();
      let asname = null;
      if (this.acceptKw('as')) asname = this.name();
      names.push({ name, asname });
    } while (this.acceptOp(','));
    if (paren) this.expectOp(')');
    return { k: 'ImportFrom', mod, names, line };
  }

  checkTarget(t, aug) {
    switch (t.k) {
      case 'Name': case 'Attr': case 'Sub': return;
      case 'Tuple': case 'List':
        if (aug) break;
        t.elts.forEach(e => e.k === 'Star' ? this.checkTarget(e.e) : this.checkTarget(e));
        return;
    }
    const what = { Const: 'literal', Call: 'function call', BinOp: 'expression', Compare: 'comparison', BoolOp: 'expression', UnaryOp: 'expression' }[t.k] || 'expression';
    throw new PySyntaxError('SyntaxError', 'cannot assign to ' + what, t.line || this.tok.line);
  }

  exprStmt() {
    const line = this.tok.line;
    const first = this.testList();
    if (this.isOp('=')) {
      const targets = [first];
      let value;
      while (this.acceptOp('=')) {
        value = this.testList();
        if (this.isOp('=')) targets.push(value);
      }
      targets.forEach(t => this.checkTarget(t));
      return { k: 'Assign', targets, value, line };
    }
    if (this.tok.t === 'OP' && AUG_OPS.indexOf(this.tok.v) >= 0) {
      const op = this.next().v.slice(0, -1);
      this.checkTarget(first, true);
      const value = this.testList();
      return { k: 'AugAssign', target: first, op, value, line };
    }
    if (this.isOp(':') && (first.k === 'Name' || first.k === 'Attr')) {
      this.i++;
      this.test();
      if (this.acceptOp('=')) return { k: 'Assign', targets: [first], value: this.testList(), line };
      return { k: 'Pass', line };
    }
    return { k: 'Expr', e: first, line };
  }

  exprEnd() {
    const k = this.tok;
    if (k.t === 'NEWLINE' || k.t === 'EOF') return true;
    if (k.t === 'OP') return [')', ']', '}', '=', ':', ';'].indexOf(k.v) >= 0 || AUG_OPS.indexOf(k.v) >= 0;
    return false;
  }
  testList() {
    const line = this.tok.line;
    const first = this.testOrStar();
    if (!this.isOp(',')) return first;
    const elts = [first];
    while (this.acceptOp(',')) { if (this.exprEnd()) break; elts.push(this.testOrStar()); }
    return { k: 'Tuple', elts, line };
  }
  testOrStar() {
    if (this.isOp('*')) { this.i++; return { k: 'Star', e: this.bitOr() }; }
    return this.test();
  }
  targetList() {
    const line = this.tok.line;
    const first = this.targetItem();
    if (!this.isOp(',')) return first;
    const elts = [first];
    while (this.acceptOp(',')) { if (this.isKw('in') || this.isOp('=')) break; elts.push(this.targetItem()); }
    return { k: 'Tuple', elts, line };
  }
  targetItem() {
    if (this.acceptOp('*')) return { k: 'Star', e: this.bitOr() };
    return this.bitOr();
  }

  test() {
    if (this.isKw('lambda')) return this.lambda();
    const e = this.orTest();
    if (this.isKw('if')) {
      const line = this.next().line;
      const cond = this.orTest();
      this.expectKw('else');
      const other = this.test();
      return { k: 'IfExp', test: cond, body: e, orelse: other, line };
    }
    return e;
  }
  lambda() {
    const line = this.next().line;
    const params = this.params(':');
    this.expectOp(':');
    const body = this.test();
    return { k: 'Lambda', params, body, line };
  }
  orTest() {
    const first = this.andTest();
    if (!this.isKw('or')) return first;
    const vals = [first];
    while (this.acceptKw('or')) vals.push(this.andTest());
    return { k: 'BoolOp', op: 'or', vals, line: first.line };
  }
  andTest() {
    const first = this.notTest();
    if (!this.isKw('and')) return first;
    const vals = [first];
    while (this.acceptKw('and')) vals.push(this.notTest());
    return { k: 'BoolOp', op: 'and', vals, line: first.line };
  }
  notTest() {
    if (this.isKw('not')) { const line = this.next().line; return { k: 'UnaryOp', op: 'not', e: this.notTest(), line }; }
    return this.comparison();
  }
  comparison() {
    const first = this.bitOr();
    const ops = [];
    for (;;) {
      let op = null;
      const k = this.tok;
      if (k.t === 'OP' && ['<', '>', '==', '!=', '<=', '>='].indexOf(k.v) >= 0) { op = k.v; this.i++; }
      else if (k.t === 'NAME') {
        if (k.v === 'in') { op = 'in'; this.i++; }
        else if (k.v === 'not' && this.peek(1).t === 'NAME' && this.peek(1).v === 'in') { op = 'not in'; this.i += 2; }
        else if (k.v === 'is') { this.i++; op = this.acceptKw('not') ? 'is not' : 'is'; }
      }
      if (!op) break;
      ops.push({ op, e: this.bitOr() });
    }
    return ops.length ? { k: 'Compare', first, ops, line: first.line } : first;
  }
  level(sub, ops) {
    let l = sub.call(this);
    while (this.tok.t === 'OP' && ops.indexOf(this.tok.v) >= 0) {
      const t = this.next();
      const r = sub.call(this);
      l = { k: 'BinOp', op: t.v, l, r, line: t.line };
    }
    return l;
  }
  bitOr() { return this.level(this.bitXor, ['|']); }
  bitXor() { return this.level(this.bitAnd, ['^']); }
  bitAnd() { return this.level(this.shift, ['&']); }
  shift() { return this.level(this.arith, ['<<', '>>']); }
  arith() { return this.level(this.term, ['+', '-']); }
  term() { return this.level(this.factor, ['*', '/', '//', '%', '@']); }
  factor() {
    const k = this.tok;
    if (k.t === 'OP' && (k.v === '-' || k.v === '+' || k.v === '~')) {
      this.i++;
      return { k: 'UnaryOp', op: k.v, e: this.factor(), line: k.line };
    }
    return this.power();
  }
  power() {
    const base = this.primary();
    if (this.isOp('**')) {
      const line = this.next().line;
      return { k: 'BinOp', op: '**', l: base, r: this.factor(), line };
    }
    return base;
  }
  primary() {
    let e = this.atom();
    for (;;) {
      const k = this.tok;
      if (k.t !== 'OP') break;

function all(){
  const map={};
  baseList.forEach(b=>{map[b.id]=Object.assign({},b,{_base:true});});

    const o=overrides[id]||{};

  const prev=overrides[id];overrides[id]=data;

function cpuWidget(root){
  const id='cpu'+(++UID);
  const PROG=['LOAD 6','ADD 7','STORE 8','HALT','','','12','30','0',''],N=PROG.length;
  root.innerHTML='<div class="wg-h">Mini computer a 10 celle</div>'+
    '<p class="wg-note">Le celle contengono sia istruzioni sia dati, come nell\'idea di Von Neumann. Puoi cambiare i valori e riavviare.</p>'+
    '<div class="regs"><div class="reg"><b>PC</b><span data-r="pc"></span></div><div class="reg"><b>IR</b><span data-r="ir"></span></div><div class="reg"><b>ACC</b><span data-r="acc"></span></div></div>'+
    '<div class="phases" aria-hidden="true"><span>Fetch</span><span>Decode</span><span>Execute</span></div>'+
    '<div class="mem">'+PROG.map((p,i)=>'<label class="cell"><span class="addr">Cella '+i+'</span><input id="'+id+'-m'+i+'" value="'+esc(p)+'" spellcheck="false" autocomplete="off"></label>').join('')+'</div>'+
    '<p class="cpu-log" role="status" aria-live="polite"></p>'+
    '<div class="wg-btns"><button type="button" class="btn primary" data-a="step">Passo</button><button type="button" class="btn" data-a="run">Esegui</button><button type="button" class="btn" data-a="reset">Riavvia</button><button type="button" class="btn" data-a="restore">Ripristina esempio</button></div>';
  const ins=$$('.mem input',root),cells=$$('.cell',root),ph=$$('.phases span',root),log=$('.cpu-log',root);
  const R=k=>$('[data-r='+k+']',root),stepB=$('[data-a=step]',root),runB=$('[data-a=run]',root);
  let pc=0,ir='',acc=0,phase=0,halted=false,op=null,arg=null,touch=-1,timer=null;
  const say=(t,e)=>{log.textContent=t;log.classList.toggle('err',!!e);};
  function stopT(){if(timer){clearInterval(timer);timer=null;}runB.textContent='Esegui';}
  function paint(){
    R('pc').textContent=pc;R('ir').textContent=ir||'—';R('acc').textContent=acc;
    ph.forEach((p,i)=>p.classList.toggle('on',!halted&&i===phase));
    cells.forEach((c,i)=>{c.classList.toggle('pc',!halted&&phase===0&&i===pc);c.classList.toggle('touch',i===touch);});
    stepB.disabled=halted;
  }
  function fail(m){halted=true;stopT();say(m,true);paint();}
  function step(){
    if(halted)return;
    if(!root.isConnected){stopT();return;}
    if(phase===0){
      if(pc>=N){fail('Il PC punta fuori dalla memoria: la CPU si ferma.');return;}
      ir=ins[pc].value.trim().toUpperCase();touch=pc;
      say('FETCH: la CPU legge la cella '+pc+' ("'+(ir||'vuota')+'"), la copia in IR e porta PC a '+(pc+1)+'.');
      pc++;phase=1;
    }else if(phase===1){
      const m=/^(LOAD|ADD|SUB|STORE)\s+(\d+)$/.exec(ir);
      if(m){
        op=m[1];arg=parseInt(m[2],10);
        if(arg>=N){fail('DECODE: la cella '+arg+' non esiste. Le celle vanno da 0 a '+(N-1)+'.');return;}
        say('DECODE: l\'unità di controllo riconosce '+op+' sulla cella '+arg+'.');
      }else if(ir==='HALT'){op='HALT';arg=null;say('DECODE: istruzione HALT, il programma sta per fermarsi.');}
      else{fail('DECODE: "'+(ir||'cella vuota')+'" non è un\'istruzione valida. La CPU si ferma.');return;}
      phase=2;
    }else{
      if(op==='HALT'){halted=true;stopT();say('EXECUTE: HALT. Programma terminato con ACC = '+acc+'.');}
      else if(op==='STORE'){ins[arg].value=String(acc);touch=arg;say('EXECUTE: STORE scrive '+acc+' nella cella '+arg+'.');phase=0;}
      else{
        const t=ins[arg].value.trim();
        if(!/^-?\d+$/.test(t)){fail('EXECUTE: la cella '+arg+' contiene "'+(t||'niente')+'", non un numero.');return;}
        const n=parseInt(t,10);touch=arg;
        if(op==='LOAD'){acc=n;say('EXECUTE: LOAD copia '+n+' dalla cella '+arg+' in ACC.');}
        else if(op==='ADD'){acc+=n;say('EXECUTE: ADD somma '+n+' ad ACC, che ora vale '+acc+'.');}
        else{acc-=n;say('EXECUTE: SUB sottrae '+n+' da ACC, che ora vale '+acc+'.');}
        phase=0;
      }
    }
    paint();
  }
  function reset(){stopT();pc=0;ir='';acc=0;phase=0;halted=false;op=null;arg=null;touch=-1;say('Pronto. Premi Passo per eseguire una fase alla volta.');paint();}
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='step'){stopT();step();}
    else if(a==='run'){if(timer){stopT();}else if(!halted){runB.textContent='Pausa';timer=setInterval(step,380);}}
    else if(a==='reset')reset();
    else if(a==='restore'){ins.forEach((x,i)=>{x.value=PROG[i];});reset();}
  });
  reset();
}

    setTimeout(()=>{
      let buf='';
      const r=window.PyInterp.run(c,{inputs:inputs,echoInput:true,maxMs:6000,write:s=>{buf+=s;}});
      out.textContent+=buf;finish(r);
    },30);
  }
  function run(){
    if(current)return;
    clearAll();
    const inputs=inp.value.length?inp.value.split('\n'):[];
    current={code:code.value,inputs:inputs,started:false};
    const w=mkWorker();
    if(!w){const c=current;current=null;runMain(c.code,c.inputs);return;}
    setBusy(true);
    const my=current;
    let timer=setTimeout(()=>{if(current===my&&!my.started){/* il worker non risponde: passa alla modalità semplice */workerBad=true;try{w.terminate();}catch(e){}worker=null;current=null;runMain(my.code,my.inputs);}},2500);
    w.onmessage=ev=>{
      const d=ev.data;
      if(d.t==='ready'||d.t==='out'||d.t==='done'){my.started=true;clearTimeout(timer);}
      if(current!==my)return;
      if(d.t==='out')out.textContent+=d.s;
      else if(d.t==='done'){finish(d.r);}
    };
    w.postMessage({code:my.code,inputs:my.inputs,maxMs:20000});
  }
  bRun.addEventListener('click',run);
  bStop.addEventListener('click',()=>{
    if(!current||!worker)return;
    try{worker.terminate();}catch(e){}worker=null;current=null;setBusy(false);
    errb.hidden=true;st.textContent='Programma fermato.';out.textContent+='\n[fermato]';
  });
}

};

/* ---------- disegno della pagina ---------- */
function buildChips(){
  $('#chips').innerHTML=CLASSES.map(c=>'<button type="button" class="chip" style="--cc:var('+c.v+')" data-cls="'+c.id+'" aria-pressed="false" title="'+esc(c.name)+'">'+sym(c,16)+'<span>'+esc(c.short)+'</span></button>').join('');
}
function syncChips(){
  $$('#chips .chip').forEach(b=>b.setAttribute('aria-pressed',filter.has(b.dataset.cls)?'true':'false'));
  $('#clearF').hidden=filter.size===0;
}
function syncUi(){
  const be=$('#btnEdit');
  be.hidden=!canWrite;be.setAttribute('aria-pressed',editOn?'true':'false');be.textContent=editOn?'Fine modifica':'Modifica';
  $('#btnSrc').hidden=mode!=='local';
  $('#sync').textContent=mode==='db'?(canWrite?'Modifiche condivise con i colleghi':'Sola lettura'):'Modifiche salvate solo in questo browser';
  const n=$('#editNote');n.hidden=!(editOn&&canWrite);
  n.textContent=mode==='db'?'Modalità modifica attiva. Ogni salvataggio è subito visibile a tutti i colleghi che hanno accesso a questa pagina.':'Modalità modifica attiva. Le modifiche restano solo in questo browser. Per condividerle con i colleghi apri la pagina con il tuo account.';
}
function toolsHtml(s,i,n){
  if(!(editOn&&canWrite))return '';
  if(confirmState&&confirmState.id===s.id){
    const del=confirmState.kind==='del';
    return '<div class="tools-s"><span class="conf">'+(del?'Eliminare questa sezione?':'Tornare al testo originale?')+'</span><button class="tb danger" type="button" data-act="'+(del?'delyes':'restyes')+'">Sì</button><button class="tb" type="button" data-act="no">Annulla</button></div>';
  }
  return '<div class="tools-s"><button class="tb" type="button" data-act="edit">Modifica</button><button class="tb" type="button" data-act="up" aria-label="Sposta su"'+(i===0?' disabled':'')+'>↑</button><button class="tb" type="button" data-act="down" aria-label="Sposta giù"'+(i===n-1?' disabled':'')+'>↓</button>'+(s._over&&s._base?'<button class="tb" type="button" data-act="rest">Ripristina originale</button>':'')+'<button class="tb danger" type="button" data-act="del">Elimina</button></div>';
}
const SYNTAX=['## Sottotitolo','Testo con **grassetto** e `codice`.','- elenco puntato','1. elenco numerato','> [Fisica] Esempio tratto da un\'altra materia','| Colonna A | Colonna B |','|---|---|','| dato | dato |','?? Domanda con risposta nascosta','!! Risposta alla domanda','','Codice colorato: una riga con ```python (oppure sql, json),','il codice, poi una riga con ```','Risultato o schema senza colori: ```output ... ```'].join('\n');
function editorHtml(s){
  const p='ed-'+s.id;
  const chk=CLASSES.map(c=>'<label class="chip chk" style="--cc:var('+c.v+')"><input type="checkbox" name="cls" value="'+c.id+'" id="'+p+'-c-'+c.id+'"'+(s.classes.indexOf(c.id)>=0?' checked':'')+'>'+sym(c,16)+'<span>'+esc(c.short)+'</span></label>').join('');
  const opts='<option value="">Nessuno</option>'+Object.keys(WIDGETS).map(k=>'<option value="'+k+'"'+(s.widget===k?' selected':'')+'>'+esc(WIDGETS[k].label)+'</option>').join('');
  return '<form class="editor" data-id="'+esc(s.id)+'" novalidate>'+
    '<div class="fld"><label for="'+p+'-t">Titolo della sezione</label><input id="'+p+'-t" name="title" type="text" value="'+esc(s.title)+'" maxlength="140"></div>'+
    '<fieldset class="fld"><legend>Classi a cui è destinata</legend><div class="chips">'+chk+'</div></fieldset>'+
    '<div class="fld"><label for="'+p+'-w">Strumento interattivo in fondo alla sezione</label><select id="'+p+'-w" name="widget">'+opts+'</select></div>'+matsEditor(s,p)+
    '<div class="ed-grid"><div class="fld"><label for="'+p+'-b">Contenuto</label><textarea id="'+p+'-b" name="body" spellcheck="true">'+esc(s.body)+'</textarea></div><div class="fld"><span class="lbl">Anteprima</span><div class="prose preview">'+renderBody(s.body)+'</div></div></div>'+
    '<details class="syntax"><summary>Come si scrive il contenuto</summary><pre>'+esc(SYNTAX)+'</pre></details>'+
    '<p class="ed-err" role="alert" hidden></p>'+
    '<div class="ed-act"><button class="btn primary" type="submit">Salva</button><button class="btn" type="button" data-act="cancel">Annulla</button></div></form>';
}
function sectionNode(s,i,n){
  const isEd=editing.has(s.id),cached=nodes[s.id];
  if(isEd&&cached&&cached.editing)return cached.el;
  const tools=editOn&&canWrite;
  const sig=JSON.stringify([s.title,s.body,s.classes,s.widget,s.materials,isEd,tools,confirmState&&confirmState.id===s.id?confirmState.kind:'',!!s._over,!!s._custom,i===0,i===n-1]);
  if(cached&&cached.sig===sig)return cached.el;
  const el=document.createElement('article');el.className='sec';el.id='sec-'+s.id;
  const band='<div class="band" aria-hidden="true">'+s.classes.map(c=>'<span style="background:var('+CL[c].v+')"></span>').join('')+'</div>';
  if(isEd&&tools){
    el.innerHTML=band+'<div class="sec-in"><div class="sec-h"><div class="sec-t"><div class="tags">'+s.classes.map(c=>tag(CL[c])).join('')+'</div><h3>Modifica sezione</h3></div></div>'+editorHtml(s)+'</div>';
  }else{
    el.innerHTML=band+'<div class="sec-in"><div class="sec-h"><div class="sec-t"><div class="tags">'+s.classes.map(c=>tag(CL[c])).join('')+'</div><h3>'+esc(s.title)+'</h3></div>'+toolsHtml(s,i,n)+'</div><div class="prose">'+renderBody(s.body)+'</div>'+(s.widget&&WIDGETS[s.widget]?'<section class="wg" aria-label="'+esc(WIDGETS[s.widget].label)+'"></section>':'')+matsHtml(s)+'</div>';
    const slot=$('.wg',el);
    if(slot){try{WIDGETS[s.widget].fn(slot);}catch(e){slot.textContent='Lo strumento interattivo non si è caricato.';}}
  }
  nodes[s.id]={sig:sig,el:el,editing:isEd&&tools};
  return el;
}
function renderToc(vs){
  let h='';
  chapters.forEach(ch=>{
    const l=vs.filter(s=>s.chapter===ch.id);if(!l.length)return;
    h+='<div class="toc-ch"><a class="toc-cht" href="#chap-'+ch.id+'" data-go="chap-'+ch.id+'"><b>'+esc(ch.num)+'</b>'+esc(ch.title)+'</a><ul>'+l.map(s=>'<li><a href="#sec-'+s.id+'" data-go="sec-'+s.id+'"><span class="mini">'+s.classes.map(c=>sym(CL[c],10)).join('')+'</span><span>'+esc(s.title)+'</span></a></li>').join('')+'</ul></div>';
  });
  $('#toc').innerHTML=h||'<p class="empty">Nessuna sezione per le classi scelte.</p>';
}
function render(){
  const secs=all(),vs=secs.filter(visible);
  syncChips();renderToc(vs);
  $('#count').textContent=vs.length+(vs.length===1?' sezione':' sezioni');
  const main=$('#main'),frag=document.createDocumentFragment(),used={};
  chapters.forEach(ch=>{
    const list=vs.filter(s=>s.chapter===ch.id);
    if(!list.length&&!editOn)return;
    const sec=document.createElement('section');sec.className='chap';sec.id='chap-'+ch.id;
    const cs=CLASSES.filter(c=>secs.some(s=>s.chapter===ch.id&&!s.deleted&&s.classes.indexOf(c.id)>=0));
    sec.innerHTML='<header class="chap-h"><span class="num" aria-hidden="true">'+esc(ch.num)+'</span><div><h2>'+esc(ch.title)+'</h2><p>'+esc(ch.desc)+'</p><div class="tags">'+cs.map(tag).join('')+'</div></div></header><div class="secs"></div>';
    const holder=$('.secs',sec);
    list.forEach((s,i)=>{used[s.id]=1;holder.appendChild(sectionNode(s,i,list.length));});
    if(!list.length)holder.innerHTML='<p class="empty">Nessuna sezione di questo capitolo per le classi scelte.</p>';
    if(editOn&&canWrite){const b=document.createElement('button');b.type='button';b.className='btn add';b.dataset.act='add';b.dataset.chapter=ch.id;b.textContent='+ Aggiungi una sezione a questo capitolo';sec.appendChild(b);}
    frag.appendChild(sec);
  });
  if(!frag.childNodes.length){const p=document.createElement('p');p.className='empty';p.textContent='Nessuna sezione corrisponde alle classi scelte.';frag.appendChild(p);}
  const hidden=secs.filter(s=>s.deleted);
  if(editOn&&canWrite&&hidden.length){
    const d=document.createElement('details');d.className='hid';
    d.innerHTML='<summary>Sezioni eliminate ('+hidden.length+')</summary><ul>'+hidden.map(s=>'<li data-id="'+esc(s.id)+'"><span>'+esc(s.title)+'</span><button class="tb" type="button" data-act="undel" data-id="'+esc(s.id)+'">Ripristina</button></li>').join('')+'</ul>';
    frag.appendChild(d);
  }
  main.replaceChildren(frag);
  Object.keys(nodes).forEach(k=>{if(!used[k])delete nodes[k];});
}

/* ---------- azioni ---------- */
async function move(id,dir){
  const vs=all().filter(visible),me=vs.find(s=>s.id===id);if(!me)return;
  const same=vs.filter(s=>s.chapter===me.chapter),i=same.findIndex(s=>s.id===id),nb=same[i+dir];if(!nb)return;
  if(me.order===nb.order){await put(me.id,Object.assign(fields(me),{order:nb.order+(dir<0?-1:1)}));}
  else{const a=me.order,b=nb.order;await put(me.id,Object.assign(fields(me),{order:b}));await put(nb.id,Object.assign(fields(nb),{order:a}));}
  render();
}
async function addSection(chId){
  const secs=all().filter(s=>s.chapter===chId);
  const order=secs.reduce((m,s)=>Math.max(m,s.order===9999?0:s.order),0)+10;
  const id='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const classes=filter.size?Array.from(filter):[CLASSES[0].id];
  await put(id,{chapter:chId,order:order,title:'Nuova sezione',body:'## Sottotitolo\nScrivi qui il contenuto.',classes:classes,widget:'',deleted:false,custom:true});
  newIds.add(id);editing.add(id);render();
  const f=$('#sec-'+id+' input[name=title]');if(f){f.focus();f.select();}
  const el=document.getElementById('sec-'+id);if(el)el.scrollIntoView({block:'start'});
}
async function saveEditor(form){
  const id=form.dataset.id,s=all().find(x=>x.id===id);if(!s)return;
  const err=$('.ed-err',form),title=form.elements.title.value.trim();
  const classes=$$('input[name=cls]:checked',form).map(x=>x.value);
  if(!title){err.textContent='Scrivi un titolo.';err.hidden=false;return;}
  if(!classes.length){err.textContent='Scegli almeno una classe.';err.hidden=false;return;}
  const mats=[];let badUrl=false;
  $$('.matrow',form).forEach(r=>{
    const u=$('[name=murl]',r).value.trim();if(!u)return;
    const cu=cleanUrl(u);if(!cu){badUrl=true;return;}
    mats.push({kind:$('[name=mkind]',r).value,title:$('[name=mtitle]',r).value.trim(),url:cu});
  });
  if(badUrl){err.textContent='Un indirizzo non è valido: deve iniziare con https:// oppure con allegati/.';err.hidden=false;return;}
  const data=Object.assign(fields(s),{title:title,classes:classes,body:form.elements.body.value.replace(/\s+$/,''),widget:form.elements.widget.value,materials:mats,deleted:false});
  try{await put(id,data);newIds.delete(id);editing.delete(id);render();toast('Sezione salvata.');}catch(e){writeError(e);}
}
async function act(a,id,btn){
  try{
    if(a==='edit'){editing.add(id);confirmState=null;render();const f=$('#sec-'+id+' input[name=title]');if(f)f.focus();}
    else if(a==='cancel'){editing.delete(id);if(newIds.has(id)){newIds.delete(id);await del(id);}render();}
    else if(a==='up')await move(id,-1);
    else if(a==='down')await move(id,1);
    else if(a==='del'){confirmState={id:id,kind:'del'};render();}
    else if(a==='rest'){confirmState={id:id,kind:'rest'};render();}
    else if(a==='no'){confirmState=null;render();}
    else if(a==='delyes'){
      confirmState=null;const s=all().find(x=>x.id===id);
      if(s){if(s._custom)await del(id);else await put(id,Object.assign(fields(s),{deleted:true}));}
      render();toast('Sezione eliminata. In fondo alla pagina puoi ripristinarla.');
    }
    else if(a==='restyes'){confirmState=null;await del(id);render();toast('Testo originale ripristinato.');}
    else if(a==='undel'){const rid=btn.dataset.id,s=all().find(x=>x.id===rid);if(s){await put(rid,Object.assign(fields(s),{deleted:false}));render();}}
    else if(a==='add')await addSection(btn.dataset.chapter);
  }catch(e){writeError(e);}
}

function exportMd(){
  const vs=all().filter(visible);
  let out='# Informatica in Classe\n\n';
  if(filter.size)out+='Classi: '+CLASSES.filter(c=>filter.has(c.id)).map(c=>c.name).join('; ')+'\n\n';
  chapters.forEach(ch=>{
    const l=vs.filter(s=>s.chapter===ch.id);if(!l.length)return;
    out+='## '+ch.num+'. '+ch.title+'\n\n';
    l.forEach(s=>{
      const body=s.body.replace(/^## /gm,'#### ').replace(/^\?\? /gm,'**Domanda:** ').replace(/^!! /gm,'**Risposta:** ');
      out+='### '+s.title+'\n\n_Classi: '+s.classes.map(c=>CL[c].name).join('; ')+'_\n\n'+body+'\n\n'+(s.materials.length?'**Materiali della lezione**\n'+s.materials.map(m=>'- '+(m.title||MKINDS[m.kind].label)+': '+m.url).join('\n')+'\n\n':'');
    });
  });
  saveFile('informatica-in-classe.md',out);
}
function exportSrc(){
  const secs=all().filter(s=>!s.deleted&&s.classes.length);
  let out='';
  chapters.forEach(ch=>{
    out+='@@chapter '+ch.id+' | '+ch.num+' | '+ch.title+' | '+ch.desc+'\n\n';
    secs.filter(s=>s.chapter===ch.id).forEach(s=>{
      out+='@@section '+s.id+' | '+s.classes.join(' ')+' | '+(s.widget||'-')+' | '+s.title.replace(/\|/g,'/')+'\n'+s.materials.map(m=>'@@material '+m.kind+' | '+m.title.replace(/\|/g,'/')+' | '+m.url+'\n').join('')+s.body+'\n\n';
    });
  });
  saveFile('content.txt',out.trim()+'\n');
}
function saveFile(name,text){
  if(dl){
    dl.save({filename:name,data:text}).then(()=>toast('File salvato.')).catch(e=>{if(!e||e.code!=='declined')toast('Non è stato possibile salvare il file.');});
    return;
  }
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));
    a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('File scaricato.');
  }catch(e){toast('Non è stato possibile salvare il file.');}
}

/* ---------- eventi ---------- */
function bind(){
  $('#chips').addEventListener('click',e=>{
    const b=e.target.closest('.chip');if(!b)return;const id=b.dataset.cls;
    if(filter.has(id))filter.delete(id);else filter.add(id);
    lsSet(LS_FILTER,Array.from(filter));render();
  });
  $('#clearF').addEventListener('click',()=>{filter.clear();lsSet(LS_FILTER,[]);render();});
  $('#btnEdit').addEventListener('click',async()=>{
    editOn=!editOn;
    if(!editOn){
      const drop=Array.from(newIds);editing.clear();newIds.clear();confirmState=null;
      for(const id of drop){try{await del(id);}catch(e){}}
    }
    syncUi();render();
  });
  $('#btnExport').addEventListener('click',exportMd);
  $('#btnSrc').addEventListener('click',exportSrc);
  const main=$('#main');
  main.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    if(b.dataset.act==='addmat'){
      const box=$('.mats',b.closest('form'));
      box.insertAdjacentHTML('beforeend',matRow(b.dataset.p,{kind:'slides',title:'',url:''}));
      const f=$('input[name=mtitle]',box.lastElementChild);if(f)f.focus();
      return;
    }
    if(b.dataset.act==='delmat'){b.closest('.matrow').remove();return;}
    const art=b.closest('article');act(b.dataset.act,art?art.id.slice(4):b.dataset.id,b);
  });
  main.addEventListener('submit',e=>{const f=e.target.closest('form.editor');if(!f)return;e.preventDefault();saveEditor(f);});
  main.addEventListener('input',e=>{
    const f=e.target.closest('form.editor');
    if(f&&e.target.name==='body')$('.preview',f).innerHTML=renderBody(e.target.value);
  });
  const mq=window.matchMedia('(min-width:900px)'),box=$('#tocBox');
  const sync=()=>{box.open=mq.matches;};
  sync();if(mq.addEventListener)mq.addEventListener('change',sync);
  $('#toc').addEventListener('click',e=>{
    const a=e.target.closest('[data-go]');if(!a)return;
    e.preventDefault();
    const t=document.getElementById(a.dataset.go);
    if(t)t.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
    if(!mq.matches)box.open=false;
  });
}

/* ---------- avvio ---------- */
async function initStore(){
  const c=window.claude;
  try{dbh=c&&c.use?await c.use('db'):null;}catch(e){dbh=null;}
  try{const u=c&&c.use?await c.use('user'):null;if(u){const w=await u.can('data.write');if(w===false)canWrite=false;}}catch(e){}
  try{dl=c&&c.use?await c.use('downloads'):null;}catch(e){dl=null;}
  if(dbh){
    mode='db';
    dbh.collection('sections').onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{const x=d.data();if(x)o[d.id]=Object.assign({},x);});
      overrides=o;render();
    },err=>{if(err&&err.code==='revoked'){canWrite=false;editOn=false;syncUi();render();}else toast('Il collegamento con il salvataggio condiviso si è interrotto.');});
  }else{mode='local';overrides=lsGet(LS_OV,{})||{};}
  syncUi();render();
}
buildChips();bind();syncChips();render();
initStore();
})();
